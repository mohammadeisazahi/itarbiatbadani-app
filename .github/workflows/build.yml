name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --platforms=android --project-name itarbiatbadani_app build_app

      - name: Copy application files
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          cp -r lib build_app/lib

      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build Android APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-app
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
