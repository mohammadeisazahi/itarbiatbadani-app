name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # ========== ساخت پوشه android ==========
      - name: Create android folder
        run: |
          flutter create --platforms=android --project-name itarbiatbadani --org ir .
          echo "✅ android folder created"
          ls -la android/

      # ========== پاک کردن وابستگی‌های قدیمی ==========
      - name: Clean old dependencies
        run: |
          rm -f pubspec.lock
          flutter clean
          echo "✅ Cleaned old dependencies"

      # ========== تنظیم نام برنامه ==========
      - name: Configure app label
        run: |
          sed -i 's/android:label="[^"]*"/android:label="تربیت بدنی و علوم ورزشی"/' \
            android/app/src/main/AndroidManifest.xml
          echo "✅ Android configured"

      # ========== دریافت وابستگی‌های جدید ==========
      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        continue-on-error: true
        run: dart run flutter_native_splash:create

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            pubspec.lock
            android/app/build.gradle
            android/build.gradle
            android/app/src/main/AndroidManifest.xml
