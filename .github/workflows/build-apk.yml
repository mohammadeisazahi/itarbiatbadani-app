class LatestPostsSection extends StatelessWidget {
  const LatestPostsSection({super.key});

  @override
  Widget build(BuildContext context) {
    return FutureBuilder<List<PostModel>>(
      future: WordPressApi.latestPosts(),
      builder: (context, snapshot) {
        if (snapshot.connectionState == ConnectionState.waiting) {
          return const Center(
            child: Padding(
              padding: EdgeInsets.all(30),
              child: CircularProgressIndicator(
                color: primaryColor,
              ),
            ),
          );
        }

        if (snapshot.hasError) {
          return ErrorBox(
            message:
                'دریافت نوشته‌ها با مشکل مواجه شد.\nاتصال اینترنت را بررسی کنید.',
            onRetry: () {
              Navigator.pushReplacement(
                context,
                MaterialPageRoute(
                  builder: (_) => const HomePage(),
                ),
              );
            },
          );
        }

        final posts = snapshot.data ?? [];

        if (posts.isEmpty) {
          return const EmptyBox(
            message: 'نوشته‌ای برای نمایش وجود ندارد.',
          );
        }

        return Column(
          children: posts
              .map(
                (post) => Padding(
                  padding: const EdgeInsets.only(bottom: 12),
                  child: PostCard(post: post),
                ),
              )
              .toList(),
        );
      },
    );
  }
}

