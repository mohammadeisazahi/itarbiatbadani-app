name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # 1. دریافت پروژه
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # -----------------------------
      # 2. نصب Flutter
      # -----------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true


      # -----------------------------
      # 3. ساخت پروژه Flutter
      # -----------------------------
      - name: Create Flutter project
        run: |
          flutter create \
            --project-name itarbiatbadani_app \
            --org ir.itarbiatbadani \
            --platforms android \
            app


      # -----------------------------
      # 4. نصب پکیج‌ها
      # -----------------------------
      - name: Add packages
        working-directory: app
        run: |
          flutter pub add http
          flutter pub add url_launcher
          flutter pub add cached_network_image
          flutter pub add flutter_launcher_icons


      # -----------------------------
      # 5. دریافت لوگوی سایت
      # -----------------------------
      - name: Download website logo
        run: |
          mkdir -p app/assets

          curl -L \
            "https://itarbiatbadani.ir/wp-content/uploads/2025/07/1000073463.png" \
            -o app/assets/logo.png


      # -----------------------------
      # 6. تنظیم آیکون برنامه
      # -----------------------------
      - name: Configure launcher icon
        working-directory: app
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/logo.png"
            adaptive_icon_background: "#0A3D62"
            adaptive_icon_foreground: "assets/logo.png"
          EOF


      # -----------------------------
      # 7. ساخت main.dart
      # -----------------------------
      - name: Write application
        working-directory: app
        run: |
          cat > lib/main.dart <<'DART'

          import 'dart:convert';

          import 'package:cached_network_image/cached_network_image.dart';
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:url_launcher/url_launcher.dart';


          // =========================================================
          // اطلاعات اصلی سایت
          // =========================================================

          const String siteUrl = 'https://itarbiatbadani.ir';

          const String apiUrl =
              '$siteUrl/wp-json/wp/v2';


          // رنگ‌های اصلی سایت
          const Color primaryColor =
              Color(0xFF0A3D62);

          const Color secondaryColor =
              Color(0xFF3C6382);

          const Color goldColor =
              Color(0xFFFBC531);


          // =========================================================
          // شروع برنامه
          // =========================================================

          void main() {

            WidgetsFlutterBinding.ensureInitialized();

            runApp(const MyApp());
          }


          // =========================================================
          // برنامه اصلی
          // =========================================================

          class MyApp extends StatelessWidget {

            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {

              return MaterialApp(

                debugShowCheckedModeBanner: false,

                title:
                    'تربیت بدنی و علوم ورزشی',

                theme: ThemeData(

                  useMaterial3: true,

                  colorScheme:
                      ColorScheme.fromSeed(
                    seedColor: primaryColor,
                  ),

                  scaffoldBackgroundColor:
                      const Color(0xFFF5F7FA),

                  appBarTheme:
                      const AppBarTheme(
                    backgroundColor:
                        primaryColor,
                    foregroundColor:
                        Colors.white,
                    centerTitle: true,
                  ),
                ),

                home:
                    const Directionality(
                  textDirection:
                      TextDirection.rtl,
                  child:
                      MainNavigation(),
                ),
              );
            }
          }


          // =========================================================
          // باز کردن لینک
          // =========================================================

          Future<void> openUrl(String url) async {

            if (url == '#' ||
                url.trim().isEmpty) {
              return;
            }

            final Uri uri =
                Uri.parse(url);

            try {

              await launchUrl(
                uri,
                mode:
                    LaunchMode.externalApplication,
              );

            } catch (_) {}
          }


          // =========================================================
          // پاک کردن HTML
          // =========================================================

          String cleanHtml(String text) {

            return text
                .replaceAll(
                  RegExp(r'<[^>]*>'),
                  '',
                )
                .replaceAll(
                  '&nbsp;',
                  ' ',
                )
                .replaceAll(
                  '&amp;',
                  '&',
                )
                .replaceAll(
                  '&quot;',
                  '"',
                )
                .replaceAll(
                  '&#8217;',
                  '’',
                )
                .replaceAll(
                  '&#8211;',
                  '–',
                )
                .replaceAll(
                  '&#8230;',
                  '…',
                )
                .trim();
          }


          // =========================================================
          // تاریخ
          // =========================================================

          String formatDate(String date) {

            try {

              final parsed =
                  DateTime.parse(date);

              return
                  '${parsed.year}/'
                  '${parsed.month.toString().padLeft(2, '0')}/'
                  '${parsed.day.toString().padLeft(2, '0')}';

            } catch (_) {

              return '';
            }
          }


          // =========================================================
          // مدل مطالب
          // =========================================================

          class PostItem {

            final int id;

            final String title;

            final String link;

            final String excerpt;

            final String date;

            final String image;


            PostItem({
              required this.id,
              required this.title,
              required this.link,
              required this.excerpt,
              required this.date,
              required this.image,
            });


            factory PostItem.fromJson(
              Map<String, dynamic> json,
            ) {

              String image = '';

              try {

                final embedded =
                    json['_embedded'];

                final media =
                    embedded?[
                        'wp:featuredmedia'];

                if (media is List &&
                    media.isNotEmpty) {

                  image =
                      media[0]['source_url']
                              ?.toString() ??
                          '';
                }

              } catch (_) {}


              return PostItem(

                id:
                    json['id'] ?? 0,

                title:
                    cleanHtml(
                  json['title']
                          ?['rendered']
                          ?.toString() ??
                      '',
                ),

                link:
                    json['link']
                            ?.toString() ??
                        siteUrl,

                excerpt:
                    cleanHtml(
                  json['excerpt']
                          ?['rendered']
                          ?.toString() ??
                      '',
                ),

                date:
                    json['date']
                            ?.toString() ??
                        '',

                image:
                    image,
              );
            }
          }


          // =========================================================
          // مدل دسته‌بندی
          // =========================================================

          class CategoryItem {

            final int id;

            final String name;

            final int parent;

            final int count;

            final String link;


            CategoryItem({
              required this.id,
              required this.name,
              required this.parent,
              required this.count,
              required this.link,
            });


            factory CategoryItem.fromJson(
              Map<String, dynamic> json,
            ) {

              return CategoryItem(

                id:
                    json['id'] ?? 0,

                name:
                    json['name']
                            ?.toString() ??
                        '',

                parent:
                    json['parent'] ?? 0,

                count:
                    json['count'] ?? 0,

                link:
                    json['link']
                            ?.toString() ??
                        '',
              );
            }
          }


          // =========================================================
          // دریافت 6 مطلب جدید
          // =========================================================

          Future<List<PostItem>>
              fetchLatestPosts() async {

            final uri =
                Uri.parse(
              '$apiUrl/posts'
              '?per_page=6'
              '&orderby=date'
              '&order=desc'
              '&_embed',
            );


            final response =
                await http.get(uri).timeout(
              const Duration(seconds: 20),
            );


            if (response.statusCode != 200) {

              throw Exception(
                'خطا در دریافت مطالب',
              );
            }


            final List<dynamic> data =
                jsonDecode(response.body);


            return data
                .map(
                  (item) =>
                      PostItem.fromJson(item),
                )
                .toList();
          }


          // =========================================================
          // دریافت مطالب دسته
          // =========================================================

          Future<List<PostItem>>
              fetchCategoryPosts(
            int categoryId,
          ) async {

            final uri =
                Uri.parse(
              '$apiUrl/posts'
              '?categories=$categoryId'
              '&per_page=30'
              '&orderby=date'
              '&order=desc'
              '&_embed',
            );


            final response =
                await http.get(uri).timeout(
              const Duration(seconds: 20),
            );


            if (response.statusCode != 200) {

              throw Exception(
                'خطا در دریافت مطالب دسته‌بندی',
              );
            }


            final List<dynamic> data =
                jsonDecode(response.body);


            return data
                .map(
                  (item) =>
                      PostItem.fromJson(item),
                )
                .toList();
          }


          // =========================================================
          // دریافت تمام دسته‌بندی‌های وردپرس
          // =========================================================

          Future<List<CategoryItem>>
              fetchAllCategories() async {

            final List<CategoryItem>
                result = [];

            int page = 1;


            while (true) {

              final uri =
                  Uri.parse(
                '$apiUrl/categories'
                '?per_page=100'
                '&hide_empty=false'
                '&page=$page'
                '&orderby=name'
                '&order=asc',
              );


              final response =
                  await http.get(uri).timeout(
                const Duration(seconds: 20),
              );


              if (response.statusCode == 400 &&
                  page > 1) {

                break;
              }


              if (response.statusCode != 200) {

                throw Exception(
                  'خطا در دریافت دسته‌بندی‌ها',
                );
              }


              final List<dynamic> data =
                  jsonDecode(response.body);


              if (data.isEmpty) {

                break;
              }


              result.addAll(
                data.map(
                  (item) =>
                      CategoryItem.fromJson(
                    item,
                  ),
                ),
              );


              if (data.length < 100) {

                break;
              }


              page++;
            }


            return result;
          }


          // =========================================================
          // آیکون دسته‌بندی
          // =========================================================

          IconData categoryIcon(
            String name,
          ) {

            final text =
                name.toLowerCase();


            if (text.contains('تغذیه')) {

              return Icons.restaurant_menu;
            }


            if (text.contains('تمرین') ||
                text.contains('آمادگی') ||
                text.contains('بدنسازی')) {

              return Icons.fitness_center;
            }


            if (text.contains('فیزیولوژی')) {

              return Icons
                  .monitor_heart_outlined;
            }


            if (text.contains('روان')) {

              return Icons.psychology_outlined;
            }


            if (text.contains('مدیریت')) {

              return Icons
                  .business_center_outlined;
            }


            if (text.contains('پژوهش') ||
                text.contains('تحقیق')) {

              return Icons.science_outlined;
            }


            if (text.contains('آموزش') ||
                text.contains('درس')) {

              return Icons.school_outlined;
            }


            if (text.contains('ورزش')) {

              return Icons.sports_soccer;
            }


            if (text.contains('مقال')) {

              return Icons.article_outlined;
            }


            if (text.contains('دانشگاه')) {

              return Icons
                  .account_balance_outlined;
            }


            return Icons.category_outlined;
          }


          // =========================================================
          // خدمات سایت
          // =========================================================

