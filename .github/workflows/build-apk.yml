name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create \
            --project-name itarbiatbadani_app \
            --org ir.itarbiatbadani \
            --platforms android \
            app

      - name: Add packages
        working-directory: app
        run: |
          flutter pub add http
          flutter pub add url_launcher
          flutter pub add cached_network_image
          flutter pub add flutter_launcher_icons

      - name: Download website logo
        run: |
          mkdir -p app/assets
          curl -L \
            "https://itarbiatbadani.ir/wp-content/uploads/2025/07/1000073463.png" \
            -o app/assets/logo.png

      - name: Configure launcher icon
        working-directory: app
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/logo.png"
            adaptive_icon_background: "#0A3D62"
            adaptive_icon_foreground: "assets/logo.png"
          EOF

      - name: Write application
        working-directory: app
        run: |
          cat > lib/main.dart <<'DART'
          import 'dart:convert';

          import 'package:cached_network_image/cached_network_image.dart';
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:url_launcher/url_launcher.dart';

          const String siteUrl = 'https://itarbiatbadani.ir';
          const String apiUrl = '$siteUrl/wp-json/wp/v2';

          const Color primaryColor = Color(0xFF0A3D62);
          const Color secondaryColor = Color(0xFF3C6382);
          const Color goldColor = Color(0xFFFBC531);

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'تربیت بدنی و علوم ورزشی',
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: primaryColor,
                  ),
                  scaffoldBackgroundColor: const Color(0xFFF5F7FA),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: primaryColor,
                    foregroundColor: Colors.white,
                    centerTitle: true,
                  ),
                ),
                home: const Directionality(
                  textDirection: TextDirection.rtl,
                  child: MainNavigation(),
                ),
              );
            }
          }

          Future<void> openUrl(String url) async {
            if (url == '#' || url.trim().isEmpty) return;

            final uri = Uri.parse(url);

            try {
              await launchUrl(
                uri,
                mode: LaunchMode.externalApplication,
              );
            } catch (_) {}
          }

          String cleanHtml(String text) {
            return text
                .replaceAll(RegExp(r'<[^>]*>'), '')
                .replaceAll('&nbsp;', ' ')
                .replaceAll('&amp;', '&')
                .replaceAll('&quot;', '"')
                .replaceAll('&#8217;', '’')
                .replaceAll('&#8211;', '–')
                .replaceAll('&#8230;', '…')
                .trim();
          }

          String formatDate(String date) {
            try {
              final parsed = DateTime.parse(date);
              return '${parsed.year}/${parsed.month.toString().padLeft(2, '0')}/${parsed.day.toString().padLeft(2, '0')}';
            } catch (_) {
              return '';
            }
          }

          class PostItem {
            final int id;
            final String title;
            final String link;
            final String excerpt;
            final String date;
            final String image;

            PostItem({
              required this.id,
              required this.title,
              required this.link,
              required this.excerpt,
              required this.date,
              required this.image,
            });

            factory PostItem.fromJson(Map<String, dynamic> json) {
              String image = '';

              try {
                final embedded = json['_embedded'];
                final media = embedded?['wp:featuredmedia'];

                if (media is List && media.isNotEmpty) {
                  image = media[0]['source_url']?.toString() ?? '';
                }
              } catch (_) {}

              return PostItem(
                id: json['id'] ?? 0,
                title: cleanHtml(
                  json['title']?['rendered']?.toString() ?? '',
                ),
                link: json['link']?.toString() ?? siteUrl,
                excerpt: cleanHtml(
                  json['excerpt']?['rendered']?.toString() ?? '',
                ),
                date: json['date']?.toString() ?? '',
                image: image,
              );
            }
          }

          class CategoryItem {
            final int id;
            final String name;
            final int parent;
            final int count;
            final String link;

            CategoryItem({
              required this.id,
              required this.name,
              required this.parent,
              required this.count,
              required this.link,
            });

            factory CategoryItem.fromJson(Map<String, dynamic> json) {
              return CategoryItem(
                id: json['id'] ?? 0,
                name: json['name']?.toString() ?? '',
                parent: json['parent'] ?? 0,
                count: json['count'] ?? 0,
                link: json['link']?.toString() ?? '',
              );
            }
          }

          Future<List<PostItem>> fetchLatestPosts() async {
            final uri = Uri.parse(
              '$apiUrl/posts?per_page=6&orderby=date&order=desc&_embed',
            );

            final response = await http
                .get(uri)
                .timeout(const Duration(seconds: 20));

            if (response.statusCode != 200) {
              throw Exception('خطا در دریافت مطالب');
            }

            final List<dynamic> data = jsonDecode(response.body);

            return data
                .map((item) => PostItem.fromJson(item))
                .toList();
          }

          Future<List<PostItem>> fetchCategoryPosts(int categoryId) async {
            final uri = Uri.parse(
              '$apiUrl/posts?categories=$categoryId&per_page=30&orderby=date&order=desc&_embed',
            );

            final response = await http
                .get(uri)
                .timeout(const Duration(seconds: 20));

            if (response.statusCode != 200) {
              throw Exception('خطا در دریافت مطالب دسته‌بندی');
            }

            final List<dynamic> data = jsonDecode(response.body);

            return data
                .map((item) => PostItem.fromJson(item))
                .toList();
          }

          Future<List<CategoryItem>> fetchAllCategories() async {
            final List<CategoryItem> result = [];
            int page = 1;

            while (true) {
              final uri = Uri.parse(
                '$apiUrl/categories?per_page=100&hide_empty=false&page=$page&orderby=name&order=asc',
              );

              final response = await http
                  .get(uri)
                  .timeout(const Duration(seconds: 20));

              if (response.statusCode == 400 && page > 1) {
                break;
              }

              if (response.statusCode != 200) {
                throw Exception('خطا در دریافت دسته‌بندی‌ها');
              }

              final List<dynamic> data = jsonDecode(response.body);

              if (data.isEmpty) {
                break;
              }

              result.addAll(
                data.map((item) => CategoryItem.fromJson(item)),
              );

              if (data.length < 100) {
                break;
              }

              page++;
            }

            return result;
          }

          IconData categoryIcon(String name) {
            final text = name.toLowerCase();

            if (text.contains('تغذیه')) {
              return Icons.restaurant_menu;
            }

            if (text.contains('تمرین') ||
                text.contains('آمادگی') ||
                text.contains('بدنسازی')) {
              return Icons.fitness_center;
            }

            if (text.contains('فیزیولوژی')) {
              return Icons.monitor_heart_outlined;
            }

            if (text.contains('روان')) {
              return Icons.psychology_outlined;
            }

            if (text.contains('مدیریت')) {
              return Icons.business_center_outlined;
            }

            if (text.contains('پژوهش') ||
                text.contains('تحقیق')) {
              return Icons.science_outlined;
            }

            if (text.contains('آموزش') ||
                text.contains('درس')) {
              return Icons.school_outlined;
            }

            if (text.contains('ورزش')) {
              return Icons.sports_soccer;
            }

            if (text.contains('مقال')) {
              return Icons.article_outlined;
            }

            if (text.contains('دانشگاه')) {
              return Icons.account_balance_outlined;
            }

            return Icons.category_outlined;
          }

          class ServiceItem {
            final String title;
            final String url;
            final IconData icon;
            final bool disabled;

            const ServiceItem({
              required this.title,
              required this.url,
              required this.icon,
              this.disabled = false,
            });
          }

          const List<ServiceItem> services = [
            ServiceItem(
              title: 'معرفی رشته',
              url:
                  '$siteUrl/introduction-to-the-field-of-physical-education-and-sports-sciences/',
              icon: Icons.info_outline,
            ),
            ServiceItem(
              title: 'گرایش‌های ارشد',
              url:
                  '$siteUrl/%da%af%d8%b1%d8%a7%db%8c%d8%b4%d9%87%d8%a7%db%8c-%da%a9%d8%a7%d8%b1%d8%b4%d9%86%d8%a7%d8%b3%db%8c-%d8%a7%d8%b1%d8%b4%d8%af-%d8%aa%d8%b1%d8%a8%db%8c%d8%aa-%d8%a8%d8%af%d9%86%db%8c-%d9%88/',
              icon: Icons.layers_outlined,
            ),
            ServiceItem(
              title: 'گرایش‌های دکتری',
              url: '$siteUrl/sports-science-phd-exam-resources/',
              icon: Icons.school_outlined,
            ),
            ServiceItem(
              title: 'منابع ارشد',
              url: '$siteUrl/master-of-sports-science-resources/',
              icon: Icons.menu_book_outlined,
            ),
            ServiceItem(
              title: 'منابع دکتری',
              url: '$siteUrl/manabe-konkur-doctori-tarbiat-badani/',
              icon: Icons.chrome_reader_mode_outlined,
            ),
            ServiceItem(
              title: 'منابع استخدامی',
              url: '#',
              icon: Icons.assignment_outlined,
              disabled: true,
            ),
            ServiceItem(
              title: 'دانشگاه‌های برتر',
              url: '$siteUrl/physical-education-sports-science/',
              icon: Icons.account_balance_outlined,
            ),
            ServiceItem(
              title: 'بازار کار',
              url:
                  '$siteUrl/job-market-in-physical-education-and-sports-sciences/',
              icon: Icons.work_outline,
            ),
            ServiceItem(
              title: 'طرح درس',
              url:
                  '$siteUrl/product-category/%d8%b7%d8%b1%d8%ad-%d8%af%d8%b1%d8%b3-%d8%b1%d9%88%d8%b2%d8%a7%d9%86%d9%87-%d9%85%d8%a7%d9%87%d8%a7%d9%86%d9%87-%d8%b3%d8%a7%d9%84%d8%a7%d9%86%d9%87/',
              icon: Icons.co_present_outlined,
            ),
            ServiceItem(
              title: 'پاورپوینت',
              url: '$siteUrl/product-category/powerpoint/',
              icon: Icons.slideshow_outlined,
            ),
          ];

          class MainNavigation extends StatefulWidget {
            const MainNavigation({super.key});

            @override
            State<MainNavigation> createState() => _MainNavigationState();
          }

          class _MainNavigationState extends State<MainNavigation> {
            int currentIndex = 0;

            final pages = const [
              HomePage(),
              CategoriesPage(),
              StorePage(),
              TelegramPage(),
              MorePage(),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: IndexedStack(
                  index: currentIndex,
                  children: pages,
                ),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: currentIndex,
                  onDestinationSelected: (index) {
                    setState(() {
                      currentIndex = index;
                    });
                  },
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.home_outlined),
                      selectedIcon: Icon(Icons.home),
                      label: 'خانه',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.category_outlined),
                      selectedIcon: Icon(Icons.category),
                      label: 'دسته‌بندی‌ها',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.storefront_outlined),
                      selectedIcon: Icon(Icons.storefront),
                      label: 'فروشگاه',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.send_outlined),
                      selectedIcon: Icon(Icons.send),
                      label: 'تلگرام',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.more_horiz),
                      selectedIcon: Icon(Icons.more),
                      label: 'بیشتر',
                    ),
                  ],
                ),
              );
            }
          }

          class HomePage extends StatelessWidget {
            const HomePage({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'تربیت بدنی و علوم ورزشی',
                    style: TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                ),
                body: RefreshIndicator(
                  onRefresh: () async {
                    await Future.wait([
                      fetchLatestPosts(),
                    ]);
                  },
                  child: ListView(
                    physics: const AlwaysScrollableScrollPhysics(),
                    padding: const EdgeInsets.fromLTRB(16, 16, 16, 28),
                    children: const [
                      _WelcomeCard(),
                      SizedBox(height: 22),
                      _LatestPostsSection(),
                      SizedBox(height: 28),
                      _ServicesSection(),
                    ],
                  ),
                ),
              );
            }
          }

          class _WelcomeCard extends StatelessWidget {
            const _WelcomeCard();

            @override
            Widget build(BuildContext context) {
              return Container(
                padding: const EdgeInsets.all(22),
                decoration: BoxDecoration(
                  gradient: const LinearGradient(
                    colors: [
                      primaryColor,
                      secondaryColor,
                    ],
                  ),
                  borderRadius: BorderRadius.circular(22),
                  boxShadow: [
                    BoxShadow(
                      color: primaryColor.withOpacity(.18),
                      blurRadius: 18,
                      offset: const Offset(0, 8),
                    ),
                  ],
                ),
                child: const Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Text(
                      'مرجع تخصصی تربیت بدنی و علوم ورزشی',
                      style: TextStyle(
                        color: Colors.white,
                        fontSize: 21,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    SizedBox(height: 10),
                    Text(
                      'آخرین مطالب، منابع و خدمات تخصصی رشته تربیت بدنی و علوم ورزشی',
                      style: TextStyle(
                        color: Colors.white70,
                        height: 1.7,
                        fontSize: 14,
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class _LatestPostsSection extends StatelessWidget {
            const _LatestPostsSection();

            @override
            Widget build(BuildContext context) {
              return Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  const _SectionTitle(
                    title: 'جدیدترین مطالب',
                    icon: Icons.article_outlined,
                  ),
                  const SizedBox(height: 12),
                  FutureBuilder<List<PostItem>>(
                    future: fetchLatestPosts(),
                    builder: (context, snapshot) {
                      if (snapshot.connectionState ==
                          ConnectionState.waiting) {
                        return const Center(
                          child: Padding(
                            padding: EdgeInsets.all(30),
                            child: CircularProgressIndicator(),
                          ),
                        );
                      }

                      if (snapshot.hasError) {
                        return _ErrorCard(
                          message:
                              'دریافت مطالب از سایت انجام نشد.',
                          onRetry: () {
                            Navigator.of(context).pushReplacement(
                              MaterialPageRoute(
                                builder: (_) => const HomePage(),
                              ),
                            );
                          },
                        );
                      }

                      final posts = snapshot.data ?? [];

                      if (posts.isEmpty) {
                        return const _InfoCard(
                          text: 'هنوز مطلبی برای نمایش وجود ندارد.',
                        );
                      }

                      return Column(
                        children: posts
                            .map(
                              (post) => Padding(
                                padding:
                                    const EdgeInsets.only(bottom: 12),
                                child: PostCard(post: post),
                              ),
                            )
                            .toList(),
                      );
                    },
                  ),
                ],
              );
            }
          }

          class _ServicesSection extends StatelessWidget {
            const _ServicesSection();

            @override
            Widget build(BuildContext context) {
              return Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  const _SectionTitle(
                    title: 'خدمات ما',
                    icon: Icons.apps_outlined,
                  ),
                  const SizedBox(height: 12),
                  SizedBox(
                    height: 150,
                    child: ListView.separated(
                      scrollDirection: Axis.horizontal,
                      itemCount: services.length,
                      separatorBuilder: (_, __) =>
                          const SizedBox(width: 12),
                      itemBuilder: (context, index) {
                        final service = services[index];

                        return SizedBox(
                          width: 145,
                          child: _ServiceCard(service: service),
                        );
                      },
                    ),
                  ),
                ],
              );
            }
          }

          class _SectionTitle extends StatelessWidget {
            final String title;
            final IconData icon;

            const _SectionTitle({
              required this.title,
              required this.icon,
            });

            @override
            Widget build(BuildContext context) {
              return Row(
                children: [
                  Container(
                    padding: const EdgeInsets.all(8),
                    decoration: BoxDecoration(
                      color: goldColor.withOpacity(.16),
                      borderRadius: BorderRadius.circular(10),
                    ),
                    child: Icon(
                      icon,
                      color: primaryColor,
                      size: 21,
                    ),
                  ),
                  const SizedBox(width: 10),
                  Text(
                    title,
                    style: const TextStyle(
                      fontSize: 20,
                      fontWeight: FontWeight.bold,
                      color: primaryColor,
                    ),
                  ),
                ],
              );
            }
          }

          class PostCard extends StatelessWidget {
            final PostItem post;

            const PostCard({
              super.key,
              required this.post,
            });

            @override
            Widget build(BuildContext context) {
              return Card(
                elevation: 0,
                margin: EdgeInsets.zero,
                clipBehavior: Clip.antiAlias,
                shape: RoundedRectangleBorder(
                  borderRadius: BorderRadius.circular(18),
                  side: BorderSide(
                    color: Colors.grey.shade200,
                  ),
                ),
                child: InkWell(
                  onTap: () => openUrl(post.link),
                  child: Padding(
                    padding: const EdgeInsets.all(10),
                    child: Row(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        _PostImage(image: post.image),
                        const SizedBox(width: 12),
                        Expanded(
                          child: Column(
                            crossAxisAlignment:
                                CrossAxisAlignment.start,
                            children: [
                              Text(
                                post.title,
                                maxLines: 2,
                                overflow: TextOverflow.ellipsis,
                                style: const TextStyle(
                                  fontWeight: FontWeight.bold,
                                  fontSize: 16,
                                  height: 1.5,
                                ),
                              ),
                              const SizedBox(height: 6),
                              Text(
                                formatDate(post.date),
                                style: TextStyle(
                                  color: Colors.grey.shade600,
                                  fontSize: 12,
                                ),
                              ),
                              const SizedBox(height: 6),
                              Text(
                                post.excerpt,
                                maxLines: 2,
                                overflow: TextOverflow.ellipsis,
                                style: TextStyle(
                                  color: Colors.grey.shade700,
                                  height: 1.5,
                                  fontSize: 12.5,
                                ),
                              ),
                            ],
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class _PostImage extends StatelessWidget {
            final String image;

            const _PostImage({
              required this.image,
            });

            @override
            Widget build(BuildContext context) {
              if (image.isEmpty) {
                return Container(
                  width: 95,
                  height: 95,
                  decoration: BoxDecoration(
                    color: primaryColor.withOpacity(.08),
                    borderRadius: BorderRadius.circular(14),
                  ),
                  child: const Icon(
                    Icons.article_outlined,
                    color: primaryColor,
                    size: 35,
                  ),
                );
              }

              return ClipRRect(
                borderRadius: BorderRadius.circular(14),
                child: CachedNetworkImage(
                  imageUrl: image,
                  width: 95,
                  height: 95,
                  fit: BoxFit.cover,
                  placeholder: (_, __) => Container(
                    color: Colors.grey.shade200,
                    child: const Center(
                      child: CircularProgressIndicator(
                        strokeWidth: 2,
                      ),
                    ),
                  ),
                  errorWidget: (_, __, ___) => Container(
                    color: primaryColor.withOpacity(.08),
                    child: const Icon(
                      Icons.image_not_supported_outlined,
                      color: primaryColor,
                    ),
                  ),
                ),
              );
            }
          }

          class _ServiceCard extends StatelessWidget {
            final ServiceItem service;

            const _ServiceCard({
              required this.service,
            });

            @override
            Widget build(BuildContext context) {
              return Card(
                elevation: 0,
                margin: EdgeInsets.zero,
                color: service.disabled
                    ? Colors.grey.shade100
                    : Colors.white,
                shape: RoundedRectangleBorder(
                  borderRadius: BorderRadius.circular(18),
                  side: BorderSide(
                    color: service.disabled
                        ? Colors.grey.shade300
                        : Colors.grey.shade200,
                  ),
                ),
                child: InkWell(
                  borderRadius: BorderRadius.circular(18),
                  onTap: () {
                    if (service.disabled) {
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(
                          content: Text(
                            'این بخش به‌زودی فعال می‌شود.',
                          ),
                        ),
                      );
                    } else {
                      openUrl(service.url);
                    }
                  },
                  child: Padding(
                    padding: const EdgeInsets.all(14),
                    child: Column(
                      mainAxisAlignment:
                          MainAxisAlignment.center,
                      children: [
                        Container(
                          padding: const EdgeInsets.all(12),
                          decoration: BoxDecoration(
                            color: service.disabled
                                ? Colors.grey.shade200
                                : primaryColor.withOpacity(.08),
                            shape: BoxShape.circle,
                          ),
                          child: Icon(
                            service.icon,
                            size: 32,
                            color: service.disabled
                                ? Colors.grey
                                : primaryColor,
                          ),
                        ),
                        const SizedBox(height: 12),
                        Text(
                          service.title,
                          textAlign: TextAlign.center,
                          maxLines: 2,
                          overflow: TextOverflow.ellipsis,
                          style: TextStyle(
                            fontWeight: FontWeight.bold,
                            fontSize: 13,
                            color: service.disabled
                                ? Colors.grey
                                : primaryColor,
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class CategoriesPage extends StatelessWidget {
            const CategoriesPage({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('دسته‌بندی‌ها'),
                ),
                body: FutureBuilder<List<CategoryItem>>(
                  future: fetchAllCategories(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
                      return _ErrorCard(
                        message:
                            'دسته‌بندی‌ها از سایت دریافت نشد.',
                        onRetry: () {
                          Navigator.of(context).pushReplacement(
                            MaterialPageRoute(
                              builder: (_) =>
                                  const CategoriesPage(),
                            ),
                          );
                        },
                      );
                    }

                    final categories = snapshot.data ?? [];

                    if (categories.isEmpty) {
                      return const _InfoCard(
                        text:
                            'در حال حاضر دسته‌بندی‌ای برای نمایش وجود ندارد.',
                      );
                    }

                    final Map<int, List<CategoryItem>> children =
                        {};

                    for (final category in categories) {
                      children
                          .putIfAbsent(category.parent, () => [])
                          .add(category);
                    }

                    final roots = children[0] ?? [];

                    return ListView(
                      padding: const EdgeInsets.all(16),
                      children: roots.map((category) {
                        return _CategoryTile(
                          category: category,
                          children: children,
                        );
                      }).toList(),
                    );
                  },
                ),
              );
            }
          }

          class _CategoryTile extends StatelessWidget {
            final CategoryItem category;
            final Map<int, List<CategoryItem>> children;

            const _CategoryTile({
              required this.category,
              required this.children,
            });

            @override
            Widget build(BuildContext context) {
              final subCategories =
                  children[category.id] ?? [];

              if (subCategories.isEmpty) {
                return Card(
                  elevation: 0,
                  margin: const EdgeInsets.only(bottom: 10),
                  child: ListTile(
                    leading: CircleAvatar(
                      backgroundColor:
                          primaryColor.withOpacity(.1),
                      child: Icon(
                        categoryIcon(category.name),
                        color: primaryColor,
                      ),
                    ),
                    title: Text(
                      category.name,
                      style: const TextStyle(
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    subtitle:
                        Text('${category.count} مطلب'),
                    trailing:
                        const Icon(Icons.chevron_left),
                    onTap: () {
                      Navigator.push(
                        context,
                        MaterialPageRoute(
                          builder: (_) => CategoryPostsPage(
                            category: category,
                          ),
                        ),
                      );
                    },
                  ),
                );
              }

              return Card(
                elevation: 0,
                margin: const EdgeInsets.only(bottom: 10),
                clipBehavior: Clip.antiAlias,
                child: ExpansionTile(
                  leading: CircleAvatar(
                    backgroundColor:
                        primaryColor.withOpacity(.1),
                    child: Icon(
                      categoryIcon(category.name),
                      color: primaryColor,
                    ),
                  ),
                  title: Text(
                    category.name,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  subtitle:
                      Text('${category.count} مطلب'),
                  children: [
                    ListTile(
                      title: const Text(
                        'مشاهده مطالب این دسته',
                      ),
                      leading: const Icon(
                        Icons.article_outlined,
                        color: secondaryColor,
                      ),
                      onTap: () {
                        Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (_) => CategoryPostsPage(
                              category: category,
                            ),
                          ),
                        );
                      },
                    ),
                    ...subCategories.map(
                      (child) => ListTile(
                        contentPadding:
                            const EdgeInsets.symmetric(
                          horizontal: 28,
                        ),
                        leading: Icon(
                          categoryIcon(child.name),
                          color: secondaryColor,
                        ),
                        title: Text(child.name),
                        subtitle:
                            Text('${child.count} مطلب'),
                        trailing:
                            const Icon(Icons.chevron_left),
                        onTap: () {
                          Navigator.push(
                            context,
                            MaterialPageRoute(
                              builder: (_) =>
                                  CategoryPostsPage(
                                category: child,
                              ),
                            ),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class CategoryPostsPage extends StatelessWidget {
            final CategoryItem category;

            const CategoryPostsPage({
              super.key,
              required this.category,
            });

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(category.name),
                ),
                body: FutureBuilder<List<PostItem>>(
                  future: fetchCategoryPosts(category.id),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
                      return _ErrorCard(
                        message:
                            'مطالب این دسته دریافت نشد.',
                        onRetry: () {
                          Navigator.of(context).pushReplacement(
                            MaterialPageRoute(
                              builder: (_) =>
                                  CategoryPostsPage(
                                category: category,
                              ),
                            ),
                          );
                        },
                      );
                    }

                    final posts = snapshot.data ?? [];

                    if (posts.isEmpty) {
                      return const _InfoCard(
                        text:
                            'در این دسته هنوز مطلبی وجود ندارد.',
                      );
                    }

                    return ListView.builder(
                      padding: const EdgeInsets.all(16),
                      itemCount: posts.length,
                      itemBuilder: (_, index) {
                        return Padding(
                          padding:
                              const EdgeInsets.only(bottom: 12),
                          child: PostCard(
                            post: posts[index],
                          ),
                        );
                      },
                    );
                  },
                ),
              );
            }
          }

