          class MoreItem extends StatelessWidget {
            final IconData icon;
            final String title;
            final String subtitle;
            final VoidCallback onTap;

            const MoreItem({
              super.key,
              required this.icon,
              required this.title,
              required this.subtitle,
              required this.onTap,
            });

            @override
            Widget build(BuildContext context) {
              return Container(
                margin: const EdgeInsets.only(bottom: 12),
                child: ListTile(
                  onTap: onTap,
                  tileColor: Colors.white,
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(18),
                  ),
                  leading: Container(
                    width: 48,
                    height: 48,
                    decoration: BoxDecoration(
                      color: navy.withValues(alpha: .08),
                      borderRadius: BorderRadius.circular(14),
                    ),
                    child: Icon(icon, color: navy),
                  ),
                  title: Text(
                    title,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  subtitle: Text(subtitle),
                  trailing: const Icon(
                    Icons.arrow_back_ios_new,
                    size: 15,
                  ),
                ),
              );
            }
          }

          class WebPage extends StatefulWidget {
            final String url;
            final String title;

            const WebPage({
              super.key,
              required this.url,
              required this.title,
            });

            @override
            State<WebPage> createState() => _WebPageState();
          }

          class _WebPageState extends State<WebPage> {
            late final WebViewController controller;
            bool loading = true;

            @override
            void initState() {
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (_) {
                      if (mounted) {
                        setState(() => loading = true);
                      }
                    },
                    onPageFinished: (_) {
                      if (mounted) {
                        setState(() => loading = false);
                      }
                    },
                  ),
                )
                ..loadRequest(Uri.parse(widget.url));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(widget.title),
                  backgroundColor: navy,
                  foregroundColor: Colors.white,
                ),
                body: Stack(
                  children: [
                    WebViewWidget(controller: controller),
                    if (loading)
                      const LinearProgressIndicator(
                        color: gold,
                        backgroundColor: Colors.transparent,
                      ),
                  ],
                ),
              );
            }
          }
          DART

      - name: Remove default tests
        working-directory: app
        run: |
          rm -rf test

      - name: Change app name
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = text.replace(
              'android:label="itarbiatani_app"',
              'android:label="تربیت بدنی و علوم ورزشی"'
          )

          manifest.write_text(text)
          PY

      - name: Get packages
        working-directory: app
        run: |
          flutter pub get

      - name: Generate launcher icons
        working-directory: app
        run: |
          dart run flutter_launcher_icons

      - name: Analyze
        working-directory: app
        run: |
          flutter analyze

      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release

      - name: Rename APK
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             itarbiatbadani.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-apk
          path: itarbiatbadani.apk
