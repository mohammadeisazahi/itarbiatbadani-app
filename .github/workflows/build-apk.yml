          class ShopPage extends StatelessWidget {
            const ShopPage({super.key});

            @override
            Widget build(BuildContext context) {
              return Column(
                children: [
                  const AppHeader(
                    title: 'فروشگاه',
                  ),
                  const Expanded(
                    child: WebsitePage(
