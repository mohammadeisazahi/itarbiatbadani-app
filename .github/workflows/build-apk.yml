name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --project-name itarbiatbadani_app app

      - name: Remove default Flutter test
        working-directory: app
        run: |
          rm -f test/widget_test.dart

      - name: Add packages
        working-directory: app
        run: |
          flutter pub add webview_flutter
          flutter pub add url_launcher
          flutter pub add http
          flutter pub add --dev flutter_launcher_icons

      - name: Prepare logo
        working-directory: app
        run: |
          mkdir -p assets
          curl -L "https://itarbiatbadani.ir/wp-content/uploads/2025/07/1000073463.png" -o assets/logo.png

      - name: Configure app icon
        working-directory: app
        run: |
          cat >> pubspec.yaml <<'EOF'

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/logo.png"
            adaptive_icon_background: "#0A3D62"
            adaptive_icon_foreground: "assets/logo.png"
          EOF

      - name: Create main.dart
        working-directory: app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'dart:convert';

          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:url_launcher/url_launcher.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          const String siteUrl = 'https://itarbiatbadani.ir';

          const Color primaryColor = Color(0xFF0A3D62);
          const Color secondaryColor = Color(0xFF3C6382);
          const Color goldColor = Color(0xFFFBC531);

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const SportsApp());
          }

          class SportsApp extends StatelessWidget {
            const SportsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'تربیت بدنی و علوم ورزشی',
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: primaryColor,
                  ),
                  scaffoldBackgroundColor: const Color(0xFFF5F7FA),
                ),
                home: const MainScreen(),
              );
            }
          }

          class MainScreen extends StatefulWidget {
            const MainScreen({super.key});

            @override
            State<MainScreen> createState() => _MainScreenState();
          }

          class _MainScreenState extends State<MainScreen> {
            int currentIndex = 0;

            final pages = const [
              HomePage(),
              WebsitePage(
                title: 'مطالب ورزشی',
                url: siteUrl,
              ),
              CategoriesPage(),
              WebsitePage(
                title: 'فروشگاه',
                url: '$siteUrl/shop/',
              ),
              MorePage(),
            ];

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  body: SafeArea(
                    child: pages[currentIndex],
                  ),
                  bottomNavigationBar: NavigationBar(
                    selectedIndex: currentIndex,
                    onDestinationSelected: (index) {
                      setState(() {
                        currentIndex = index;
                      });
                    },
                    backgroundColor: Colors.white,
                    indicatorColor:
                        goldColor.withValues(alpha: .25),
                    destinations: const [
                      NavigationDestination(
                        icon: Icon(Icons.home_outlined),
                        selectedIcon: Icon(Icons.home),
                        label: 'خانه',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.article_outlined),
                        selectedIcon: Icon(Icons.article),
                        label: 'مطالب',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.category_outlined),
                        selectedIcon: Icon(Icons.category),
                        label: 'دسته‌ها',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.shopping_cart_outlined),
                        selectedIcon: Icon(Icons.shopping_cart),
                        label: 'فروشگاه',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.more_horiz),
                        selectedIcon: Icon(Icons.more_horiz),
                        label: 'بیشتر',
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class HomePage extends StatelessWidget {
            const HomePage({super.key});

            @override
            Widget build(BuildContext context) {
              return SingleChildScrollView(
                child: Column(
                  children: [
                    Container(
                      width: double.infinity,
                      padding: const EdgeInsets.fromLTRB(
                        20,
                        28,
                        20,
                        30,
                      ),
                      decoration: const BoxDecoration(
                        gradient: LinearGradient(
                          colors: [
                            primaryColor,
                            secondaryColor,
                          ],
                          begin: Alignment.topRight,
                          end: Alignment.bottomLeft,
                        ),
                      ),
                      child: Column(
                        children: [
                          Container(
                            width: 90,
                            height: 90,
                            padding: const EdgeInsets.all(10),
                            decoration: BoxDecoration(
                              color: Colors.white,
                              borderRadius:
                                  BorderRadius.circular(20),
                            ),
                            child: Image.network(
                              '$siteUrl/wp-content/uploads/2025/07/1000073463.png',
                              fit: BoxFit.contain,
                              errorBuilder: (_, __, ___) {
                                return const Icon(
                                  Icons.sports,
                                  size: 50,
                                  color: primaryColor,
                                );
                              },
                            ),
                          ),
                          const SizedBox(height: 18),
                          const Text(
                            'تربیت بدنی و علوم ورزشی',
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              color: Colors.white,
                              fontSize: 25,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 8),
                          const Text(
                            'مرجع تخصصی تربیت بدنی و علوم ورزشی',
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              color: Colors.white70,
                              fontSize: 15,
                            ),
                          ),
                        ],
                      ),
                    ),

                    const SizedBox(height: 18),

                    Padding(
                      padding:
                          const EdgeInsets.symmetric(horizontal: 16),
                      child: Column(
                        children: [
                          Row(
                            children: [
                              Expanded(
                                child: HomeCard(
                                  icon: Icons.article,
                                  title: 'مطالب ورزشی',
                                  subtitle:
                                      'مقالات و مطالب تخصصی',
                                  onTap: () {
                                    Navigator.push(
                                      context,
                                      MaterialPageRoute(
                                        builder: (_) =>
                                            const WebsitePage(
                                          title: 'مطالب ورزشی',
                                          url: siteUrl,
                                        ),
                                      ),
                                    );
                                  },
                                ),
                              ),
                              const SizedBox(width: 12),
                              Expanded(
                                child: HomeCard(
                                  icon: Icons.shopping_cart,
                                  title: 'فروشگاه',
                                  subtitle: 'محصولات ورزشی',
                                  onTap: () {
                                    Navigator.push(
                                      context,
                                      MaterialPageRoute(
                                        builder: (_) =>
                                            const WebsitePage(
                                          title: 'فروشگاه',
                                          url: '$siteUrl/shop/',
                                        ),
                                      ),
                                    );
                                  },
                                ),
                              ),
                            ],
                          ),

                          const SizedBox(height: 12),

                          Row(
                            children: [
                              Expanded(
                                child: HomeCard(
                                  icon: Icons.category,
                                  title: 'دسته‌بندی‌ها',
                                  subtitle: 'مطالب را پیدا کنید',
                                  onTap: () {
                                    Navigator.push(
                                      context,
                                      MaterialPageRoute(
                                        builder: (_) =>
                                            const CategoriesPage(),
                                      ),
                                    );
                                  },
                                ),
                              ),
                              const SizedBox(width: 12),
                              Expanded(
                                child: HomeCard(
                                  icon: Icons.language,
                                  title: 'وب‌سایت',
                                  subtitle: 'itarbiatbadani.ir',
                                  onTap: () {
                                    Navigator.push(
                                      context,
                                      MaterialPageRoute(
                                        builder: (_) =>
                                            const WebsitePage(
                                          title: 'وب‌سایت',
                                          url: siteUrl,
                                        ),
                                      ),
                                    );
                                  },
                                ),
                              ),
                            ],
                          ),

                          const SizedBox(height: 25),

                          const Align(
                            alignment: Alignment.centerRight,
                            child: Text(
                              'محصولات فروشگاه',
                              style: TextStyle(
                                fontSize: 21,
                                fontWeight: FontWeight.bold,
                                color: primaryColor,
                              ),
                            ),
                          ),

                          const SizedBox(height: 14),

                          StoreCard(
                            title: 'طرح درس ورزشی',
                            icon: Icons.menu_book,
                            url:
                                '$siteUrl/category/طرح-درس-ورزشی/',
                          ),

                          StoreCard(
                            title: 'پی دی اف ورزشی',
                            icon: Icons.picture_as_pdf,
                            url:
                                '$siteUrl/category/پی-دی-اف-ورزشی/',
                          ),

                          StoreCard(
                            title: 'پاورپوینت ورزشی',
                            icon: Icons.slideshow,
                            url:
                                '$siteUrl/category/پاورپوینت-ورزشی/',
                          ),

                          StoreCard(
                            title: 'فایل‌های رایگان',
                            icon: Icons.download,
                            url:
                                '$siteUrl/category/فایل-های-رایگان/',
                          ),

                          const SizedBox(height: 20),

                          const Text(
                            '© تربیت بدنی و علوم ورزشی',
                            style: TextStyle(
                              color: Colors.grey,
                              fontSize: 13,
                            ),
                          ),

                          const SizedBox(height: 20),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class HomeCard extends StatelessWidget {
            final IconData icon;
            final String title;
            final String subtitle;
            final VoidCallback onTap;

            const HomeCard({
              super.key,
              required this.icon,
              required this.title,
              required this.subtitle,
              required this.onTap,
            });

            @override
            Widget build(BuildContext context) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(18),
                child: Container(
                  padding: const EdgeInsets.all(16),
                  decoration: BoxDecoration(
                    color: Colors.white,
                    borderRadius: BorderRadius.circular(18),
                    boxShadow: [
                      BoxShadow(
                        color:
                            Colors.black.withValues(alpha: .06),
                        blurRadius: 10,
                        offset: const Offset(0, 4),
                      ),
                    ],
                  ),
                  child: Column(
                    children: [
                      Icon(
                        icon,
                        color: primaryColor,
                        size: 34,
                      ),
                      const SizedBox(height: 10),
                      Text(
                        title,
                        textAlign: TextAlign.center,
                        style: const TextStyle(
                          fontWeight: FontWeight.bold,
                          fontSize: 16,
                        ),
                      ),
                      const SizedBox(height: 5),
                      Text(
                        subtitle,
                        textAlign: TextAlign.center,
                        style: const TextStyle(
                          color: Colors.grey,
                          fontSize: 11,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class StoreCard extends StatelessWidget {
            final String title;
            final IconData icon;
            final String url;

            const StoreCard({
              super.key,
              required this.title,
              required this.icon,
              required this.url,
            });

            @override
            Widget build(BuildContext context) {
              return Container(
                margin: const EdgeInsets.only(bottom: 12),
                decoration: BoxDecoration(
                  gradient: const LinearGradient(
                    colors: [
                      primaryColor,
                      secondaryColor,
                    ],
                  ),
                  borderRadius: BorderRadius.circular(16),
                ),
                child: ListTile(
                  contentPadding:
                      const EdgeInsets.symmetric(
                    horizontal: 18,
                    vertical: 5,
                  ),
                  leading: Container(
                    width: 48,
                    height: 48,
                    decoration: BoxDecoration(
                      color: goldColor,
                      borderRadius:
                          BorderRadius.circular(14),
                    ),
                    child: Icon(
                      icon,
                      color: primaryColor,
                    ),
                  ),
                  title: Text(
                    title,
                    style: const TextStyle(
                      color: Colors.white,
                      fontWeight: FontWeight.bold,
                      fontSize: 16,
                    ),
                  ),
                  trailing: const Icon(
                    Icons.arrow_back_ios,
                    color: Colors.white,
                    size: 18,
                  ),
                  onTap: () {
                    Navigator.push(
                      context,
                      MaterialPageRoute(
                        builder: (_) => WebsitePage(
                          title: title,
                          url: url,
                        ),
                      ),
                    );
                  },
                ),
              );
            }
          }

          class WebsitePage extends StatefulWidget {
            final String title;
            final String url;

            const WebsitePage({
              super.key,
              required this.title,
              required this.url,
            });

            @override
            State<WebsitePage> createState() =>
                _WebsitePageState();
          }

          class _WebsitePageState extends State<WebsitePage> {
            late final WebViewController controller;
            int progress = 0;

            @override
            void initState() {
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(
                  JavaScriptMode.unrestricted,
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onProgress: (value) {
                      if (mounted) {
                        setState(() {
                          progress = value;
                        });
                      }
                    },
                    onNavigationRequest: (request) {
                      return NavigationDecision.navigate;
                    },
                  ),
                )
                ..loadRequest(
                  Uri.parse(widget.url),
                );
            }

            @override
            Widget build(BuildContext context) {
              return Column(
                children: [
                  Container(
                    height: 58,
                    padding:
                        const EdgeInsets.symmetric(horizontal: 8),
                    color: primaryColor,
                    child: Row(
                      children: [
                        IconButton(
                          icon: const Icon(
                            Icons.arrow_back,
                            color: Colors.white,
                          ),
                          onPressed: () {
                            Navigator.pop(context);
                          },
                        ),
                        Expanded(
                          child: Text(
                            widget.title,
                            style: const TextStyle(
                              color: Colors.white,
                              fontWeight: FontWeight.bold,
                              fontSize: 17,
                            ),
                          ),
                        ),
                        IconButton(
                          icon: const Icon(
                            Icons.refresh,
                            color: Colors.white,
                          ),
                          onPressed: () {
                            controller.reload();
                          },
                        ),
                      ],
                    ),
                  ),
                  if (progress < 100)
                    LinearProgressIndicator(
                      value: progress / 100,
                      color: goldColor,
                      backgroundColor: Colors.white,
                    ),
                  Expanded(
                    child: WebViewWidget(
                      controller: controller,
                    ),
                  ),
                ],
              );
            }
          }

          class CategoriesPage extends StatefulWidget {
            const CategoriesPage({super.key});

            @override
            State<CategoriesPage> createState() =>
                _CategoriesPageState();
          }

          class _CategoriesPageState
              extends State<CategoriesPage> {
            List<dynamic> categories = [];
            bool loading = true;
            String? error;

            @override
            void initState() {
              super.initState();
              loadCategories();
            }

            Future<void> loadCategories() async {
              setState(() {
                loading = true;
                error = null;
              });

              try {
                final response = await http.get(
                  Uri.parse(
                    '$siteUrl/wp-json/wp/v2/categories?per_page=100',
                  ),
                );

                if (response.statusCode == 200) {
                  final data = jsonDecode(response.body);

                  if (mounted) {
                    setState(() {
                      categories = data;
                      loading = false;
                    });
                  }
                } else {
                  if (mounted) {
                    setState(() {
                      error =
                          'خطا در دریافت دسته‌بندی‌ها';
                      loading = false;
                    });
                  }
                }
              } catch (e) {
                if (mounted) {
                  setState(() {
                    error = 'ارتباط با سایت برقرار نشد';
                    loading = false;
                  });
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Column(
                children: [
                  Container(
                    width: double.infinity,
                    padding: const EdgeInsets.all(18),
                    color: primaryColor,
                    child: const Text(
                      'دسته‌بندی مطالب',
                      textAlign: TextAlign.center,
                      style: TextStyle(
                        color: Colors.white,
                        fontSize: 20,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                  ),
                  Expanded(
                    child: loading
                        ? const Center(
                            child: CircularProgressIndicator(
                              color: primaryColor,
                            ),
                          )
                        : error != null
                            ? Center(
                                child: Column(
                                  mainAxisAlignment:
                                      MainAxisAlignment.center,
                                  children: [
                                    const Icon(
                                      Icons.wifi_off,
                                      size: 55,
                                      color: Colors.grey,
                                    ),
                                    const SizedBox(height: 15),
                                    Text(error!),
                                    const SizedBox(height: 15),
                                    ElevatedButton(
                                      onPressed: loadCategories,
                                      child:
                                          const Text('تلاش دوباره'),
                                    ),
                                  ],
                                ),
                              )
                            : RefreshIndicator(
                                onRefresh: loadCategories,
                                child: ListView.builder(
                                  padding:
                                      const EdgeInsets.all(16),
                                  itemCount: categories.length,
                                  itemBuilder:
                                      (context, index) {
                                    final category =
                                        categories[index];

                                    final name =
                                        category['name'] ?? '';

                                    final link =
                                        category['link'] ?? '';

                                    return Container(
                                      margin:
                                          const EdgeInsets.only(
                                        bottom: 12,
                                      ),
                                      decoration:
                                          BoxDecoration(
                                        color: Colors.white,
                                        borderRadius:
                                            BorderRadius.circular(
                                          16,
                                        ),
                                      ),
                                      child: ListTile(
                                        leading:
                                            const CircleAvatar(
                                          backgroundColor:
                                              Color(0xFFEAF1F7),
                                          child: Icon(
                                            Icons.category,
                                            color:
                                                primaryColor,
                                          ),
                                        ),
                                        title: Text(
                                          name,
                                          style:
                                              const TextStyle(
                                            fontWeight:
                                                FontWeight.bold,
                                          ),
                                        ),
                                        trailing:
                                            const Icon(
                                          Icons.arrow_back_ios,
                                          size: 17,
                                        ),
                                        onTap: () {
                                          if (link
                                              .toString()
                                              .isEmpty) {
                                            return;
                                          }

                                          Navigator.push(
                                            context,
                                            MaterialPageRoute(
                                              builder: (_) =>
                                                  WebsitePage(
                                                title: name,
                                                url: link,
                                              ),
                                            ),
                                          );
                                        },
                                      ),
                                    );
                                  },
                                ),
                              ),
                  ),
                ],
              );
            }
          }

          class MorePage extends StatelessWidget {
            const MorePage({super.key});

            Future<void> openUrl(String url) async {
              final uri = Uri.parse(url);

              if (await canLaunchUrl(uri)) {
                await launchUrl(
                  uri,
                  mode: LaunchMode.externalApplication,
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              return SingleChildScrollView(
                child: Column(
                  children: [
                    Container(
                      width: double.infinity,
                      padding: const EdgeInsets.all(25),
                      decoration: const BoxDecoration(
                        gradient: LinearGradient(
                          colors: [
                            primaryColor,
                            secondaryColor,
                          ],
                        ),
                      ),
                      child: const Column(
                        children: [
                          Icon(
                            Icons.sports,
                            color: goldColor,
                            size: 60,
                          ),
                          SizedBox(height: 12),
                          Text(
                            'تربیت بدنی و علوم ورزشی',
                            style: TextStyle(
                              color: Colors.white,
                              fontSize: 22,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                        ],
                      ),
                    ),

                    const SizedBox(height: 20),

                    ListTile(
                      leading: const Icon(
                        Icons.language,
                        color: primaryColor,
                      ),
                      title: const Text('وب‌سایت'),
                      subtitle:
                          const Text('itarbiatbadani.ir'),
                      trailing: const Icon(
                        Icons.arrow_back_ios,
                        size: 17,
                      ),
                      onTap: () => openUrl(siteUrl),
                    ),

                    ListTile(
                      leading: const Icon(
                        Icons.send,
                        color: primaryColor,
                      ),
                      title: const Text('کانال تلگرام'),
                      subtitle:
                          const Text('@itarbiatbadani'),
                      trailing: const Icon(
                        Icons.arrow_back_ios,
                        size: 17,
                      ),
                      onTap: () =>
                          openUrl('https://t.me/itarbiatbadani'),
                    ),

                    ListTile(
                      leading: const Icon(
                        Icons.camera_alt,
                        color: primaryColor,
                      ),
                      title: const Text('اینستاگرام'),
                      subtitle:
                          const Text('@itarbiatbadani'),
                      trailing: const Icon(
                        Icons.arrow_back_ios,
                        size: 17,
                      ),
                      onTap: () => openUrl(
                        'https://instagram.com/itarbiatbadani',
                      ),
                    ),

                    const SizedBox(height: 20),

                    const Text(
                      'محمد عیسی زهی\nکارشناسی ارشد مدیریت ورزشی',
                      textAlign: TextAlign.center,
                      style: TextStyle(
                        color: Colors.grey,
                        height: 1.7,
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Add Internet permission
        working-directory: app
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Set app name
        working-directory: app
        run: |
          sed -i 's/android:label="[^"]*"/android:label="تربیت بدنی و علوم ورزشی"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: app
        run: |
          flutter pub get

      - name: Generate launcher icons
        working-directory: app
        run: |
          dart run flutter_launcher_icons

      - name: Analyze
        working-directory: app
        run: |
          flutter analyze

      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-professional-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
