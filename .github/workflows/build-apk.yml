```yaml
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable

      - name: Create Flutter Project
        run: flutter create --project-name itarbiatbadani_app app

      - name: Add Packages
        working-directory: app
        run: |
          flutter pub add webview_flutter
          flutter pub add url_launcher
          flutter pub add http
          flutter pub add flutter_launcher_icons --dev

      - name: Download Logo
        working-directory: app
        run: |
          mkdir -p assets
          curl -L "https://itarbiatbadani.ir/wp-content/uploads/2025/07/1000073463.png" -o assets/logo.png

      - name: Configure App Icon
        working-directory: app
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/logo.png"
            min_sdk_android: 21
          EOF

          dart run flutter_launcher_icons

      - name: Create Main App
        working-directory: app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:url_launcher/url_launcher.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          const String siteUrl = 'https://itarbiatbadani.ir';

          const Color primaryColor = Color(0xFF0A3D62);
          const Color secondaryColor = Color(0xFF3C6382);
          const Color goldColor = Color(0xFFFBC531);

          void main() {
            runApp(const SportsApp());
          }

          class SportsApp extends StatelessWidget {
            const SportsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'تربیت بدنی و علوم ورزشی',
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: primaryColor,
                  ),
                  scaffoldBackgroundColor: const Color(0xFFF5F7FA),
                ),
                home: const MainPage(),
              );
            }
          }

          class MainPage extends StatefulWidget {
            const MainPage({super.key});

            @override
            State<MainPage> createState() => _MainPageState();
          }

          class _MainPageState extends State<MainPage> {
            int currentIndex = 0;

            final List<Widget> pages = const [
              HomePage(),
              ArticlesPage(),
              CategoriesPage(),
              ShopPage(),
              MorePage(),
            ];

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  body: IndexedStack(
                    index: currentIndex,
                    children: pages,
                  ),
                  bottomNavigationBar: NavigationBar(
                    selectedIndex: currentIndex,
                    onDestinationSelected: (index) {
                      setState(() {
                        currentIndex = index;
                      });
                    },
                    destinations: const [
                      NavigationDestination(
                        icon: Icon(Icons.home_outlined),
                        selectedIcon: Icon(Icons.home),
                        label: 'خانه',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.article_outlined),
                        selectedIcon: Icon(Icons.article),
                        label: 'مطالب',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.category_outlined),
                        selectedIcon: Icon(Icons.category),
                        label: 'دسته‌ها',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.shopping_cart_outlined),
                        selectedIcon: Icon(Icons.shopping_cart),
                        label: 'فروشگاه',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.more_horiz),
                        selectedIcon: Icon(Icons.more_horiz),
                        label: 'بیشتر',
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class AppHeader extends StatelessWidget {
            final String title;

            const AppHeader({
              super.key,
              required this.title,
            });

            @override
            Widget build(BuildContext context) {
              return Container(
                width: double.infinity,
                padding: const EdgeInsets.fromLTRB(20, 45, 20, 22),
                decoration: const BoxDecoration(
                  gradient: LinearGradient(
                    colors: [
                      primaryColor,
                      secondaryColor,
                    ],
                    begin: Alignment.topRight,
                    end: Alignment.bottomLeft,
                  ),
                ),
                child: Row(
                  children: [
                    Image.network(
                      'https://itarbiatbadani.ir/wp-content/uploads/2025/07/1000073463.png',
                      width: 54,
                      height: 54,
                      errorBuilder: (_, __, ___) {
                        return const Icon(
                          Icons.sports,
                          color: Colors.white,
                          size: 48,
                        );
                      },
                    ),
                    const SizedBox(width: 14),
                    Expanded(
                      child: Text(
                        title,
                        style: const TextStyle(
                          color: Colors.white,
                          fontSize: 21,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class HomePage extends StatelessWidget {
            const HomePage({super.key});

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: SingleChildScrollView(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const AppHeader(
                        title: 'تربیت بدنی و علوم ورزشی',
                      ),
                      Padding(
                        padding: const EdgeInsets.all(16),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text(
                              'مرجع تخصصی تربیت بدنی و علوم ورزشی',
                              style: TextStyle(
                                fontSize: 20,
                                fontWeight: FontWeight.bold,
                                color: primaryColor,
