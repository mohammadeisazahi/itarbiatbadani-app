          class StorePage extends StatefulWidget {
            const StorePage({super.key});

            @override
            State<StorePage> createState() => _StorePageState();
          }

          class _StorePageState extends State<StorePage> {
            bool loading = true;
            final List<StoreCategory> storeCategories = [];

            final List<String> names = const [
              'طرح درس ورزشی',
              'پی دی اف ورزشی',
              'پاورپوینت ورزشی',
              'فایل های رایگان',
            ];

            @override
            void initState() {
              super.initState();
              loadStoreCategories();
            }

            Future<void> loadStoreCategories() async {
              try {
                final response = await http.get(
                  Uri.parse(
                    '$siteUrl/wp-json/wp/v2/categories?per_page=100',
                  ),
                );

                if (response.statusCode == 200) {
                  final data = jsonDecode(response.body) as List;

                  for (final name in names) {
                    final matches = data.where(
                      (item) =>
                          item['name'].toString().trim() ==
                          name.trim(),
                    );

                    if (matches.isNotEmpty) {
                      final item = matches.first;

                      storeCategories.add(
                        StoreCategory(
                          name: item['name'],
                          slug: item['slug'],
                          count: item['count'] ?? 0,
                        ),
                      );
                    }
                  }
                }
              } catch (_) {}

              if (!mounted) return;

              setState(() {
                loading = false;
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'فروشگاه',
                    style: TextStyle(fontWeight: FontWeight.bold),
                  ),
                  backgroundColor: Colors.white,
                  foregroundColor: navy,
                  elevation: 0,
                ),
                body: loading
                    ? const Center(
                        child: CircularProgressIndicator(
                          color: navy,
                        ),
                      )
                    : RefreshIndicator(
                        color: navy,
                        onRefresh: () async {
                          storeCategories.clear();
                          await loadStoreCategories();
                        },
                        child: ListView(
                          padding: const EdgeInsets.all(18),
                          children: [
                            _storeHeader(),
                            const SizedBox(height: 22),
                            ...storeCategories.map(
                              (item) => _storeCard(item),
                            ),
                            if (storeCategories.isEmpty)
                              const Padding(
                                padding: EdgeInsets.all(40),
                                child: Center(
                                  child: Text(
                                    'دسته‌های فروشگاه در دسترس نیستند.',
                                    textAlign: TextAlign.center,
                                  ),
                                ),
                              ),
                          ],
                        ),
                      ),
              );
            }

            Widget _storeHeader() {
              return Container(
                padding: const EdgeInsets.all(22),
                decoration: BoxDecoration(
                  gradient: const LinearGradient(
                    colors: [navy, blue],
                  ),
                  borderRadius: BorderRadius.circular(25),
                ),
                child: const Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Icon(
                      Icons.shopping_bag,
