/* -------------------------------------------------------------------------- */
/*                                  MODELS                                    */
/* -------------------------------------------------------------------------- */

class PostModel {
  final int id;
  final String title;
  final String excerpt;
  final String imageUrl;
  final String date;
  final String link;

  const PostModel({
    required this.id,
    required this.title,
    required this.excerpt,
    required this.imageUrl,
    required this.date,
    required this.link,
  });

  factory PostModel.fromJson(Map<String, dynamic> json) {
    String image = '';

    final embedded = json['_embedded'];

    if (embedded is Map<String, dynamic>) {
      final media = embedded['wp:featuredmedia'];

      if (media is List && media.isNotEmpty) {
        final first = media.first;

        if (first is Map<String, dynamic>) {
          image = first['source_url']?.toString() ?? '';
        }
      }
    }

    final titleData = json['title'];
    final excerptData = json['excerpt'];

    String title = '';

    if (titleData is Map<String, dynamic>) {
      title = titleData['rendered']?.toString() ?? '';
    }

    String excerpt = '';

    if (excerptData is Map<String, dynamic>) {
      excerpt = excerptData['rendered']?.toString() ?? '';
    }

    return PostModel(
      id: json['id'] is int
          ? json['id'] as int
          : int.tryParse(json['id']?.toString() ?? '') ?? 0,
      title: cleanHtml(title),
      excerpt: cleanHtml(excerpt),
      imageUrl: image,
      date: json['date']?.toString() ?? '',
      link: json['link']?.toString() ?? '',
    );
  }
}

class CategoryModel {
  final int id;
  final String name;
  final int parent;
  final int count;

  const CategoryModel({
    required this.id,
    required this.name,
    required this.parent,
    required this.count,
  });

  factory CategoryModel.fromJson(Map<String, dynamic> json) {
    return CategoryModel(
      id: json['id'] is int
          ? json['id'] as int
          : int.tryParse(json['id']?.toString() ?? '') ?? 0,
      name: json['name']?.toString() ?? '',
      parent: json['parent'] is int
          ? json['parent'] as int
          : int.tryParse(json['parent']?.toString() ?? '') ?? 0,
      count: json['count'] is int
          ? json['count'] as int
          : int.tryParse(json['count']?.toString() ?? '') ?? 0,
    );
  }
}

/* -------------------------------------------------------------------------- */
/*                              WORDPRESS API                                 */
/* -------------------------------------------------------------------------- */

class WordPressApi {
  static Future<List<PostModel>> latestPosts() async {
    final uri = Uri.parse(
      '$apiUrl/posts?per_page=6&orderby=date&order=desc&_embed',
    );

    final response = await http.get(uri);

    if (response.statusCode != 200) {
      throw Exception('خطا در دریافت نوشته‌ها');
    }

    final data = jsonDecode(response.body);

    if (data is! List) {
      throw Exception('اطلاعات نوشته‌ها معتبر نیست');
    }

    return data
        .map(
          (item) => PostModel.fromJson(
            Map<String, dynamic>.from(item),
          ),
        )
        .toList();
  }

  static Future<List<CategoryModel>> categories() async {
    final List<CategoryModel> allCategories = [];

    int page = 1;

    while (true) {
      final uri = Uri.parse(
        '$apiUrl/categories?per_page=100&hide_empty=false&page=$page',
      );

      final response = await http.get(uri);

      if (response.statusCode == 400) {
        break;
      }

      if (response.statusCode != 200) {
        throw Exception('خطا در دریافت دسته‌بندی‌ها');
      }

      final data = jsonDecode(response.body);

      if (data is! List) {
        break;
      }

      for (final item in data) {
        allCategories.add(
          CategoryModel.fromJson(
            Map<String, dynamic>.from(item),
          ),
        );
      }

      if (data.length < 100) {
        break;
      }

      page++;
    }

    allCategories.sort(
      (a, b) => a.name.compareTo(b.name),
    );

    return allCategories;
  }

  static Future<List<PostModel>> postsByCategory(
    int categoryId,
  ) async {
    final uri = Uri.parse(
      '$apiUrl/posts?categories=$categoryId&per_page=30&orderby=date&order=desc&_embed',
    );

    final response = await http.get(uri);

    if (response.statusCode != 200) {
      throw Exception('خطا در دریافت نوشته‌های دسته‌بندی');
    }

    final data = jsonDecode(response.body);

    if (data is! List) {
      throw Exception('اطلاعات نوشته‌ها معتبر نیست');
    }

    return data
        .map(
          (item) => PostModel.fromJson(
            Map<String, dynamic>.from(item),
          ),
        )
        .toList();
  }
}

/* -------------------------------------------------------------------------- */
/*                              URL FUNCTIONS                                 */
/* -------------------------------------------------------------------------- */

Future<void> openUrl(String url) async {
  final uri = Uri.parse(url);

  if (await canLaunchUrl(uri)) {
    await launchUrl(
      uri,
      mode: LaunchMode.externalApplication,
    );
  }
}

