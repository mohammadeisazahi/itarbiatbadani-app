/* =========================================================
   CATEGORIES
========================================================= */

class CategoriesPage extends StatelessWidget {
  const CategoriesPage({super.key});

  @override
  Widget build(BuildContext context) {
    return FutureBuilder<List<CategoryModel>>(
      future: WordPressApi.categories(),
      builder: (context, snapshot) {
        if (snapshot.connectionState == ConnectionState.waiting) {
          return const Center(
            child: CircularProgressIndicator(
              color: primaryColor,
            ),
          );
        }

        if (snapshot.hasError) {
          return Center(
            child: Padding(
              padding: const EdgeInsets.all(24),
              child: ErrorBox(
                message:
                    'دریافت دسته‌بندی‌ها با مشکل مواجه شد.',
                onRetry: () {
                  Navigator.pushReplacement(
                    context,
                    MaterialPageRoute(
                      builder: (_) => const CategoriesPage(),
                    ),
                  );
                },
              ),
            ),
          );
        }

        final categories = snapshot.data ?? [];

        if (categories.isEmpty) {
          return const Center(
            child: EmptyBox(
              message: 'دسته‌بندی‌ای پیدا نشد.',
            ),
          );
        }

        final parents = categories
            .where((category) => category.parent == 0)
            .toList();

        final children = <int, List<CategoryModel>>{};

        for (final category in categories) {
          if (category.parent != 0) {
            children.putIfAbsent(
              category.parent,
              () => [],
            ).add(category);
          }
        }

        return ListView(
          padding: const EdgeInsets.all(16),
          children: [
            Container(
              padding: const EdgeInsets.all(16),
              margin: const EdgeInsets.only(bottom: 14),
              decoration: BoxDecoration(
                gradient: LinearGradient(
                  colors: [
                    primaryColor,
                    secondaryColor.withValues(alpha: 0.92),
                  ],
                ),
                borderRadius: BorderRadius.circular(18),
              ),
              child: const Row(
                children: [
                  Icon(
                    Icons.category,
                    color: accentColor,
                    size: 30,
                  ),
                  SizedBox(width: 12),
                  Expanded(
                    child: Text(
                      'دسته‌بندی مطالب',
                      style: TextStyle(
                        color: Colors.white,
                        fontWeight: FontWeight.bold,
                        fontSize: 17,
                      ),
                    ),
                  ),
                ],
              ),
            ),
            ...parents.map(
              (parent) {
                final subCategories =
                    children[parent.id] ?? [];

                if (subCategories.isEmpty) {
                  return _CategoryTile(
                    category: parent,
                  );
                }

                return Container(
                  margin: const EdgeInsets.only(bottom: 10),
                  decoration: BoxDecoration(
                    color: Colors.white,
                    borderRadius: BorderRadius.circular(16),
                  ),
                  child: ExpansionTile(
                    leading: CategoryIcon(
                      name: parent.name,
                    ),
                    title: Text(
                      parent.name,
                      style: const TextStyle(
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    subtitle: Text(
                      '${parent.count} نوشته',
                      style: const TextStyle(
                        fontSize: 11,
                        color: Colors.grey,
                      ),
                    ),
                    children: subCategories
                        .map(
                          (child) => _CategoryTile(
                            category: child,
                            child: true,
                          ),
                        )
                        .toList(),
                  ),
                );
              },
            ),
          ],
        );
      },
    );
  }
}

class _CategoryTile extends StatelessWidget {
  final CategoryModel category;
  final bool child;

  const _CategoryTile({
    required this.category,
    this.child = false,
  });

  @override
  Widget build(BuildContext context) {
    return Container(
      margin: EdgeInsets.only(
        bottom: child ? 6 : 10,
      ),
      decoration: BoxDecoration(
        color: Colors.white,
        borderRadius: BorderRadius.circular(14),
      ),
      child: ListTile(
