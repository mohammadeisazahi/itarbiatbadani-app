/* =========================================================
   CATEGORY ICON
========================================================= */

class CategoryIcon extends StatelessWidget {
  final String name;
  final bool small;

  const CategoryIcon({
    super.key,
    required this.name,
    this.small = false,
  });

  IconData _icon() {
    final text = name.toLowerCase();

    if (text.contains('ورزش')) {
      return Icons.sports_soccer;
    }

    if (text.contains('تربیت')) {
      return Icons.fitness_center;
    }

    if (text.contains('علم')) {
      return Icons.science_outlined;
    }

    if (text.contains('دانشگاه')) {
      return Icons.account_balance;
    }

    if (text.contains('ارشد')) {
      return Icons.school;
    }

    if (text.contains('دکتری')) {
      return Icons.workspace_premium;
    }

    if (text.contains('استخدام')) {
      return Icons.work_outline;
    }

    if (text.contains('طرح')) {
      return Icons.assignment_outlined;
    }

    if (text.contains('پاور')) {
      return Icons.slideshow_outlined;
    }

    if (text.contains('آموزش')) {
      return Icons.menu_book_outlined;
    }

    if (text.contains('اخبار')) {
      return Icons.newspaper_outlined;
    }

    return Icons.folder_outlined;
  }

  @override
  Widget build(BuildContext context) {
    final size = small ? 38.0 : 44.0;
    final iconSize = small ? 20.0 : 23.0;

    return Container(
      width: size,
      height: size,
      decoration: BoxDecoration(
        color: primaryColor.withValues(alpha: 0.08),
        borderRadius: BorderRadius.circular(12),
      ),
      child: Icon(
        _icon(),
        color: primaryColor,
        size: iconSize,
      ),
    );
  }
}

/* =========================================================
   CATEGORY POSTS
========================================================= */

class CategoryPostsPage extends StatelessWidget {
  final CategoryModel category;

  const CategoryPostsPage({
    super.key,
    required this.category,
  });

  @override
  Widget build(BuildContext context) {
    return Directionality(
      textDirection: TextDirection.rtl,
      child: Scaffold(
        appBar: AppBar(
          title: Text(category.name),
        ),
        body: FutureBuilder<List<PostModel>>(
          future: WordPressApi.postsByCategory(
            category.id,
          ),
          builder: (context, snapshot) {
            if (snapshot.connectionState ==
                ConnectionState.waiting) {
              return const Center(
                child: CircularProgressIndicator(
                  color: primaryColor,
                ),
              );
            }

            if (snapshot.hasError) {
              return const Center(
                child: Padding(
                  padding: EdgeInsets.all(24),
                  child: ErrorBox(
                    message:
                        'دریافت مطالب این دسته‌بندی با مشکل مواجه شد.',
                  ),
                ),
              );
            }

            final posts = snapshot.data ?? [];

            if (posts.isEmpty) {
              return const Center(
                child: EmptyBox(
                  message:
                      'در این دسته‌بندی نوشته‌ای وجود ندارد.',
                ),
              );
            }

            return ListView.builder(
              padding: const EdgeInsets.all(16),
              itemCount: posts.length,
              itemBuilder: (context, index) {
                return Padding(
                  padding:
                      const EdgeInsets.only(bottom: 12),
                  child: PostCard(
                    post: posts[index],
                  ),
                );
              },
            );
          },
        ),
      ),
    );
  }
}

