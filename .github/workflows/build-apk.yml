/* ---------------- STORE ---------------- */

class StorePage extends StatefulWidget {
  const StorePage({super.key});

  @override
  State<StorePage> createState() => _StorePageState();
}

class _StorePageState extends State<StorePage> {
  late Future<List<dynamic>> future;

  @override
  void initState() {
    super.initState();
    future = Api.storeCategories();
  }

  @override
  Widget build(BuildContext context) {
    return SafeArea(
      child: Column(
        children: [
          const ModernHeader(
            title: 'فروشگاه',
            subtitle: 'فایل‌ها و محصولات آموزشی',
          ),
          Expanded(
            child: FutureBuilder<List<dynamic>>(
              future: future,
              builder: (context, snapshot) {
                if (snapshot.connectionState ==
                    ConnectionState.waiting) {
                  return const Center(
                    child: CircularProgressIndicator(),
                  );
                }

                if (snapshot.hasError) {
                  return ErrorBox(
                    message:
                        'دسته‌های فروشگاه در دسترس نیستند.',
                    onRetry: () {
                      setState(() {
                        future =
                            Api.storeCategories();
                      });
                    },
                  );
                }

                final categories =
                    snapshot.data ?? [];

                return GridView.builder(
                  padding: const EdgeInsets.fromLTRB(
                    20,
                    10,
                    20,
                    30,
                  ),
                  gridDelegate:
                      const SliverGridDelegateWithFixedCrossAxisCount(
                    crossAxisCount: 2,
                    crossAxisSpacing: 12,
                    mainAxisSpacing: 12,
                    childAspectRatio: .95,
                  ),
                  itemCount: categories.length,
                  itemBuilder: (_, index) {
                    final item =
                        categories[index]
                            as Map<String, dynamic>;

                    return StoreCard(
                      item: item,
                      index: index,
                    );
                  },
                );
              },
            ),
          ),
        ],
      ),
    );
  }
}

class StoreCard extends StatelessWidget {
  final Map<String, dynamic> item;
  final int index;

  const StoreCard({
    super.key,
    required this.item,
    required this.index,
  });

  IconData get icon {
    final name =
        (item['name'] ?? '').toString();

    if (name.contains('طرح درس')) {
      return Icons.assignment_rounded;
    }

    if (name.contains('پی دی اف') ||
        name.contains('PDF')) {
      return Icons.picture_as_pdf_rounded;
    }

    if (name.contains('پاورپوینت')) {
      return Icons.slideshow_rounded;
    }

    if (name.contains('رایگان')) {
      return Icons.card_giftcard_rounded;
    }

    return Icons.folder_special_rounded;
  }

  @override
  Widget build(BuildContext context) {
    final name = item['name'] ?? '';
    final link = item['link'] ?? '$siteUrl/shop/';

    return Material(
      color: Colors.white,
      borderRadius: BorderRadius.circular(22),
      child: InkWell(
        borderRadius: BorderRadius.circular(22),
        onTap: () => openExternal(link),
        child: Container(
          padding: const EdgeInsets.all(18),
          decoration: BoxDecoration(
            borderRadius: BorderRadius.circular(22),
            border: Border.all(
              color: const Color(0xFFE3E9ED),
            ),
          ),
          child: Column(
            crossAxisAlignment:
                CrossAxisAlignment.start,
            children: [
              Container(
                width: 54,
                height: 54,
                decoration: BoxDecoration(
                  gradient: const LinearGradient(
                    colors: [navy, blue],
                  ),
                  borderRadius:
                      BorderRadius.circular(16),
                ),
                child: Icon(
                  icon,
                  color: Colors.white,
                  size: 28,
                ),
              ),
              const Spacer(),
              Text(
                name,
                maxLines: 2,
                overflow: TextOverflow.ellipsis,
                style: const TextStyle(
                  fontSize: 15,
                  fontWeight: FontWeight.w900,
                  height: 1.35,
                ),
              ),
              const SizedBox(height: 7),
              Text(
                '${item['count'] ?? 0} محصول',
                style: const TextStyle(
                  color: muted,
                  fontSize: 11,
                ),
              ),
              const SizedBox(height: 12),
              const Row(
                children: [
                  Text(
                    'ورود به دسته',
                    style: TextStyle(
                      color: navy,
                      fontSize: 11,
                      fontWeight: FontWeight.w800,
                    ),
                  ),
                  Spacer(),
                  Icon(
                    Icons.arrow_back_rounded,
                    color: navy,
                    size: 17,
                  ),
                ],
              ),
            ],
          ),
        ),
      ),
    );
  }
}

