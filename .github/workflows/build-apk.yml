class CategoryIcon extends StatelessWidget {
  final String name;
  final bool small;

  const CategoryIcon({
    super.key,
    required this.name,
    this.small = false,
  });

  @override
  Widget build(BuildContext context) {
    IconData icon = Icons.folder_outlined;

    final value = name.toLowerCase();

    if (value.contains('ورزش') ||
        value.contains('تمرین')) {
      icon = Icons.fitness_center_outlined;
    } else if (value.contains('دانشگاه') ||
        value.contains('تحصیل')) {
      icon = Icons.school_outlined;
    } else if (value.contains('تغذیه')) {
      icon = Icons.restaurant_outlined;
    } else if (value.contains('کتاب') ||
        value.contains('منبع')) {
      icon = Icons.menu_book_outlined;
    } else if (value.contains('طرح درس')) {
      icon = Icons.assignment_outlined;
    } else if (value.contains('پاور')) {
      icon = Icons.slideshow_outlined;
    } else if (value.contains('اخبار')) {
      icon = Icons.newspaper_outlined;
    }

    return Container(
      width: small ? 38 : 44,
      height: small ? 38 : 44,
      decoration: BoxDecoration(
        color: primaryColor.withValues(alpha: 0.08),
        borderRadius: BorderRadius.circular(12),
      ),
      child: Icon(
        icon,
        color: primaryColor,
        size: small ? 21 : 24,
      ),
    );
  }
}

/* =========================================================
   CATEGORY POSTS
========================================================= */

class CategoryPostsPage extends StatelessWidget {
  final CategoryModel category;

  const CategoryPostsPage({
    super.key,
    required this.category,
  });

  @override
  Widget build(BuildContext context) {
    return Directionality(
      textDirection: TextDirection.rtl,
      child: Scaffold(
        appBar: AppBar(
          title: Text(category.name),
        ),
        body: FutureBuilder<List<PostModel>>(
          future: WordPressApi.postsByCategory(
            category.id,
          ),
          builder: (context, snapshot) {
            if (snapshot.connectionState ==
                ConnectionState.waiting) {
              return const Center(
                child: CircularProgressIndicator(
                  color: primaryColor,
                ),
              );
            }

            if (snapshot.hasError) {
              return const Center(
                child: Padding(
                  padding: EdgeInsets.all(20),
                  child: ErrorBox(
                    message:
                        'دریافت مطالب این دسته با مشکل مواجه شد.',
                  ),
                ),
              );
            }

            final posts = snapshot.data ?? [];

            if (posts.isEmpty) {
              return const Center(
                child: EmptyBox(
                  message:
                      'مطلبی در این دسته‌بندی وجود ندارد.',
                ),
              );
            }

            return ListView.separated(
              padding: const EdgeInsets.all(16),
              itemCount: posts.length,
              separatorBuilder: (_, __) =>
                  const SizedBox(height: 12),
              itemBuilder: (context, index) {
                return PostCard(
                  post: posts[index],
                );
              },
            );
          },
        ),
      ),
    );
  }
}

