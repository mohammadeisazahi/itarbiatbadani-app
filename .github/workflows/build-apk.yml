              );
            }
          }

          class CategoriesPage extends StatefulWidget {
            const CategoriesPage({super.key});

            @override
            State<CategoriesPage> createState() =>
                _CategoriesPageState();
          }

          class _CategoriesPageState
              extends State<CategoriesPage> {
            late Future<List<CategoryItem>> categories;

            @override
            void initState() {
              super.initState();
              categories = loadCategories();
            }

            Future<List<CategoryItem>> loadCategories() async {
              try {
                final response = await http.get(
                  Uri.parse(
                    '$siteUrl/wp-json/wp/v2/categories?per_page=100',
                  ),
                );

                if (response.statusCode == 200) {
                  final List data =
                      jsonDecode(response.body);

                  return data
                      .map(
                        (item) => CategoryItem(
                          name: item['name'] ?? '',
                          count: item['count'] ?? 0,
                          link: item['link'] ?? siteUrl,
                        ),
                      )
                      .where(
                        (item) => item.name.isNotEmpty,
                      )
                      .toList();
                }
              } catch (_) {}

              return [];
            }

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: Column(
                  children: [
                    const AppHeader(
                      title: 'دسته‌بندی‌های سایت',
                    ),
                    Expanded(
                      child: FutureBuilder<List<CategoryItem>>(
                        future: categories,
                        builder: (context, snapshot) {
                          if (snapshot.connectionState ==
                              ConnectionState.waiting) {
                            return const Center(
                              child: CircularProgressIndicator(),
                            );
                          }

                          final items = snapshot.data ?? [];

                          if (items.isEmpty) {
                            return Center(
                              child: Column(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  const Icon(
                                    Icons.category_outlined,
                                    size: 60,
                                    color: primaryColor,
                                  ),
                                  const SizedBox(height: 12),
                                  const Text(
                                    'دسته‌بندی‌ها بارگذاری نشدند.',
                                  ),
                                  const SizedBox(height: 12),
                                  ElevatedButton(
                                    onPressed: () {
                                      setState(() {
                                        categories =
                                            loadCategories();
                                      });
                                    },
                                    child:
                                        const Text('تلاش مجدد'),
                                  ),
                                ],
                              ),
                            );
                          }

                          return RefreshIndicator(
                            onRefresh: () async {
                              setState(() {
                                categories = loadCategories();
                              });
                            },
                            child: GridView.builder(
                              padding: const EdgeInsets.all(16),
                              gridDelegate:
                                  const SliverGridDelegateWithFixedCrossAxisCount(
                                crossAxisCount: 2,
                                crossAxisSpacing: 12,
                                mainAxisSpacing: 12,
                                childAspectRatio: 1.25,
                              ),
                              itemCount: items.length,
                              itemBuilder: (context, index) {
                                final category = items[index];

                                return InkWell(
                                  borderRadius:
                                      BorderRadius.circular(16),
                                  onTap: () {
                                    Navigator.push(
                                      context,
                                      MaterialPageRoute(
                                        builder: (_) =>
                                            WebsitePage(
                                          url: category.link,
                                        ),
                                      ),
                                    );
                                  },
                                  child: Container(
                                    padding:
                                        const EdgeInsets.all(14),
                                    decoration: BoxDecoration(
                                      color: Colors.white,
                                      borderRadius:
                                          BorderRadius.circular(16),
                                      boxShadow: [
                                        BoxShadow(
                                          blurRadius: 10,
                                          color: Colors.black
                                              .withOpacity(.06),
                                        ),
                                      ],
                                    ),
                                    child: Column(
                                      mainAxisAlignment:
                                          MainAxisAlignment.center,
                                      children: [
                                        const Icon(
                                          Icons.category,
                                          size: 34,
                                          color: primaryColor,
                                        ),
                                        const SizedBox(height: 10),
                                        Text(
                                          category.name,
                                          textAlign:
                                              TextAlign.center,
                                          maxLines: 2,
                                          overflow:
                                              TextOverflow.ellipsis,
                                          style:
                                              const TextStyle(
                                            fontWeight:
                                                FontWeight.bold,
                                          ),
                                        ),
                                        const SizedBox(height: 5),
                                        Text(
                                          '${category.count} مطلب',
                                          style:
                                              const TextStyle(
                                            fontSize: 11,
                                            color: Colors.grey,
                                          ),
                                        ),
                                      ],
                                    ),
                                  ),
                                );
                              },
                            ),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class CategoryItem {
            final String name;
            final int count;
            final String link;

            CategoryItem({
              required this.name,
              required this.count,
              required this.link,
            });
          }

          class ArticlesPage extends StatelessWidget {
            const ArticlesPage({super.key});

            @override
            Widget build(BuildContext context) {
              return const WebsitePage(
                url: siteUrl,
              );
            }
