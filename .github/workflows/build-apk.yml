/* -------------------------------------------------------------------------- */
/*                                  MODELS                                    */
/* -------------------------------------------------------------------------- */

class PostModel {
  final int id;
  final String title;
  final String link;
  final String date;
  final String excerpt;
  final String image;

  const PostModel({
    required this.id,
    required this.title,
    required this.link,
    required this.date,
    required this.excerpt,
    required this.image,
  });

  factory PostModel.fromJson(Map<String, dynamic> json) {
    String image = '';

    try {
      final embedded = json['_embedded'];

      if (embedded != null &&
          embedded['wp:featuredmedia'] != null &&
          embedded['wp:featuredmedia'] is List &&
          embedded['wp:featuredmedia'].isNotEmpty) {
        image =
            embedded['wp:featuredmedia'][0]['source_url']?.toString() ?? '';
      }
    } catch (_) {}

    return PostModel(
      id: json['id'] ?? 0,
      title: cleanHtml(json['title']?['rendered']?.toString() ?? ''),
      link: json['link']?.toString() ?? siteUrl,
      date: json['date']?.toString() ?? '',
      excerpt: cleanHtml(
        json['excerpt']?['rendered']?.toString() ?? '',
      ),
      image: image,
    );
  }
}

class CategoryModel {
  final int id;
  final String name;
  final int count;
  final int parent;

  const CategoryModel({
    required this.id,
    required this.name,
    required this.count,
    required this.parent,
  });

  factory CategoryModel.fromJson(Map<String, dynamic> json) {
    return CategoryModel(
      id: json['id'] ?? 0,
      name: cleanHtml(json['name']?.toString() ?? ''),
      count: json['count'] ?? 0,
      parent: json['parent'] ?? 0,
    );
  }
}

/* -------------------------------------------------------------------------- */
/*                              WORDPRESS API                                 */
/* -------------------------------------------------------------------------- */

class WordPressApi {
  static Future<List<PostModel>> latestPosts() async {
    final uri = Uri.parse(
      '$apiUrl/posts?per_page=6&orderby=date&order=desc&_embed',
    );

    final response = await http.get(uri);

    if (response.statusCode != 200) {
      throw Exception('خطا در دریافت نوشته‌ها');
    }

    final List<dynamic> data = jsonDecode(response.body);

    return data
        .map(
          (item) => PostModel.fromJson(
            item as Map<String, dynamic>,
          ),
        )
        .toList();
  }

  static Future<List<CategoryModel>> categories() async {
    final List<CategoryModel> result = [];

    int page = 1;

    while (true) {
      final uri = Uri.parse(
        '$apiUrl/categories?per_page=100&page=$page&hide_empty=false',
      );

      final response = await http.get(uri);

      if (response.statusCode == 400 && page > 1) {
        break;
      }

      if (response.statusCode != 200) {
        throw Exception('خطا در دریافت دسته‌بندی‌ها');
      }

      final List<dynamic> data = jsonDecode(response.body);

      for (final item in data) {
        result.add(
          CategoryModel.fromJson(
            item as Map<String, dynamic>,
          ),
        );
      }

      if (data.length < 100) {
        break;
      }

      page++;
    }

    return result;
  }

  static Future<List<PostModel>> postsByCategory(
    int categoryId,
  ) async {
    final uri = Uri.parse(
      '$apiUrl/posts?categories=$categoryId&per_page=30&orderby=date&order=desc&_embed',
    );

    final response = await http.get(uri);

    if (response.statusCode != 200) {
      throw Exception('خطا در دریافت نوشته‌های دسته‌بندی');
    }

    final List<dynamic> data = jsonDecode(response.body);

    return data
        .map(
          (item) => PostModel.fromJson(
            item as Map<String, dynamic>,
          ),
        )
        .toList();
  }
}

/* -------------------------------------------------------------------------- */
/*                              URL HANDLER                                   */
/* -------------------------------------------------------------------------- */

Future<void> openUrl(String url) async {
  final uri = Uri.parse(url);

  try {
    final opened = await launchUrl(
      uri,
      mode: LaunchMode.externalApplication,
    );

    if (!opened) {
      await launchUrl(uri);
    }
  } catch (_) {}
}

