/* =========================================================
   MODELS
========================================================= */

class PostModel {
  final int id;
  final String title;
  final String content;
  final String excerpt;
  final String date;
  final String imageUrl;

  const PostModel({
    required this.id,
    required this.title,
    required this.content,
    required this.excerpt,
    required this.date,
    required this.imageUrl,
  });

  factory PostModel.fromJson(Map<String, dynamic> json) {
    String image = '';

    try {
      image = json['_embedded']['wp:featuredmedia'][0]['source_url'] ?? '';
    } catch (_) {}

    return PostModel(
      id: json['id'] ?? 0,
      title: cleanHtml(json['title']?['rendered'] ?? ''),
      content: json['content']?['rendered'] ?? '',
      excerpt: cleanHtml(json['excerpt']?['rendered'] ?? ''),
      date: json['date'] ?? '',
      imageUrl: image,
    );
  }
}

class CategoryModel {
  final int id;
  final String name;
  final int parent;
  final int count;

  const CategoryModel({
    required this.id,
    required this.name,
    required this.parent,
    required this.count,
  });

  factory CategoryModel.fromJson(Map<String, dynamic> json) {
    return CategoryModel(
      id: json['id'] ?? 0,
      name: cleanHtml(json['name'] ?? ''),
      parent: json['parent'] ?? 0,
      count: json['count'] ?? 0,
    );
  }
}

/* =========================================================
   WORDPRESS API
========================================================= */

class WordPressApi {
  static Future<List<PostModel>> latestPosts() async {
    final uri = Uri.parse(
      '$apiUrl/posts?per_page=6&orderby=date&order=desc&_embed',
    );

    final response = await http.get(
      uri,
      headers: {
        'Accept': 'application/json',
      },
    );

    if (response.statusCode != 200) {
      throw Exception('خطا در دریافت نوشته‌ها');
    }

    final List<dynamic> data = jsonDecode(response.body);

    return data
        .map((item) => PostModel.fromJson(item))
        .toList();
  }

  static Future<List<CategoryModel>> categories() async {
    final List<CategoryModel> allCategories = [];

    int page = 1;

    while (true) {
      final uri = Uri.parse(
        '$apiUrl/categories?per_page=100&hide_empty=false&page=$page',
      );

      final response = await http.get(
        uri,
        headers: {
          'Accept': 'application/json',
        },
      );

      if (response.statusCode == 400) {
        break;
      }

      if (response.statusCode != 200) {
        throw Exception('خطا در دریافت دسته‌بندی‌ها');
      }

      final List<dynamic> data = jsonDecode(response.body);

      if (data.isEmpty) {
        break;
      }

      allCategories.addAll(
        data.map((item) => CategoryModel.fromJson(item)),
      );

      if (data.length < 100) {
        break;
      }

      page++;
    }

    allCategories.sort(
      (a, b) => a.name.compareTo(b.name),
    );

    return allCategories;
  }

  static Future<List<PostModel>> postsByCategory(
    int categoryId,
  ) async {
    final uri = Uri.parse(
      '$apiUrl/posts?categories=$categoryId&per_page=30&orderby=date&order=desc&_embed',
    );

    final response = await http.get(
      uri,
      headers: {
        'Accept': 'application/json',
      },
    );

    if (response.statusCode != 200) {
      throw Exception('خطا در دریافت نوشته‌های دسته‌بندی');
    }

    final List<dynamic> data = jsonDecode(response.body);

    return data
        .map((item) => PostModel.fromJson(item))
        .toList();
  }
}

/* =========================================================
   URL
========================================================= */

Future<void> openUrl(String url) async {
  if (url.isEmpty) {
    return;
  }

  final uri = Uri.parse(url);

  try {
    await launchUrl(
      uri,
      mode: LaunchMode.externalApplication,
    );
  } catch (_) {}
}

