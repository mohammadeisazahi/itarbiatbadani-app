          // =========================================================
          // صفحه دسته‌بندی‌ها
          // =========================================================

          class CategoriesPage
              extends StatelessWidget {

            const CategoriesPage({
              super.key,
            });


            @override
            Widget build(
              BuildContext context,
            ) {

              return Scaffold(

                appBar:
                    AppBar(
                  title:
                      const Text(
                    'دسته‌بندی‌ها',
                  ),
                ),


                body:
                    FutureBuilder<
                        List<CategoryItem>>(

                  future:
                      fetchAllCategories(),

                  builder:
                      (context, snapshot) {

                    if (snapshot
                            .connectionState ==
                        ConnectionState
                            .waiting) {

                      return const Center(
                        child:
                            CircularProgressIndicator(),
                      );
                    }


                    if (snapshot.hasError) {

                      return _ErrorCard(
                        message:
                            'دسته‌بندی‌ها از سایت دریافت نشد.',

                        onRetry: () {

                          Navigator.of(
                            context,
                          ).pushReplacement(
                            MaterialPageRoute(
                              builder: (_) =>
                                  const CategoriesPage(),
                            ),
                          );
                        },
                      );
                    }


                    final categories =
                        snapshot.data ?? [];


                    if (categories.isEmpty) {

                      return const _InfoCard(
                        text:
                            'در حال حاضر دسته‌بندی‌ای برای نمایش وجود ندارد.',
                      );
                    }


                    final Map<int,
                            List<CategoryItem>>
                        children = {};


                    for (final category
                        in categories) {

                      children
                          .putIfAbsent(
                            category.parent,
                            () => [],
                          )
                          .add(category);
                    }


                    final roots =
                        children[0] ?? [];


                    return ListView(

                      padding:
                          const EdgeInsets.all(16),

                      children:
                          roots.map(
                        (category) {

                          return _CategoryTile(

                            category:
                                category,

                            children:
                                children,
                          );
                        },
                      ).toList(),
                    );
                  },
                ),
              );
            }
          }


