          class SearchPage extends StatefulWidget {
            const SearchPage({super.key});

            @override
            State<SearchPage> createState() => _SearchPageState();
          }

          class _SearchPageState extends State<SearchPage> {
            final controller = TextEditingController();

            List<dynamic> results = [];
            bool loading = false;
            bool searched = false;

            Future<void> search() async {
              final query = controller.text.trim();

              if (query.isEmpty) {
                return;
              }

              setState(() {
                loading = true;
                searched = true;
              });

              try {
                final response = await http.get(
                  Uri.parse(
                    '$siteUrl/wp-json/wp/v2/search?search=${Uri.encodeQueryComponent(query)}&per_page=20',
                  ),
                );

                if (response.statusCode == 200) {
                  results = jsonDecode(response.body);
                } else {
                  results = [];
                }
              } catch (_) {
                results = [];
              }

              setState(() {
                loading = false;
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'جستجوی مطالب',
                    style: TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                ),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(14),
                      child: TextField(
                        controller: controller,
                        textInputAction:
                            TextInputAction.search,
                        onSubmitted: (_) => search(),
                        decoration: InputDecoration(
                          hintText: 'مثلاً ورزش، تمرین، تغذیه...',
                          prefixIcon: const Icon(Icons.search),
                          suffixIcon: IconButton(
                            onPressed: search,
                            icon: const Icon(Icons.arrow_forward),
                          ),
                          filled: true,
                          fillColor: Colors.white,
                          border: OutlineInputBorder(
                            borderRadius:
                                BorderRadius.circular(16),
                            borderSide: BorderSide.none,
                          ),
                        ),
                      ),
                    ),
                    Expanded(
                      child: loading
                          ? const Center(
                              child:
                                  CircularProgressIndicator(),
                            )
                          : !searched
                              ? const Center(
                                  child: Text(
                                    'عبارت مورد نظر خود را جستجو کنید.',
                                  ),
                                )
                              : results.isEmpty
                                  ? const Center(
                                      child: Text(
                                        'نتیجه‌ای پیدا نشد.',
                                      ),
                                    )
                                  : ListView.builder(
                                      itemCount: results.length,
                                      itemBuilder:
                                          (context, index) {
                                        final item =
                                            results[index];

                                        return Card(
                                          child: ListTile(
                                            leading:
                                                const CircleAvatar(
                                              backgroundColor:
                                                  navy,
                                              child: Icon(
                                                Icons.article,
                                                color: gold,
                                              ),
                                            ),
                                            title: Text(
                                              item['title'] ??
                                                  '',
                                              maxLines: 2,
                                              overflow:
                                                  TextOverflow
                                                      .ellipsis,
                                            ),
                                            onTap: () {
                                              if (item['url'] !=
                                                  null) {
                                                Navigator.push(
                                                  context,
                                                  MaterialPageRoute(
                                                    builder: (_) =>
                                                        WebPage(
                                                      url: item[
                                                          'url'],
                                                      title:
                                                          item[
                                                              'title'],
                                                    ),
                                                  ),
                                                );
                                              }
                                            },
                                          ),
                                        );
                                      },
                                    ),
                    ),
                  ],
                ),
              );
            }

            @override
            void dispose() {
              controller.dispose();
              super.dispose();
            }
          }

          class WebPage extends StatefulWidget {
            final String url;
            final String title;

            const WebPage({
              super.key,
              required this.url,
              required this.title,
            });

            @override
            State<WebPage> createState() => _WebPageState();
          }

          class _WebPageState extends State<WebPage> {
            late final WebViewController controller;
            bool loading = true;

            @override
            void initState() {
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(
                  JavaScriptMode.unrestricted,
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageFinished: (_) {
                      if (mounted) {
                        setState(() {
                          loading = false;
                        });
                      }
                    },
                  ),
                )
                ..loadRequest(
                  Uri.parse(widget.url),
                );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(
                    widget.title,
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  actions: [
                    IconButton(
                      onPressed: () {
                        openUrl(widget.url);
                      },
                      icon: const Icon(Icons.open_in_browser),
                    ),
                  ],
                ),
                body: Stack(
                  children: [
                    WebViewWidget(
                      controller: controller,
                    ),
                    if (loading)
                      const LinearProgressIndicator(
                        color: gold,
                        minHeight: 3,
                      ),
                  ],
                ),
              );
            }
          }
          DART

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter project
        working-directory: app
        run: flutter analyze

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             release/itarbiatbadani.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-modern-apk
          path: release/itarbiatbadani.apk
