          class QuickCard extends StatelessWidget {
            final IconData icon;
            final String title;
            final VoidCallback onTap;

            const QuickCard({
              super.key,
              required this.icon,
              required this.title,
              required this.onTap,
            });

            @override
            Widget build(BuildContext context) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(16),
                child: Container(
                  padding: const EdgeInsets.all(18),
                  decoration: BoxDecoration(
                    color: Colors.white,
                    borderRadius: BorderRadius.circular(16),
                    boxShadow: [
                      BoxShadow(
                        blurRadius: 10,
                        color: Colors.black.withOpacity(.06),
                      ),
                    ],
                  ),
                  child: Column(
                    children: [
                      Icon(
                        icon,
                        size: 34,
                        color: primaryColor,
                      ),
                      const SizedBox(height: 8),
                      Text(
                        title,
                        style: const TextStyle(
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class ShopBanner extends StatelessWidget {
            final String title;
            final String subtitle;
            final IconData icon;
            final String url;

            const ShopBanner({
              super.key,
              required this.title,
              required this.subtitle,
              required this.icon,
              required this.url,
            });

            @override
            Widget build(BuildContext context) {
              return InkWell(
                onTap: () {
                  Navigator.push(
                    context,
                    MaterialPageRoute(
                      builder: (_) => WebsitePage(url: url),
                    ),
