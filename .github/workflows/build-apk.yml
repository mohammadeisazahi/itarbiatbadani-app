/* ---------------- API ---------------- */

class Api {
  static Future<List<dynamic>> posts({
    int page = 1,
    String? search,
  }) async {
    final params = <String, String>{
      'per_page': '8',
      'page': '$page',
      '_embed': '1',
    };

    if (search != null && search.trim().isNotEmpty) {
      params['search'] = search.trim();
    }

    final uri = Uri.parse('$siteUrl/wp-json/wp/v2/posts')
        .replace(queryParameters: params);

    final response = await http
        .get(uri)
        .timeout(const Duration(seconds: 15));

    if (response.statusCode != 200) {
      throw Exception('خطا در دریافت مطالب');
    }

    return jsonDecode(response.body) as List<dynamic>;
  }

  static Future<List<dynamic>> categories() async {
    final uri = Uri.parse(
      '$siteUrl/wp-json/wp/v2/categories'
      '?per_page=100&hide_empty=true',
    );

    final response = await http
        .get(uri)
        .timeout(const Duration(seconds: 15));

    if (response.statusCode != 200) {
      throw Exception('خطا در دریافت دسته‌ها');
    }

    return jsonDecode(response.body) as List<dynamic>;
  }

  static Future<List<dynamic>> storeCategories() async {
    final uri = Uri.parse(
      '$siteUrl/wp-json/wp/v2/product_cat'
      '?per_page=100&hide_empty=false',
    );

    final response = await http
        .get(uri)
        .timeout(const Duration(seconds: 15));

    if (response.statusCode != 200) {
      throw Exception('خطا در دریافت فروشگاه');
    }

    return jsonDecode(response.body) as List<dynamic>;
  }
}

/* ---------------- Helpers ---------------- */

String cleanHtml(String text) {
  return text
      .replaceAll(RegExp(r'<[^>]*>'), ' ')
      .replaceAll('&nbsp;', ' ')
      .replaceAll('&amp;', '&')
      .replaceAll('&quot;', '"')
      .replaceAll('&#8217;', '’')
      .replaceAll(RegExp(r'\s+'), ' ')
      .trim();
}

String? postImage(Map<String, dynamic> post) {
  try {
    return post['_embedded']['wp:featuredmedia'][0]['source_url'];
  } catch (_) {
    return null;
  }
}

Future<void> openExternal(String url) async {
  final uri = Uri.tryParse(url);

  if (uri != null) {
    await launchUrl(
      uri,
      mode: LaunchMode.externalApplication,
    );
  }
}

