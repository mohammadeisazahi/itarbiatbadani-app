name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create \
            --project-name itarbiatbadani_app \
            --org ir.itarbiatbadani \
            --platforms android \
            app

      - name: Add required packages
        working-directory: app
        run: |
          flutter pub add http
          flutter pub add url_launcher
          flutter pub add webview_flutter
          flutter pub add cached_network_image
          flutter pub add flutter_launcher_icons --dev

      - name: Download website logo
        run: |
          mkdir -p app/assets
          curl -L \
            "https://itarbiatbadani.ir/wp-content/uploads/2025/07/1000073463.png" \
            -o app/assets/logo.png

      - name: Configure launcher icon
        working-directory: app
        run: |
          cat >> pubspec.yaml <<'EOF'

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/logo.png"
            adaptive_icon_background: "#0A3D62"
            adaptive_icon_foreground: "assets/logo.png"
          EOF

      - name: Replace main.dart
        working-directory: app
        run: |
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:url_launcher/url_launcher.dart';
          import 'dart:convert';

          const String siteUrl = 'https://itarbiatbadani.ir';
          const String telegramUrl = 'https://t.me/itarbiatbadani';
          const String instagramUrl =
              'https://instagram.com/itarbiatbadani';

          const Color navy = Color(0xFF0A3D62);
          const Color blue = Color(0xFF3C6382);
          const Color gold = Color(0xFFFBC531);

          void main() {
            runApp(const ItarbiatBadaniApp());
          }

          class ItarbiatBadaniApp extends StatelessWidget {
            const ItarbiatBadaniApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'تربیت بدنی و علوم ورزشی',
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: navy,
                    primary: navy,
                    secondary: gold,
                  ),
                  scaffoldBackgroundColor: Colors.white,
                  fontFamily: 'sans',
                  appBarTheme: const AppBarTheme(
                    backgroundColor: navy,
                    foregroundColor: Colors.white,
                    centerTitle: true,
                  ),
                ),
                home: const MainNavigation(),
              );
            }
          }

          class MainNavigation extends StatefulWidget {
            const MainNavigation({super.key});

            @override
            State<MainNavigation> createState() => _MainNavigationState();
          }

          class _MainNavigationState extends State<MainNavigation> {
            int currentIndex = 0;

            final List<Widget> pages = const [
              HomePage(),
              CategoriesPage(),
              StorePage(),
              TelegramPage(),
              MorePage(),
            ];

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  body: IndexedStack(
                    index: currentIndex,
                    children: pages,
                  ),
                  bottomNavigationBar: NavigationBar(
                    selectedIndex: currentIndex,
                    onDestinationSelected: (index) {
                      setState(() {
                        currentIndex = index;
                      });
                    },
                    destinations: const [
                      NavigationDestination(
                        icon: Icon(Icons.home_outlined),
                        selectedIcon: Icon(Icons.home),
                        label: 'خانه',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.category_outlined),
                        selectedIcon: Icon(Icons.category),
                        label: 'دسته‌بندی‌ها',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.storefront_outlined),
                        selectedIcon: Icon(Icons.storefront),
                        label: 'فروشگاه',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.telegram),
                        selectedIcon: Icon(Icons.telegram),
                        label: 'تلگرام',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.more_horiz),
                        selectedIcon: Icon(Icons.more_horiz),
                        label: 'بیشتر',
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          Future<void> openUrl(String url) async {
            final uri = Uri.parse(url);

            if (await canLaunchUrl(uri)) {
              await launchUrl(
                uri,
                mode: LaunchMode.externalApplication,
              );
            }
          }

          class HomePage extends StatefulWidget {
            const HomePage({super.key});

            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            late Future<List<dynamic>> postsFuture;

            @override
            void initState() {
              super.initState();
              postsFuture = fetchPosts();
            }

            Future<List<dynamic>> fetchPosts() async {
              final response = await http.get(
                Uri.parse(
                  '$siteUrl/wp-json/wp/v2/posts?per_page=10&_embed',
                ),
              );

              if (response.statusCode != 200) {
                throw Exception('خطا در دریافت نوشته‌ها');
              }

              return jsonDecode(response.body) as List<dynamic>;
            }

            String stripHtml(String text) {
              return text
                  .replaceAll(RegExp(r'<[^>]*>'), '')
                  .replaceAll('&nbsp;', ' ')
                  .trim();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'تربیت بدنی و علوم ورزشی',
                    style: TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                ),
                body: RefreshIndicator(
                  onRefresh: () async {
                    setState(() {
                      postsFuture = fetchPosts();
                    });
                    await postsFuture;
                  },
                  child: FutureBuilder<List<dynamic>>(
                    future: postsFuture,
                    builder: (context, snapshot) {
                      if (snapshot.connectionState ==
                          ConnectionState.waiting) {
                        return const Center(
                          child: CircularProgressIndicator(),
                        );
                      }

                      if (snapshot.hasError) {
                        return Center(
                          child: Padding(
                            padding: const EdgeInsets.all(24),
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                const Icon(
                                  Icons.error_outline,
                                  size: 50,
                                  color: Colors.red,
                                ),
                                const SizedBox(height: 12),
                                const Text(
                                  'دریافت مطالب با مشکل مواجه شد.',
                                  textAlign: TextAlign.center,
                                ),
                                const SizedBox(height: 12),
                                ElevatedButton(
                                  onPressed: () {
                                    setState(() {
                                      postsFuture = fetchPosts();
                                    });
                                  },
                                  child: const Text('تلاش دوباره'),
                                ),
                              ],
                            ),
                          ),
                        );
                      }

                      final posts = snapshot.data ?? [];

                      if (posts.isEmpty) {
                        return const Center(
                          child: Text('هنوز مطلبی منتشر نشده است.'),
                        );
                      }

                      return ListView.builder(
                        physics: const AlwaysScrollableScrollPhysics(),
                        padding: const EdgeInsets.all(12),
                        itemCount: posts.length,
                        itemBuilder: (context, index) {
                          final post = posts[index];

                          final title =
                              stripHtml(post['title']['rendered'] ?? '');

                          final excerpt =
                              stripHtml(post['excerpt']['rendered'] ?? '');

                          return PostCard(
                            title: title,
                            excerpt: excerpt,
                            url: post['link'] ?? siteUrl,
                          );
                        },
                      );
                    },
                  ),
                ),
              );
            }
          }

          class PostCard extends StatelessWidget {
            final String title;
            final String excerpt;
            final String url;

            const PostCard({
              super.key,
              required this.title,
              required this.excerpt,
              required this.url,
            });

            @override
            Widget build(BuildContext context) {
              return Card(
                margin: const EdgeInsets.only(bottom: 12),
                elevation: 2,
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        title,
                        style: const TextStyle(
                          fontSize: 18,
                          fontWeight: FontWeight.bold,
                          color: navy,
                        ),
                      ),
                      if (excerpt.isNotEmpty) ...[
                        const SizedBox(height: 8),
                        Text(
                          excerpt,
                          maxLines: 3,
                          overflow: TextOverflow.ellipsis,
                        ),
                      ],
                      const SizedBox(height: 12),
                      Align(
                        alignment: Alignment.centerLeft,
                        child: FilledButton(
                          onPressed: () => openUrl(url),
                          child: const Text('مطالعه مطلب'),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class CategoriesPage extends StatefulWidget {
            const CategoriesPage({super.key});

            @override
            State<CategoriesPage> createState() => _CategoriesPageState();
          }

          class _CategoriesPageState extends State<CategoriesPage> {
            late Future<List<dynamic>> categoriesFuture;

            @override
            void initState() {
              super.initState();
              categoriesFuture = fetchCategories();
            }

            Future<List<dynamic>> fetchCategories() async {
              final response = await http.get(
                Uri.parse(
                  '$siteUrl/wp-json/wp/v2/categories?per_page=100',
                ),
              );

              if (response.statusCode != 200) {
                throw Exception('خطا در دریافت دسته‌بندی‌ها');
              }

              return jsonDecode(response.body) as List<dynamic>;
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('دسته‌بندی‌ها'),
                ),
                body: FutureBuilder<List<dynamic>>(
                  future: categoriesFuture,
                  builder: (context, snapshot) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
                      return const Center(
                        child: Text(
                          'دریافت دسته‌بندی‌ها با مشکل مواجه شد.',
                        ),
                      );
                    }

                    final categories = snapshot.data ?? [];

                    return ListView.separated(
                      padding: const EdgeInsets.all(12),
                      itemCount: categories.length,
                      separatorBuilder: (_, __) =>
                          const SizedBox(height: 8),
                      itemBuilder: (context, index) {
                        final category = categories[index];

                        return Card(
                          child: ListTile(
                            leading: const CircleAvatar(
                              backgroundColor: navy,
                              child: Icon(
                                Icons.folder_outlined,
                                color: Colors.white,
                              ),
                            ),
                            title: Text(
                              category['name'] ?? '',
                              style: const TextStyle(
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            trailing:
                                const Icon(Icons.arrow_back_ios, size: 16),
                            onTap: () {
                              Navigator.push(
                                context,
                                MaterialPageRoute(
                                  builder: (_) => CategoryPostsPage(
                                    categoryId: category['id'],
                                    categoryName:
                                        category['name'] ?? '',
                                  ),
                                ),
                              );
                            },
                          ),
                        );
                      },
                    );
                  },
                ),
              );
            }
          }

          class CategoryPostsPage extends StatefulWidget {
            final int categoryId;
            final String categoryName;

            const CategoryPostsPage({
              super.key,
              required this.categoryId,
              required this.categoryName,
            });

            @override
            State<CategoryPostsPage> createState() =>
                _CategoryPostsPageState();
          }

          class _CategoryPostsPageState
              extends State<CategoryPostsPage> {
            late Future<List<dynamic>> postsFuture;

            @override
            void initState() {
              super.initState();
              postsFuture = fetchPosts();
            }

            Future<List<dynamic>> fetchPosts() async {
              final response = await http.get(
                Uri.parse(
                  '$siteUrl/wp-json/wp/v2/posts'
                  '?categories=${widget.categoryId}&per_page=20',
                ),
              );

              if (response.statusCode != 200) {
                throw Exception('خطا در دریافت مطالب');
              }

              return jsonDecode(response.body) as List<dynamic>;
            }

            String stripHtml(String text) {
              return text
                  .replaceAll(RegExp(r'<[^>]*>'), '')
                  .replaceAll('&nbsp;', ' ')
                  .trim();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(widget.categoryName),
                ),
                body: FutureBuilder<List<dynamic>>(
                  future: postsFuture,
                  builder: (context, snapshot) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
                      return const Center(
                        child: Text('خطا در دریافت مطالب'),
                      );
                    }

                    final posts = snapshot.data ?? [];

                    if (posts.isEmpty) {
                      return const Center(
                        child: Text(
                          'مطلبی در این دسته‌بندی وجود ندارد.',
                        ),
                      );
                    }

                    return ListView.builder(
                      padding: const EdgeInsets.all(12),
                      itemCount: posts.length,
                      itemBuilder: (context, index) {
                        final post = posts[index];

                        return PostCard(
                          title: stripHtml(
                            post['title']['rendered'] ?? '',
                          ),
                          excerpt: stripHtml(
                            post['excerpt']['rendered'] ?? '',
                          ),
                          url: post['link'] ?? siteUrl,
                        );
                      },
                    );
                  },
                ),
              );
            }
          }

          class StorePage extends StatelessWidget {
            const StorePage({super.key});

            final String shopUrl = '$siteUrl/shop/';
            final String accountUrl = '$siteUrl/my-account/';

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('فروشگاه'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(20),
                  children: [
                    const Icon(
                      Icons.storefront,
                      size: 80,
                      color: navy,
                    ),
                    const SizedBox(height: 20),
                    const Text(
                      'فروشگاه تربیت بدنی و علوم ورزشی',
                      textAlign: TextAlign.center,
                      style: TextStyle(
                        fontSize: 21,
                        fontWeight: FontWeight.bold,
                        color: navy,
                      ),
                    ),
                    const SizedBox(height: 10),
                    const Text(
                      'برای خرید فایل‌ها و مدیریت خریدهای خود از فروشگاه سایت استفاده کنید.',
                      textAlign: TextAlign.center,
                    ),
                    const SizedBox(height: 30),
                    FilledButton.icon(
                      onPressed: () => openUrl(accountUrl),
                      icon: const Icon(Icons.person),
                      label: const Text(
                        'ورود / ایجاد حساب کاربری',
                      ),
                    ),
                    const SizedBox(height: 12),
                    OutlinedButton.icon(
                      onPressed: () => openUrl(shopUrl),
                      icon: const Icon(Icons.store),
                      label: const Text('ورود به فروشگاه'),
                    ),
                    const SizedBox(height: 12),
                    OutlinedButton.icon(
                      onPressed: () => openUrl(accountUrl),
                      icon: const Icon(Icons.download),
                      label: const Text('مشاهده دانلودهای من'),
                    ),
                  ],
                ),
              );
            }
          }

          class TelegramPage extends StatelessWidget {
            const TelegramPage({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('تلگرام'),
                ),
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Icon(
                          Icons.telegram,
                          size: 90,
                          color: Color(0xFF229ED9),
                        ),
                        const SizedBox(height: 20),
                        const Text(
                          'کانال تربیت بدنی و علوم ورزشی',
                          textAlign: TextAlign.center,
                          style: TextStyle(
                            fontSize: 21,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 12),
                        const Text(
                          '@itarbiatbadani',
                          style: TextStyle(
                            fontSize: 18,
                            color: navy,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 25),
                        FilledButton.icon(
                          onPressed: () => openUrl(telegramUrl),
                          icon: const Icon(Icons.telegram),
                          label: const Text('ورود به کانال تلگرام'),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class MorePage extends StatelessWidget {
            const MorePage({super.key});

            final String accountUrl = '$siteUrl/my-account/';
            final String shopUrl = '$siteUrl/shop/';

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('بیشتر'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(12),
                  children: [
                    ListTile(
                      leading: const Icon(Icons.language, color: navy),
                      title: const Text('وب‌سایت'),
                      subtitle: const Text('itarbiatbadani.ir'),
                      onTap: () => openUrl(siteUrl),
                    ),
                    const Divider(),
                    ListTile(
                      leading: const Icon(Icons.store, color: navy),
                      title: const Text('فروشگاه'),
                      onTap: () => openUrl(shopUrl),
                    ),
                    const Divider(),
                    ListTile(
                      leading: const Icon(Icons.person, color: navy),
                      title: const Text('حساب کاربری'),
                      onTap: () => openUrl(accountUrl),
                    ),
                    const Divider(),
                    ListTile(
                      leading:
                          const Icon(Icons.telegram, color: Color(0xFF229ED9)),
                      title: const Text('کانال تلگرام'),
                      onTap: () => openUrl(telegramUrl),
                    ),
                    const Divider(),
                    ListTile(
                      leading:
                          const Icon(Icons.camera_alt, color: Colors.pink),
                      title: const Text('اینستاگرام'),
                      onTap: () => openUrl(instagramUrl),
                    ),
                    const Divider(),
                    ListTile(
                      leading: const Icon(Icons.contact_page, color: navy),
                      title: const Text('ارتباط با ما'),
                      subtitle: const Text('@ivarzeshiadmin'),
                      onTap: () => openUrl(
                        'https://t.me/ivarzeshiadmin',
                      ),
                    ),
                    const SizedBox(height: 25),
                    const Text(
                      'تربیت بدنی و علوم ورزشی',
                      textAlign: TextAlign.center,
                      style: TextStyle(
                        color: navy,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 5),
                    const Text(
                      'محمد عیسی زهی، کارشناسی ارشد مدیریت ورزشی',
                      textAlign: TextAlign.center,
                      style: TextStyle(
                        color: Colors.grey,
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          DART

      - name: Remove default Flutter test
        run: rm -rf app/test

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter project
        working-directory: app
        run: flutter analyze

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-release.apk \
            release/itarbiatbadani.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-modern-apk
          path: release/itarbiatbadani.apk
