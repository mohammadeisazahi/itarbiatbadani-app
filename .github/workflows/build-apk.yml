            final IconData icon;

            final bool disabled;


            const ServiceItem({
              required this.title,
              required this.url,
              required this.icon,
              this.disabled = false,
            });
          }


          const List<ServiceItem>
              services = [

            ServiceItem(
              title: 'معرفی رشته',
              url:
                  '$siteUrl/introduction-to-the-field-of-physical-education-and-sports-sciences/',
              icon:
                  Icons.info_outline,
            ),

            ServiceItem(
              title: 'گرایش‌های ارشد',
              url:
                  '$siteUrl/%da%af%d8%b1%d8%a7%db%8c%d8%b4%d9%87%d8%a7%db%8c-%da%a9%d8%a7%d8%b1%d8%b4%d9%86%d8%a7%d8%b3%db%8c-%d8%a7%d8%b1%d8%b4%d8%af-%d8%aa%d8%b1%d8%a8%db%8c%d8%aa-%d8%a8%d8%af%d9%86%db%8c-%d9%88/',
              icon:
                  Icons.layers_outlined,
            ),

            ServiceItem(
              title: 'گرایش‌های دکتری',
              url:
                  '$siteUrl/sports-science-phd-exam-resources/',
              icon:
                  Icons.school_outlined,
            ),

            ServiceItem(
              title: 'منابع ارشد',
              url:
                  '$siteUrl/master-of-sports-science-resources/',
              icon:
                  Icons.menu_book_outlined,
            ),

            ServiceItem(
              title: 'منابع دکتری',
              url:
                  '$siteUrl/manabe-konkur-doctori-tarbiat-badani/',
              icon:
                  Icons.chrome_reader_mode_outlined,
            ),

            ServiceItem(
              title: 'منابع استخدامی',
              url: '#',
              icon:
                  Icons.assignment_outlined,
              disabled: true,
            ),

            ServiceItem(
              title: 'دانشگاه‌های برتر',
              url:
                  '$siteUrl/physical-education-sports-science/',
              icon:
                  Icons.account_balance_outlined,
            ),

            ServiceItem(
              title: 'بازار کار',
              url:
                  '$siteUrl/job-market-in-physical-education-and-sports-sciences/',
              icon:
                  Icons.work_outline,
            ),

            ServiceItem(
              title: 'طرح درس',
              url:
                  '$siteUrl/product-category/%d8%b7%d8%b1%d8%ad-%d8%af%d8%b1%d8%b3-%d8%b1%d9%88%d8%b2%d8%a7%d9%86%d9%87-%d9%85%d8%a7%d9%87%d8%a7%d9%86%d9%87-%d8%b3%d8%a7%d9%84%d8%a7%d9%86%d9%87/',
              icon:
                  Icons.co_present_outlined,
            ),

            ServiceItem(
              title: 'پاورپوینت',
              url:
                  '$siteUrl/product-category/powerpoint/',
              icon:
                  Icons.slideshow_outlined,
            ),
          ];


          // =========================================================
          // ناوبری اصلی
          // =========================================================

          class MainNavigation
              extends StatefulWidget {

            const MainNavigation({
              super.key,
            });


            @override
            State<MainNavigation>
                createState() =>
                    _MainNavigationState();
          }


          class _MainNavigationState
              extends State<MainNavigation> {

            int currentIndex = 0;


            final pages = const [

              HomePage(),

              CategoriesPage(),

              StorePage(),

              TelegramPage(),

              MorePage(),
            ];


            @override
            Widget build(
              BuildContext context,
            ) {

              return Scaffold(

                body:
                    IndexedStack(
                  index: currentIndex,
                  children: pages,
                ),


                bottomNavigationBar:
                    NavigationBar(

                  selectedIndex:
                      currentIndex,

                  onDestinationSelected:
                      (index) {

                    setState(() {

                      currentIndex =
                          index;
                    });
                  },


                  destinations: const [

                    NavigationDestination(
                      icon:
                          Icon(
                        Icons.home_outlined,
                      ),
                      selectedIcon:
                          Icon(
                        Icons.home,
                      ),
                      label: 'خانه',
                    ),

                    NavigationDestination(
                      icon:
                          Icon(
                        Icons.category_outlined,
                      ),
                      selectedIcon:
                          Icon(
                        Icons.category,
                      ),
                      label:
                          'دسته‌بندی‌ها',
                    ),

                    NavigationDestination(
                      icon:
                          Icon(
                        Icons.storefront_outlined,
                      ),
                      selectedIcon:
                          Icon(
                        Icons.storefront,
                      ),
                      label:
                          'فروشگاه',
                    ),

                    NavigationDestination(
                      icon:
                          Icon(
                        Icons.send_outlined,
                      ),
                      selectedIcon:
                          Icon(
                        Icons.send,
                      ),
                      label:
                          'تلگرام',
                    ),

                    NavigationDestination(
                      icon:
                          Icon(
                        Icons.more_horiz,
                      ),
                      selectedIcon:
                          Icon(
                        Icons.more,
                      ),
                      label:
                          'بیشتر',
                    ),
                  ],
                ),
              );
            }
          }


          // =========================================================
          // صفحه خانه
          // =========================================================

          class HomePage
              extends StatelessWidget {

            const HomePage({
              super.key,
            });


            @override
            Widget build(
              BuildContext context,
            ) {

              return Scaffold(

                appBar:
                    AppBar(
                  title: const Text(
                    'تربیت بدنی و علوم ورزشی',
                    style: TextStyle(
                      fontWeight:
                          FontWeight.bold,
                    ),
                  ),
                ),


                body:
                    RefreshIndicator(

                  onRefresh: () async {

                    await fetchLatestPosts();
                  },


                  child:
                      ListView(

                    physics:
                        const AlwaysScrollableScrollPhysics(),

                    padding:
                        const EdgeInsets.fromLTRB(
                      16,
                      16,
                      16,
                      28,
                    ),


                    children: const [

                      _WelcomeCard(),

                      SizedBox(
                        height: 22,
                      ),

                      _LatestPostsSection(),

                      SizedBox(
                        height: 28,
                      ),

                      _ServicesSection(),
                    ],
                  ),
                ),
              );
            }
          }


          // =========================================================
          // کارت خوش‌آمد
          // =========================================================

          class _WelcomeCard
              extends StatelessWidget {

            const _WelcomeCard();


            @override
            Widget build(
              BuildContext context,
            ) {

              return Container(

                padding:
                    const EdgeInsets.all(22),

                decoration:
                    BoxDecoration(

                  gradient:
                      const LinearGradient(
                    colors: [
                      primaryColor,
                      secondaryColor,
                    ],
                  ),

                  borderRadius:
                      BorderRadius.circular(22),

                  boxShadow: [

                    BoxShadow(
                      color:
                          primaryColor.withValues(
                        alpha: .18,
                      ),
                      blurRadius: 18,
                      offset:
                          const Offset(0, 8),
                    ),
                  ],
                ),


                child:
                    const Column(

                  crossAxisAlignment:
                      CrossAxisAlignment.start,

                  children: [

                    Text(
                      'مرجع تخصصی تربیت بدنی و علوم ورزشی',
                      style: TextStyle(
                        color:
                            Colors.white,
                        fontSize: 21,
                        fontWeight:
                            FontWeight.bold,
                      ),
                    ),

                    SizedBox(
                      height: 10,
                    ),

                    Text(
                      'آخرین مطالب، منابع و خدمات تخصصی رشته تربیت بدنی و علوم ورزشی',
                      style: TextStyle(
                        color:
                            Colors.white70,
                        height: 1.7,
                        fontSize: 14,
                      ),
                    ),
                  ],
                ),
              );
            }
          }


          // =========================================================
          // جدیدترین مطالب
          // =========================================================

          class _LatestPostsSection
              extends StatelessWidget {

            const _LatestPostsSection();


            @override
            Widget build(
              BuildContext context,
            ) {

              return Column(

                crossAxisAlignment:
                    CrossAxisAlignment.start,

                children: [

                  const _SectionTitle(
                    title:
                        'جدیدترین مطالب',
                    icon:
                        Icons.article_outlined,
                  ),

                  const SizedBox(
                    height: 12,
                  ),


                  FutureBuilder<
                      List<PostItem>>(
                    future:
                        fetchLatestPosts(),

                    builder:
                        (context, snapshot) {

                      if (snapshot
                              .connectionState ==
                          ConnectionState
                              .waiting) {

                        return const Center(
                          child:
                              Padding(
                            padding:
                                EdgeInsets.all(30),
                            child:
                                CircularProgressIndicator(),
                          ),
                        );
                      }


                      if (snapshot.hasError) {

                        return _ErrorCard(
                          message:
                              'دریافت مطالب از سایت انجام نشد.',

                          onRetry: () {

                            Navigator.of(
                              context,
                            ).pushReplacement(
                              MaterialPageRoute(
                                builder: (_) =>
                                    const HomePage(),
                              ),
                            );
                          },
                        );
                      }


                      final posts =
                          snapshot.data ?? [];


                      if (posts.isEmpty) {

                        return const _InfoCard(
                          text:
                              'هنوز مطلبی برای نمایش وجود ندارد.',
                        );
                      }


                      return Column(

                        children:
                            posts.map(
                          (post) => Padding(

                            padding:
                                const EdgeInsets.only(
                              bottom: 12,
                            ),

                            child:
                                PostCard(
                              post: post,
                            ),
                          ),
                        ).toList(),
                      );
                    },
                  ),
                ],
              );
            }
          }


          // =========================================================
          // خدمات ما
          // =========================================================

          class _ServicesSection
              extends StatelessWidget {

            const _ServicesSection();


            @override
            Widget build(
              BuildContext context,
            ) {

              return Column(

                crossAxisAlignment:
                    CrossAxisAlignment.start,

                children: [

                  const _SectionTitle(
                    title:
                        'خدمات ما',
                    icon:
                        Icons.apps_outlined,
                  ),

                  const SizedBox(
                    height: 12,
                  ),


                  SizedBox(

                    height: 150,

                    child:
                        ListView.separated(

                      scrollDirection:
                          Axis.horizontal,

                      itemCount:
                          services.length,

                      separatorBuilder:
                          (_, __) =>
                              const SizedBox(
                        width: 12,
                      ),

                      itemBuilder:
                          (context, index) {

                        return SizedBox(

                          width: 145,

                          child:
                              _ServiceCard(
                            service:
                                services[index],
                          ),
                        );
                      },
                    ),
                  ),
                ],
              );
            }
          }


          // =========================================================
          // عنوان بخش
          // =========================================================

          class _SectionTitle
              extends StatelessWidget {

            final String title;

            final IconData icon;


            const _SectionTitle({
              required this.title,
              required this.icon,
            });


            @override
            Widget build(
              BuildContext context,
            ) {

              return Row(

                children: [

                  Container(

                    padding:
                        const EdgeInsets.all(8),

                    decoration:
                        BoxDecoration(

                      color:
                          goldColor.withValues(
                        alpha: .16,
                      ),

                      borderRadius:
                          BorderRadius.circular(10),
                    ),

                    child:
                        Icon(
                      icon,
                      color:
                          primaryColor,
                      size: 21,
                    ),
                  ),

                  const SizedBox(
                    width: 10,
                  ),

                  Text(
                    title,
                    style:
                        const TextStyle(
                      fontSize: 20,
                      fontWeight:
                          FontWeight.bold,
                      color:
                          primaryColor,
                    ),
                  ),
                ],
              );
            }
          }


          // =========================================================
          // کارت مطلب
          // =========================================================

          class PostCard
              extends StatelessWidget {

            final PostItem post;


            const PostCard({
              super.key,
              required this.post,
            });


            @override
            Widget build(
              BuildContext context,
            ) {

              return Card(

                elevation: 0,

                margin:
                    EdgeInsets.zero,

                clipBehavior:
                    Clip.antiAlias,

                shape:
                    RoundedRectangleBorder(
                  borderRadius:
                      BorderRadius.circular(18),

                  side:
                      BorderSide(
                    color:
                        Colors.grey.shade200,
                  ),
                ),


                child:
                    InkWell(

                  onTap: () =>
