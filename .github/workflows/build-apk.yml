class CategoriesPage extends StatefulWidget {
  const CategoriesPage({super.key});

  @override
  State<CategoriesPage> createState() =>
      _CategoriesPageState();
}

class _CategoriesPageState extends State<CategoriesPage> {
  late Future<List<CategoryModel>> futureCategories;

  @override
  void initState() {
    super.initState();
    futureCategories = WordPressApi.categories();
  }

  Future<void> reload() async {
    setState(() {
      futureCategories = WordPressApi.categories();
    });

    await futureCategories;
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('دسته‌بندی‌ها'),
      ),
      body: FutureBuilder<List<CategoryModel>>(
        future: futureCategories,
        builder: (context, snapshot) {
          if (snapshot.connectionState ==
              ConnectionState.waiting) {
            return const Center(
              child: CircularProgressIndicator(),
            );
          }

          if (snapshot.hasError) {
            return ErrorBox(
              message: 'دریافت دسته‌بندی‌ها با مشکل مواجه شد.',
              onRetry: reload,
            );
          }

          final categories = snapshot.data ?? [];

          final parents = categories
              .where((category) => category.parent == 0)
              .toList();

          if (parents.isEmpty) {
            return const EmptyBox(
              message: 'دسته‌بندی‌ای پیدا نشد.',
            );
          }

          return RefreshIndicator(
            onRefresh: reload,
            child: ListView.builder(
              padding: const EdgeInsets.all(14),
              itemCount: parents.length,
              itemBuilder: (context, index) {
                final parent = parents[index];

                final children = categories
                    .where(
                      (category) =>
                          category.parent == parent.id,
                    )
                    .toList();

                if (children.isEmpty) {
                  return CategoryTile(
                    category: parent,
                    onTap: () {
                      Navigator.push(
                        context,
                        MaterialPageRoute(
                          builder: (_) =>
                              CategoryPostsPage(
                            category: parent,
                          ),
                        ),
                      );
                    },
                  );
                }

                return Card(
                  elevation: 0,
                  margin:
                      const EdgeInsets.only(bottom: 10),
                  color: Colors.white,
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(17),
                  ),
                  child: ExpansionTile(
                    tilePadding:
                        const EdgeInsets.symmetric(
                      horizontal: 16,
                    ),
                    leading: CategoryIcon(
                      name: parent.name,
                    ),
                    title: Text(
                      parent.name,
                      style: const TextStyle(
                        fontWeight: FontWeight.bold,
                        fontSize: 14,
                      ),
                    ),
                    subtitle: Text(
                      '${parent.count} نوشته',
                      style: TextStyle(
                        fontSize: 10,
                        color: Colors.grey.shade600,
                      ),
                    ),
                    children: [
                      ...children.map(
                        (child) => ListTile(
                          contentPadding:
                              const EdgeInsets.only(
                            right: 65,
                            left: 16,
                          ),
                          leading: CategoryIcon(
                            name: child.name,
                            small: true,
                          ),
                          title: Text(
                            child.name,
                            style: const TextStyle(
                              fontSize: 13,
                            ),
                          ),
                          trailing: const Icon(
                            Icons.chevron_left,
                            size: 20,
                            color: primaryColor,
                          ),
                          onTap: () {
                            Navigator.push(
                              context,
                              MaterialPageRoute(
                                builder: (_) =>
                                    CategoryPostsPage(
                                  category: child,
                                ),
                              ),
                            );
                          },
                        ),
                      ),
                    ],
                  ),
                );
              },
            ),
          );
        },
      ),
    );
  }
}

