class CategoryIcon extends StatelessWidget {
  final String name;
  final bool small;

  const CategoryIcon({
    super.key,
    required this.name,
    this.small = false,
  });

  IconData get icon {
    final n = name.toLowerCase();

    if (n.contains('ورزش')) {
      return Icons.sports_soccer;
    }

    if (n.contains('تغذ')) {
      return Icons.restaurant;
    }

    if (n.contains('تمرین')) {
      return Icons.fitness_center;
    }

    if (n.contains('فیزیولوژی')) {
      return Icons.monitor_heart_outlined;
    }

    if (n.contains('آسیب')) {
      return Icons.healing_outlined;
    }

    if (n.contains('مدیریت')) {
      return Icons.business_center_outlined;
    }

    if (n.contains('پژوهش') ||
        n.contains('تحقیق')) {
      return Icons.science_outlined;
    }

    if (n.contains('دانشگاه')) {
      return Icons.account_balance_outlined;
    }

    if (n.contains('استخدام') ||
        n.contains('شغل') ||
        n.contains('کار')) {
      return Icons.work_outline;
    }

    if (n.contains('درس') ||
        n.contains('آموزش')) {
      return Icons.school_outlined;
    }

    if (n.contains('مقال')) {
      return Icons.article_outlined;
    }

    if (n.contains('سلامت')) {
      return Icons.health_and_safety_outlined;
    }

    if (n.contains('بانوان') ||
        n.contains('زنان')) {
      return Icons.woman_outlined;
    }

    if (n.contains('کودک')) {
      return Icons.child_care_outlined;
    }

    return Icons.category_outlined;
  }

  @override
  Widget build(BuildContext context) {
    final size = small ? 34.0 : 45.0;
    final iconSize = small ? 18.0 : 23.0;

    return Container(
      width: size,
      height: size,
      decoration: BoxDecoration(
        color: primaryColor.withValues(alpha: 0.09),
        borderRadius: BorderRadius.circular(
          small ? 10 : 13,
        ),
      ),
      child: Icon(
        icon,
        color: primaryColor,
        size: iconSize,
      ),
    );
  }
}

/* -------------------------------------------------------------------------- */
/*                          CATEGORY POSTS                                    */
/* -------------------------------------------------------------------------- */

class CategoryPostsPage extends StatefulWidget {
  final CategoryModel category;

  const CategoryPostsPage({
    super.key,
    required this.category,
  });

  @override
  State<CategoryPostsPage> createState() =>
      _CategoryPostsPageState();
}

class _CategoryPostsPageState
    extends State<CategoryPostsPage> {
  late Future<List<PostModel>> futurePosts;

  @override
  void initState() {
    super.initState();

    futurePosts =
        WordPressApi.postsByCategory(widget.category.id);
  }

  Future<void> reload() async {
    setState(() {
      futurePosts =
          WordPressApi.postsByCategory(widget.category.id);
    });

    await futurePosts;
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: Text(widget.category.name),
      ),
      body: FutureBuilder<List<PostModel>>(
        future: futurePosts,
        builder: (context, snapshot) {
          if (snapshot.connectionState ==
              ConnectionState.waiting) {
            return const Center(
              child: CircularProgressIndicator(),
            );
          }

          if (snapshot.hasError) {
            return ErrorBox(
              message: 'دریافت نوشته‌ها با مشکل مواجه شد.',
              onRetry: reload,
            );
          }

          final posts = snapshot.data ?? [];

          if (posts.isEmpty) {
            return const EmptyBox(
              message:
                  'در این دسته‌بندی هنوز نوشته‌ای وجود ندارد.',
            );
          }

          return RefreshIndicator(
            onRefresh: reload,
            child: ListView.builder(
              physics:
                  const AlwaysScrollableScrollPhysics(),
              padding: const EdgeInsets.all(16),
              itemCount: posts.length,
              itemBuilder: (context, index) {
                return PostCard(
                  post: posts[index],
                );
              },
            ),
          );
        },
      ),
    );
  }
}

