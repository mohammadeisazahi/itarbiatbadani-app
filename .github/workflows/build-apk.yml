          DART

      - name: Remove default tests
        run: |
          rm -rf app/test

      - name: Get dependencies
        working-directory: app
        run: |
          flutter pub get

      - name: Generate launcher icons
        working-directory: app
        run: |
          dart run flutter_launcher_icons

      - name: Analyze
        working-directory: app
        run: |
          flutter analyze

      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release

      - name: Copy APK
        run: |
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             release/itarbiatbadani.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-modern-apk
          path: release/itarbiatbadani.apk
          retention-days: 30
