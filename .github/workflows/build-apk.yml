name: Build Android APK

'on':
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Remove default tests
        working-directory: app
        run: rm -rf test

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-release.apk release/itarbiatbadani.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-modern-apk
          path: release/itarbiatbadani.apk
          if-no-files-found: error
