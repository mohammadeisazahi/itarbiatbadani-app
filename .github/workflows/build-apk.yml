          class MorePage extends StatelessWidget {
            const MorePage({super.key});

            Future<void> openUrl(String url) async {
              await launchUrl(
                Uri.parse(url),
                mode: LaunchMode.externalApplication,
              );
            }

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: Column(
                  children: [
                    const AppHeader(
                      title: 'بیشتر',
                    ),
                    Expanded(
                      child: ListView(
                        padding: const EdgeInsets.all(16),
                        children: [
                          MoreButton(
                            icon: Icons.language,
                            title: 'وب‌سایت',
                            onTap: () {
                              Navigator.push(
                                context,
                                MaterialPageRoute(
                                  builder: (_) =>
                                      const WebsitePage(
                                    url: siteUrl,
                                  ),
                                ),
                              );
                            },
                          ),
                          MoreButton(
                            icon: Icons.send,
                            title: 'کانال تلگرام',
                            onTap: () => openUrl(
                              'https://t.me/itarbiatbadani',
                            ),
                          ),
                          MoreButton(
                            icon: Icons.camera_alt,
                            title: 'اینستاگرام',
                            onTap: () => openUrl(
                              'https://instagram.com/itarbiatbadani',
                            ),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class MoreButton extends StatelessWidget {
            final IconData icon;
            final String title;
            final VoidCallback onTap;

            const MoreButton({
              super.key,
              required this.icon,
              required this.title,
              required this.onTap,
            });

            @override
            Widget build(BuildContext context) {
              return Card(
                margin: const EdgeInsets.only(bottom: 10),
                child: ListTile(
                  onTap: onTap,
                  leading: Icon(
                    icon,
                    color: primaryColor,
                  ),
                  title: Text(
                    title,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  trailing: const Icon(
                    Icons.arrow_forward_ios,
                    size: 16,
                  ),
                ),
              );
            }
          }

          class WebsitePage extends StatefulWidget {
            final String url;
            final bool showHeader;

            const WebsitePage({
              super.key,
              required this.url,
              this.showHeader = true,
            });

            @override
            State<WebsitePage> createState() =>
                _WebsitePageState();
          }

          class _WebsitePageState
              extends State<WebsitePage> {
            late final WebViewController controller;
            int progress = 0;

            @override
            void initState() {
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(
                  JavaScriptMode.unrestricted,
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onProgress: (value) {
                      if (mounted) {
                        setState(() {
                          progress = value;
                        });
                      }
                    },
                  ),
                )
                ..loadRequest(
                  Uri.parse(widget.url),
                );
            }

            @override
            Widget build(BuildContext context) {
              return Column(
                children: [
                  if (progress < 100)
                    LinearProgressIndicator(
                      value: progress / 100,
                      minHeight: 2,
                    ),
                  Expanded(
                    child: WebViewWidget(
                      controller: controller,
                    ),
                  ),
                ],
              );
            }
          }
          EOF

      - name: Add Internet Permission
        working-directory: app
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Set App Name
        working-directory: app
        run: |
          sed -i 's/android:label="\${applicationName}"/android:label="تربیت بدنی و علوم ورزشی"/' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-professional-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
