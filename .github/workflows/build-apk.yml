String cleanHtml(String text) {
  return text
      .replaceAll(RegExp(r'<[^>]*>'), '')
      .replaceAll('&nbsp;', ' ')
      .replaceAll('&amp;', '&')
      .replaceAll('&quot;', '"')
      .replaceAll('&#8217;', '’')
      .replaceAll('&#8220;', '“')
      .replaceAll('&#8221;', '”')
      .replaceAll('&#8211;', '–')
      .replaceAll('&#8212;', '—')
      .trim();
}

String formatDate(String date) {
  if (date.length < 10) {
    return date;
  }

  final parts = date.substring(0, 10).split('-');

  if (parts.length != 3) {
    return date;
  }

  return '${parts[2]}/${parts[1]}/${parts[0]}';
}
