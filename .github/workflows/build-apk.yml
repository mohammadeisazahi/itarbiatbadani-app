                            const Text(
                              'مقالات، منابع، طرح درس، فایل‌های آموزشی و مطالب تخصصی ورزش',
                              style: TextStyle(
                                fontSize: 14,
                                color: Colors.black54,
                              ),
                            ),
                            const SizedBox(height: 20),
                            Row(
                              children: [
                                Expanded(
                                  child: QuickCard(
                                    icon: Icons.article,
                                    title: 'مطالب',
                                    onTap: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) => const WebsitePage(
                                            url: siteUrl,
                                          ),
                                        ),
                                      );
                                    },
                                  ),
                                ),
                                const SizedBox(width: 10),
                                Expanded(
                                  child: QuickCard(
                                    icon: Icons.shopping_bag,
                                    title: 'فروشگاه',
                                    onTap: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) => const WebsitePage(
                                            url: '$siteUrl/shop/',
                                          ),
                                        ),
                                      );
                                    },
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 12),
                            Row(
                              children: [
                                Expanded(
                                  child: QuickCard(
                                    icon: Icons.category,
                                    title: 'دسته‌بندی‌ها',
                                    onTap: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) =>
                                              const CategoriesPage(),
                                        ),
                                      );
                                    },
                                  ),
                                ),
                                const SizedBox(width: 10),
                                Expanded(
                                  child: QuickCard(
                                    icon: Icons.language,
                                    title: 'وب‌سایت',
                                    onTap: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) => const WebsitePage(
                                            url: siteUrl,
                                          ),
                                        ),
                                      );
                                    },
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 25),
                            const Text(
                              'فروشگاه',
                              style: TextStyle(
                                fontSize: 19,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            const SizedBox(height: 12),
                            ShopBanner(
                              title: 'طرح درس ورزشی',
                              subtitle:
                                  'طرح درس‌های آماده و تخصصی تربیت بدنی',
                              icon: Icons.menu_book,
                              url: '$siteUrl/category/طرح-درس-ورزشی/',
                            ),
                            ShopBanner(
                              title: 'پی دی اف ورزشی',
                              subtitle:
                                  'منابع و فایل‌های PDF ورزشی',
                              icon: Icons.picture_as_pdf,
                              url: '$siteUrl/category/پی-دی-اف-ورزشی/',
                            ),
                            ShopBanner(
                              title: 'پاورپوینت ورزشی',
                              subtitle:
                                  'فایل‌های ارائه و آموزشی',
                              icon: Icons.slideshow,
                              url: '$siteUrl/category/پاورپوینت-ورزشی/',
                            ),
                            ShopBanner(
                              title: 'فایل‌های رایگان',
                              subtitle:
                                  'دسترسی به فایل‌های رایگان سایت',
                              icon: Icons.download,
                              url: '$siteUrl/category/فایل-های-رایگان/',
