/* -------------------------------------------------------------------------- */
/*                               HTML CLEANER                                 */
/* -------------------------------------------------------------------------- */

String cleanHtml(String text) {
  return text
      .replaceAll(RegExp(r'<[^>]*>'), '')
      .replaceAll('&nbsp;', ' ')
      .replaceAll('&amp;', '&')
      .replaceAll('&quot;', '"')
      .replaceAll('&#039;', "'")
      .replaceAll('&#8217;', '’')
      .replaceAll('&#8220;', '“')
      .replaceAll('&#8221;', '”')
      .replaceAll(RegExp(r'\s+'), ' ')
      .trim();
}

/* -------------------------------------------------------------------------- */
/*                               DATE FORMAT                                  */
/* -------------------------------------------------------------------------- */

String formatDate(String date) {
  if (date.isEmpty) {
    return '';
  }

  try {
    final parsed = DateTime.parse(date);
    return '${parsed.year}/${parsed.month.toString().padLeft(2, '0')}/${parsed.day.toString().padLeft(2, '0')}';
  } catch (_) {
    return date;
  }
}

