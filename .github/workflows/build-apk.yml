      # حذف تست پیش‌فرض Flutter
      # =========================================================

      - name: Remove default tests
        run: |
          rm -rf app/test


      # =========================================================
      # دریافت وابستگی‌ها
      # =========================================================

      - name: Get dependencies
        working-directory: app
        run: |
          flutter pub get


      # =========================================================
      # ساخت آیکون
      # =========================================================

      - name: Generate launcher icons
        working-directory: app
        run: |
          dart run flutter_launcher_icons


      # =========================================================
      # بررسی کد
      # =========================================================

      - name: Analyze
        working-directory: app
        run: |
          flutter analyze


      # =========================================================
      # ساخت APK
      # =========================================================

      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release


      # =========================================================
      # کپی APK
      # =========================================================

      - name: Copy APK
        run: |
          mkdir -p release

          cp \
            app/build/app/outputs/flutter-apk/app-release.apk \
            release/itarbiatbadani.apk


      # =========================================================
      # آپلود APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: itarbiatbadani-modern-apk

          path:
            release/itarbiatbadani.apk

          retention-days: 30
