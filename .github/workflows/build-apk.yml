name: Build Professional Sports App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Create Flutter Project
        run: |
          rm -rf app
          flutter create --project-name itarbiatbadani_app app

      - name: Remove Default Test
        working-directory: app
        run: |
          rm -f test/widget_test.dart

      - name: Add Dependencies
        working-directory: app
        run: |
          flutter pub add webview_flutter
          flutter pub add http
          flutter pub add url_launcher
          flutter pub add flutter_launcher_icons

      - name: Create Assets
        working-directory: app
        run: |
          mkdir -p assets
          curl -L "https://itarbiatbadani.ir/wp-content/uploads/2025/07/1000073463.png" -o assets/logo.png

      - name: Configure App Icon
        working-directory: app
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/logo.png"
            adaptive_icon_background: "#0A3D62"
            adaptive_icon_foreground: "assets/logo.png"
          EOF

      - name: Create Main App
        working-directory: app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'dart:convert';

          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:url_launcher/url_launcher.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          const String siteUrl = 'https://itarbiatbadani.ir';
          const String telegramUrl = 'https://t.me/itarbiatbadani';
          const String instagramUrl = 'https://instagram.com/itarbiatbadani';

          const Color navy = Color(0xFF0A3D62);
          const Color blue = Color(0xFF3C6382);
          const Color gold = Color(0xFFFBC531);
          const Color background = Color(0xFFF5F7FA);

          void main() {
            runApp(const SportsApp());
          }

          class SportsApp extends StatelessWidget {
            const SportsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'تربیت بدنی و علوم ورزشی',
                theme: ThemeData(
                  useMaterial3: true,
                  fontFamily: 'sans',
                  scaffoldBackgroundColor: background,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: navy,
                    primary: navy,
                    secondary: gold,
                  ),
                ),
                home: const MainScreen(),
              );
            }
          }

          class MainScreen extends StatefulWidget {
            const MainScreen({super.key});

            @override
            State<MainScreen> createState() => _MainScreenState();
          }

          class _MainScreenState extends State<MainScreen> {
            int currentIndex = 0;

            final pages = const [
              HomePage(),
              CategoriesPage(),
              StorePage(),
              TelegramPage(),
              MorePage(),
            ];

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  body: IndexedStack(
                    index: currentIndex,
                    children: pages,
                  ),
                  bottomNavigationBar: NavigationBar(
                    selectedIndex: currentIndex,
                    backgroundColor: Colors.white,
                    elevation: 10,
                    indicatorColor: gold.withValues(alpha: .20),
                    onDestinationSelected: (index) {
                      setState(() {
                        currentIndex = index;
                      });
                    },
                    destinations: const [
                      NavigationDestination(
                        icon: Icon(Icons.home_outlined),
                        selectedIcon: Icon(Icons.home),
                        label: 'خانه',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.category_outlined),
                        selectedIcon: Icon(Icons.category),
                        label: 'دسته‌ها',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.shopping_bag_outlined),
                        selectedIcon: Icon(Icons.shopping_bag),
                        label: 'فروشگاه',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.telegram),
                        selectedIcon: Icon(Icons.telegram),
                        label: 'تلگرام',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.more_horiz),
                        selectedIcon: Icon(Icons.more_horiz),
                        label: 'بیشتر',
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class AppHeader extends StatelessWidget {
            final String title;
            final String subtitle;

            const AppHeader({
              super.key,
              required this.title,
              required this.subtitle,
            });

            @override
            Widget build(BuildContext context) {
              return Container(
                width: double.infinity,
                padding: const EdgeInsets.fromLTRB(20, 50, 20, 28),
                decoration: const BoxDecoration(
                  gradient: LinearGradient(
                    begin: Alignment.topRight,
                    end: Alignment.bottomLeft,
                    colors: [navy, blue],
                  ),
                  borderRadius: BorderRadius.only(
                    bottomLeft: Radius.circular(30),
                    bottomRight: Radius.circular(30),
                  ),
                ),
                child: Row(
                  children: [
                    Container(
                      width: 68,
                      height: 68,
                      padding: const EdgeInsets.all(7),
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(20),
                        boxShadow: [
                          BoxShadow(
                            color: Colors.black.withValues(alpha: .15),
                            blurRadius: 15,
                            offset: const Offset(0, 7),
                          ),
                        ],
                      ),
                      child: Image.network(
                        'https://itarbiatbadani.ir/wp-content/uploads/2025/07/1000073463.png',
                        fit: BoxFit.contain,
                        errorBuilder: (_, __, ___) {
                          return const Icon(
                            Icons.sports,
                            color: navy,
                            size: 40,
                          );
                        },
                      ),
                    ),
                    const SizedBox(width: 15),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            title,
                            style: const TextStyle(
                              color: Colors.white,
                              fontSize: 21,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 6),
                          Text(
                            subtitle,
                            style: TextStyle(
                              color: Colors.white.withValues(alpha: .82),
                              fontSize: 12.5,
                              height: 1.6,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class HomePage extends StatelessWidget {
            const HomePage({super.key});

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: SingleChildScrollView(
                  child: Column(
                    children: [
                      const AppHeader(
                        title: 'تربیت بدنی و علوم ورزشی',
                        subtitle:
                            'مرجع تخصصی مطالب، مقالات و منابع رشته تربیت بدنی و علوم ورزشی',
                      ),

                      const SizedBox(height: 22),

                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 18),
                        child: Column(
                          children: [
                            _welcomeCard(context),
                            const SizedBox(height: 18),

                            Row(
                              children: [
                                Expanded(
                                  child: _quickCard(
                                    context,
                                    icon: Icons.category,
                                    title: 'دسته‌بندی‌ها',
                                    subtitle: 'مطالب تخصصی',
                                    color: navy,
                                    onTap: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) =>
                                              const CategoriesPage(),
                                        ),
                                      );
                                    },
                                  ),
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: _quickCard(
                                    context,
                                    icon: Icons.shopping_bag,
                                    title: 'فروشگاه',
                                    subtitle: 'محصولات ورزشی',
                                    color: blue,
                                    onTap: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) => const StorePage(),
                                        ),
                                      );
                                    },
                                  ),
                                ),
                              ],
                            ),

                            const SizedBox(height: 12),

                            Row(
                              children: [
                                Expanded(
                                  child: _quickCard(
                                    context,
                                    icon: Icons.telegram,
                                    title: 'کانال تلگرام',
                                    subtitle: '@itarbiatbadani',
                                    color: const Color(0xFF229ED9),
                                    onTap: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) =>
                                              const TelegramPage(),
                                        ),
                                      );
                                    },
                                  ),
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: _quickCard(
                                    context,
                                    icon: Icons.language,
                                    title: 'وب‌سایت',
                                    subtitle: 'itarbiatbadani.ir',
                                    color: const Color(0xFF1B5E20),
                                    onTap: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) => const WebPage(
                                            url: siteUrl,
                                            title: 'وب‌سایت',
                                          ),
                                        ),
                                      );
                                    },
                                  ),
                                ),
                              ],
                            ),

                            const SizedBox(height: 24),

                            _sectionTitle(
                              'دسترسی سریع',
                              'مهم‌ترین بخش‌های اپلیکیشن',
                            ),

                            const SizedBox(height: 12),

                            _largeAction(
                              context,
                              icon: Icons.menu_book_rounded,
                              title: 'مطالب و مقالات',
                              subtitle:
                                  'مطالب تخصصی تربیت بدنی و علوم ورزشی',
                              onTap: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => const WebPage(
                                      url: '$siteUrl/blog/',
                                      title: 'مطالب و مقالات',
                                    ),
                                  ),
                                );
                              },
                            ),

                            const SizedBox(height: 12),

                            _largeAction(
                              context,
                              icon: Icons.storefront_rounded,
                              title: 'فروشگاه محصولات',
                              subtitle:
                                  'طرح درس، پی‌دی‌اف و پاورپوینت ورزشی',
                              onTap: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => const StorePage(),
                                  ),
                                );
                              },
                            ),
                          ],
                        ),
                      ),

                      const SizedBox(height: 30),
                    ],
                  ),
                ),
              );
            }

            Widget _welcomeCard(BuildContext context) {
              return Container(
                width: double.infinity,
                padding: const EdgeInsets.all(22),
                decoration: BoxDecoration(
                  gradient: const LinearGradient(
                    colors: [navy, blue],
                    begin: Alignment.topRight,
                    end: Alignment.bottomLeft,
                  ),
                  borderRadius: BorderRadius.circular(24),
                  boxShadow: [
                    BoxShadow(
                      color: navy.withValues(alpha: .18),
                      blurRadius: 18,
                      offset: const Offset(0, 8),
                    ),
                  ],
                ),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Container(
                      padding: const EdgeInsets.symmetric(
                        horizontal: 12,
                        vertical: 6,
                      ),
                      decoration: BoxDecoration(
                        color: gold,
                        borderRadius: BorderRadius.circular(20),
                      ),
                      child: const Text(
                        'مرجع تخصصی ورزش',
                        style: TextStyle(
                          color: navy,
                          fontWeight: FontWeight.bold,
                          fontSize: 11,
                        ),
                      ),
                    ),
                    const SizedBox(height: 15),
                    const Text(
                      'دانش ورزش،\nهمیشه در دسترس شما',
                      style: TextStyle(
                        color: Colors.white,
                        fontSize: 25,
                        height: 1.35,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 10),
                    Text(
                      'مقالات، منابع آموزشی، مطالب تخصصی و محصولات ورزشی را در یک اپلیکیشن دنبال کنید.',
                      style: TextStyle(
                        color: Colors.white.withValues(alpha: .82),
                        height: 1.7,
                        fontSize: 13,
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _quickCard(
              BuildContext context, {
              required IconData icon,
              required String title,
              required String subtitle,
              required Color color,
              required VoidCallback onTap,
            }) {
              return InkWell(
                borderRadius: BorderRadius.circular(20),
                onTap: onTap,
                child: Container(
                  padding: const EdgeInsets.all(16),
                  decoration: BoxDecoration(
                    color: Colors.white,
                    borderRadius: BorderRadius.circular(20),
                    boxShadow: [
                      BoxShadow(
                        color: Colors.black.withValues(alpha: .06),
                        blurRadius: 12,
                        offset: const Offset(0, 5),
                      ),
                    ],
                  ),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Container(
                        width: 48,
                        height: 48,
                        decoration: BoxDecoration(
                          color: color.withValues(alpha: .10),
                          borderRadius: BorderRadius.circular(15),
                        ),
                        child: Icon(icon, color: color),
                      ),
                      const SizedBox(height: 12),
                      Text(
                        title,
                        style: const TextStyle(
                          fontWeight: FontWeight.bold,
                          fontSize: 15,
                        ),
                      ),
                      const SizedBox(height: 4),
                      Text(
                        subtitle,
                        style: TextStyle(
                          color: Colors.grey.shade600,
                          fontSize: 11,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _sectionTitle(String title, String subtitle) {
              return Row(
                children: [
                  Container(
                    width: 5,
                    height: 42,
                    decoration: BoxDecoration(
                      color: gold,
                      borderRadius: BorderRadius.circular(5),
                    ),
                  ),
                  const SizedBox(width: 10),
                  Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        title,
                        style: const TextStyle(
                          fontWeight: FontWeight.bold,
                          fontSize: 19,
                        ),
                      ),
                      const SizedBox(height: 3),
                      Text(
                        subtitle,
                        style: TextStyle(
                          color: Colors.grey.shade600,
                          fontSize: 11,
                        ),
                      ),
                    ],
                  ),
                ],
              );
            }

            Widget _largeAction(
              BuildContext context, {
              required IconData icon,
              required String title,
              required String subtitle,
              required VoidCallback onTap,
            }) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(20),
                child: Container(
                  padding: const EdgeInsets.all(17),
                  decoration: BoxDecoration(
                    color: Colors.white,
                    borderRadius: BorderRadius.circular(20),
                    boxShadow: [
                      BoxShadow(
                        color: Colors.black.withValues(alpha: .05),
                        blurRadius: 12,
                        offset: const Offset(0, 5),
                      ),
                    ],
                  ),
                  child: Row(
                    children: [
                      Container(
                        width: 54,
                        height: 54,
                        decoration: BoxDecoration(
                          gradient: const LinearGradient(
                            colors: [navy, blue],
                          ),
                          borderRadius: BorderRadius.circular(17),
                        ),
                        child: Icon(
                          icon,
                          color: Colors.white,
                          size: 27,
                        ),
                      ),
                      const SizedBox(width: 15),
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(
                              title,
                              style: const TextStyle(
                                fontSize: 15,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            const SizedBox(height: 5),
                            Text(
                              subtitle,
                              style: TextStyle(
                                color: Colors.grey.shade600,
                                fontSize: 11,
                              ),
                            ),
                          ],
                        ),
                      ),
                      const Icon(
                        Icons.arrow_back_ios_new,
                        size: 15,
                        color: navy,
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class CategoriesPage extends StatefulWidget {
            const CategoriesPage({super.key});

            @override
            State<CategoriesPage> createState() => _CategoriesPageState();
          }

          class _CategoriesPageState extends State<CategoriesPage> {
            bool loading = true;
            String? error;
            List<CategoryItem> categories = [];

            @override
            void initState() {
              super.initState();
              loadCategories();
            }

            Future<void> loadCategories() async {
              try {
                final response = await http.get(
                  Uri.parse(
                    '$siteUrl/wp-json/wp/v2/categories?per_page=100&parent=0&hide_empty=true',
                  ),
                );

                if (response.statusCode != 200) {
                  throw Exception('خطا در دریافت دسته‌بندی‌ها');
                }

                final data = jsonDecode(response.body) as List;

                final result = data
                    .map(
                      (item) => CategoryItem(
                        id: item['id'],
                        name: item['name'],
                        slug: item['slug'],
                        count: item['count'] ?? 0,
                      ),
                    )
                    .where(
                      (item) =>
                          item.name.trim() != 'محصولات' &&
                          item.name.trim() != 'فایل های رایگان',
                    )
                    .toList();

                if (!mounted) return;

                setState(() {
                  categories = result;
                  loading = false;
                });
              } catch (e) {
                if (!mounted) return;

                setState(() {
                  error = 'دریافت دسته‌بندی‌ها با مشکل مواجه شد.';
                  loading = false;
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'دسته‌بندی‌ها',
                    style: TextStyle(fontWeight: FontWeight.bold),
                  ),
                  backgroundColor: Colors.white,
                  foregroundColor: navy,
                  elevation: 0,
                ),
                body: loading
                    ? const Center(
                        child: CircularProgressIndicator(
                          color: navy,
                        ),
                      )
                    : error != null
                        ? _errorWidget()
                        : RefreshIndicator(
                            color: navy,
                            onRefresh: loadCategories,
                            child: categories.isEmpty
                                ? ListView(
                                    children: const [
                                      SizedBox(height: 100),
                                      Center(
                                        child: Text(
                                          'دسته‌بندی‌ای پیدا نشد.',
                                        ),
                                      ),
                                    ],
                                  )
                                : ListView.builder(
                                    padding: const EdgeInsets.all(18),
                                    itemCount: categories.length,
                                    itemBuilder: (_, index) {
                                      final category = categories[index];

                                      return CategoryCard(
                                        category: category,
                                      );
                                    },
                                  ),
                          ),
              );
            }

            Widget _errorWidget() {
              return Center(
                child: Padding(
                  padding: const EdgeInsets.all(30),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Icon(
                        Icons.cloud_off,
                        size: 55,
                        color: navy,
                      ),
                      const SizedBox(height: 15),
                      Text(
                        error!,
                        textAlign: TextAlign.center,
                        style: const TextStyle(fontSize: 14),
                      ),
                      const SizedBox(height: 15),
                      ElevatedButton(
                        onPressed: loadCategories,
                        style: ElevatedButton.styleFrom(
                          backgroundColor: navy,
                          foregroundColor: Colors.white,
                        ),
                        child: const Text('تلاش مجدد'),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class CategoryCard extends StatelessWidget {
            final CategoryItem category;

            const CategoryCard({
              super.key,
              required this.category,
            });

            @override
            Widget build(BuildContext context) {
              return Container(
                margin: const EdgeInsets.only(bottom: 14),
                decoration: BoxDecoration(
                  color: Colors.white,
                  borderRadius: BorderRadius.circular(22),
                  boxShadow: [
                    BoxShadow(
                      color: Colors.black.withValues(alpha: .055),
                      blurRadius: 13,
                      offset: const Offset(0, 5),
                    ),
                  ],
                ),
                child: ListTile(
                  contentPadding: const EdgeInsets.symmetric(
                    horizontal: 17,
                    vertical: 9,
                  ),
                  leading: Container(
                    width: 54,
                    height: 54,
                    decoration: BoxDecoration(
                      gradient: const LinearGradient(
                        colors: [navy, blue],
                      ),
                      borderRadius: BorderRadius.circular(17),
                    ),
                    child: const Icon(
                      Icons.sports_soccer,
                      color: Colors.white,
                    ),
                  ),
                  title: Text(
                    category.name,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                      fontSize: 16,
                    ),
                  ),
                  subtitle: Text(
                    '${category.count} مطلب',
                    style: TextStyle(
                      color: Colors.grey.shade600,
                      fontSize: 11,
                    ),
                  ),
                  trailing: const Icon(
                    Icons.arrow_back_ios_new,
                    size: 16,
                    color: navy,
                  ),
                  onTap: () {
                    Navigator.push(
                      context,
                      MaterialPageRoute(
                        builder: (_) => SubCategoriesPage(
                          category: category,
                        ),
                      ),
                    );
                  },
                ),
              );
            }
          }

          class SubCategoriesPage extends StatefulWidget {
            final CategoryItem category;

            const SubCategoriesPage({
              super.key,
              required this.category,
            });

            @override
            State<SubCategoriesPage> createState() =>
                _SubCategoriesPageState();
          }

          class _SubCategoriesPageState
              extends State<SubCategoriesPage> {
            bool loading = true;
            List<CategoryItem> children = [];

            @override
            void initState() {
              super.initState();
              loadSubCategories();
            }

            Future<void> loadSubCategories() async {
              try {
                final response = await http.get(
                  Uri.parse(
                    '$siteUrl/wp-json/wp/v2/categories?per_page=100&parent=${widget.category.id}&hide_empty=true',
                  ),
                );

                if (response.statusCode == 200) {
                  final data = jsonDecode(response.body) as List;

                  children = data
                      .map(
                        (item) => CategoryItem(
                          id: item['id'],
                          name: item['name'],
                          slug: item['slug'],
                          count: item['count'] ?? 0,
                        ),
                      )
                      .toList();
                }
              } catch (_) {}

              if (!mounted) return;

              setState(() {
                loading = false;
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(
                    widget.category.name,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  backgroundColor: Colors.white,
                  foregroundColor: navy,
                  elevation: 0,
                ),
                body: loading
                    ? const Center(
                        child: CircularProgressIndicator(
                          color: navy,
                        ),
                      )
                    : children.isEmpty
                        ? _noChildren()
                        : ListView.builder(
                            padding: const EdgeInsets.all(18),
                            itemCount: children.length,
                            itemBuilder: (_, index) {
                              final child = children[index];

                              return Container(
                                margin:
                                    const EdgeInsets.only(bottom: 13),
                                decoration: BoxDecoration(
                                  color: Colors.white,
                                  borderRadius:
                                      BorderRadius.circular(20),
                                  boxShadow: [
                                    BoxShadow(
                                      color:
                                          Colors.black.withValues(
                                        alpha: .05,
                                      ),
                                      blurRadius: 12,
                                      offset: const Offset(0, 5),
                                    ),
                                  ],
                                ),
                                child: ListTile(
                                  contentPadding:
                                      const EdgeInsets.symmetric(
                                    horizontal: 18,
                                    vertical: 8,
                                  ),
                                  leading: Container(
                                    width: 48,
                                    height: 48,
                                    decoration: BoxDecoration(
                                      color:
                                          gold.withValues(alpha: .18),
                                      borderRadius:
                                          BorderRadius.circular(15),
                                    ),
                                    child: const Icon(
                                      Icons.article_outlined,
                                      color: navy,
                                    ),
                                  ),
                                  title: Text(
