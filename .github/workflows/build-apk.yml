name: Build Modern Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --project-name itarbiatbadani_app app

      - name: Add packages
        working-directory: app
        run: |
          flutter pub add http
          flutter pub add webview_flutter
          flutter pub add url_launcher
          flutter pub add flutter_launcher_icons

      - name: Download logo
        run: |
          curl -L "https://itarbiatbadani.ir/wp-content/uploads/2025/07/1000073463.png" -o app/logo.png

      - name: Configure app icon
        working-directory: app
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: logo.png
            min_sdk_android: 21
          EOF

      - name: Configure application
        working-directory: app
        run: |
          sed -i 's/android:label="itarbiatbadani_app"/android:label="تربیت بدنی و علوم ورزشی"/' android/app/src/main/AndroidManifest.xml

      - name: Create modern app
        working-directory: app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:url_launcher/url_launcher.dart';

          const String siteUrl = 'https://itarbiatbadani.ir';
          const String telegramUrl = 'https://t.me/s/itarbiatbadani';
          const String instagramUrl = 'https://instagram.com/itarbiatbadani';

          const Color navy = Color(0xFF0A3D62);
          const Color blue = Color(0xFF3C6382);
          const Color gold = Color(0xFFFBC531);
          const Color background = Color(0xFFF5F7FA);

          void main() {
            runApp(const SportsApp());
          }

          class SportsApp extends StatelessWidget {
            const SportsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'تربیت بدنی و علوم ورزشی',
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: background,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: navy,
                    brightness: Brightness.light,
                  ),
                  fontFamily: 'sans',
                  appBarTheme: const AppBarTheme(
                    backgroundColor: navy,
                    foregroundColor: Colors.white,
                    centerTitle: true,
                    elevation: 0,
                  ),
                ),
                home: const MainScreen(),
              );
            }
          }

          class MainScreen extends StatefulWidget {
            const MainScreen({super.key});

            @override
            State<MainScreen> createState() => _MainScreenState();
          }

          class _MainScreenState extends State<MainScreen> {
            int selectedIndex = 0;

            final List<Widget> pages = const [
              HomePage(),
              CategoriesPage(),
              StorePage(),
              TelegramPage(),
              MorePage(),
            ];

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  body: IndexedStack(
                    index: selectedIndex,
                    children: pages,
                  ),
                  bottomNavigationBar: NavigationBar(
                    height: 72,
                    selectedIndex: selectedIndex,
                    backgroundColor: Colors.white,
                    indicatorColor: gold.withValues(alpha: 0.25),
                    onDestinationSelected: (index) {
                      setState(() {
                        selectedIndex = index;
                      });
                    },
                    destinations: const [
                      NavigationDestination(
                        icon: Icon(Icons.home_outlined),
                        selectedIcon: Icon(Icons.home),
                        label: 'خانه',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.category_outlined),
                        selectedIcon: Icon(Icons.category),
                        label: 'دسته‌ها',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.shopping_bag_outlined),
                        selectedIcon: Icon(Icons.shopping_bag),
                        label: 'فروشگاه',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.telegram),
                        selectedIcon: Icon(Icons.telegram),
                        label: 'تلگرام',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.more_horiz),
                        selectedIcon: Icon(Icons.more_horiz),
                        label: 'بیشتر',
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class HomePage extends StatefulWidget {
            const HomePage({super.key});

            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            List<dynamic> posts = [];
            bool loading = true;

            @override
            void initState() {
              super.initState();
              loadPosts();
            }

            Future<void> loadPosts() async {
              try {
                final response = await http.get(
                  Uri.parse(
                    '$siteUrl/wp-json/wp/v2/posts?per_page=8&_embed',
                  ),
                );

                if (response.statusCode == 200) {
                  setState(() {
                    posts = jsonDecode(response.body);
                    loading = false;
                  });
                } else {
                  setState(() => loading = false);
                }
              } catch (_) {
                setState(() => loading = false);
              }
            }

            String cleanText(String value) {
              return value
                  .replaceAll(RegExp(r'<[^>]*>'), '')
                  .replaceAll('&nbsp;', ' ')
                  .replaceAll('&#8211;', '–')
                  .replaceAll('&#8217;', '’')
                  .trim();
            }

            @override
            Widget build(BuildContext context) {
              return RefreshIndicator(
                onRefresh: loadPosts,
                child: CustomScrollView(
                  slivers: [
                    SliverToBoxAdapter(
                      child: Container(
                        padding: const EdgeInsets.fromLTRB(20, 42, 20, 28),
                        decoration: const BoxDecoration(
                          gradient: LinearGradient(
                            colors: [navy, blue],
                            begin: Alignment.topRight,
                            end: Alignment.bottomLeft,
                          ),
                          borderRadius: BorderRadius.only(
                            bottomLeft: Radius.circular(28),
                            bottomRight: Radius.circular(28),
                          ),
                        ),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              children: [
                                Container(
                                  width: 52,
                                  height: 52,
                                  padding: const EdgeInsets.all(6),
                                  decoration: BoxDecoration(
                                    color: Colors.white,
                                    borderRadius: BorderRadius.circular(16),
                                  ),
                                  child: Image.network(
                                    'https://itarbiatbadani.ir/wp-content/uploads/2025/07/1000073463.png',
                                    fit: BoxFit.contain,
                                    errorBuilder: (_, __, ___) =>
                                        const Icon(
                                      Icons.sports_soccer,
                                      color: navy,
                                      size: 32,
                                    ),
                                  ),
                                ),
                                const SizedBox(width: 12),
                                const Expanded(
                                  child: Text(
                                    'تربیت بدنی و علوم ورزشی',
                                    style: TextStyle(
                                      color: Colors.white,
                                      fontSize: 20,
                                      fontWeight: FontWeight.bold,
                                    ),
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 24),
                            const Text(
                              'مرجع تخصصی تربیت بدنی و علوم ورزشی',
                              style: TextStyle(
                                color: Colors.white,
                                fontSize: 23,
                                fontWeight: FontWeight.w800,
                              ),
                            ),
                            const SizedBox(height: 8),
                            Text(
                              'مقالات، آموزش‌ها، منابع و محصولات تخصصی',
                              style: TextStyle(
                                color: Colors.white.withValues(alpha: 0.85),
                                fontSize: 14,
                              ),
                            ),
                            const SizedBox(height: 20),
                            GestureDetector(
                              onTap: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => const SearchPage(),
                                  ),
                                );
                              },
                              child: Container(
                                padding: const EdgeInsets.symmetric(
                                  horizontal: 16,
                                  vertical: 14,
                                ),
                                decoration: BoxDecoration(
                                  color: Colors.white,
                                  borderRadius: BorderRadius.circular(16),
                                ),
                                child: const Row(
                                  children: [
                                    Icon(
                                      Icons.search,
                                      color: blue,
                                    ),
                                    SizedBox(width: 10),
                                    Text(
                                      'جست‌وجو در مطالب سایت...',
                                      style: TextStyle(
                                        color: Colors.grey,
                                        fontSize: 14,
                                      ),
                                    ),
                                  ],
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                    const SliverToBoxAdapter(
                      child: Padding(
                        padding: EdgeInsets.fromLTRB(20, 24, 20, 14),
                        child: Text(
                          'جدیدترین مطالب',
                          style: TextStyle(
                            fontSize: 21,
                            fontWeight: FontWeight.bold,
                            color: navy,
                          ),
                        ),
                      ),
                    ),
                    if (loading)
                      const SliverFillRemaining(
                        child: Center(
                          child: CircularProgressIndicator(),
                        ),
                      )
                    else if (posts.isEmpty)
                      const SliverToBoxAdapter(
                        child: Padding(
                          padding: EdgeInsets.all(30),
                          child: Center(
                            child: Text('مطالبی دریافت نشد.'),
                          ),
                        ),
                      )
                    else
                      SliverPadding(
                        padding: const EdgeInsets.fromLTRB(16, 0, 16, 30),
                        sliver: SliverList(
                          delegate: SliverChildBuilderDelegate(
                            (context, index) {
                              final post = posts[index];
                              final title = cleanText(
                                post['title']?['rendered'] ?? '',
                              );
                              final excerpt = cleanText(
                                post['excerpt']?['rendered'] ?? '',
                              );
                              final link = post['link'] ?? siteUrl;

                              return Card(
                                margin: const EdgeInsets.only(bottom: 12),
                                elevation: 1,
                                shadowColor: Colors.black12,
                                shape: RoundedRectangleBorder(
                                  borderRadius: BorderRadius.circular(18),
                                ),
                                child: InkWell(
                                  borderRadius: BorderRadius.circular(18),
                                  onTap: () {
                                    Navigator.push(
                                      context,
                                      MaterialPageRoute(
                                        builder: (_) => WebPage(
                                          url: link,
                                          title: title,
                                        ),
                                      ),
                                    );
                                  },
                                  child: Padding(
                                    padding: const EdgeInsets.all(16),
                                    child: Row(
                                      children: [
                                        Container(
                                          width: 54,
                                          height: 54,
                                          decoration: BoxDecoration(
                                            gradient: const LinearGradient(
                                              colors: [navy, blue],
                                            ),
                                            borderRadius:
                                                BorderRadius.circular(15),
                                          ),
                                          child: const Icon(
                                            Icons.article_outlined,
                                            color: Colors.white,
                                            size: 28,
                                          ),
                                        ),
                                        const SizedBox(width: 14),
                                        Expanded(
                                          child: Column(
                                            crossAxisAlignment:
                                                CrossAxisAlignment.start,
                                            children: [
                                              Text(
                                                title,
                                                maxLines: 2,
                                                overflow:
                                                    TextOverflow.ellipsis,
                                                style: const TextStyle(
                                                  fontSize: 16,
                                                  fontWeight: FontWeight.bold,
                                                ),
                                              ),
                                              if (excerpt.isNotEmpty) ...[
                                                const SizedBox(height: 6),
                                                Text(
                                                  excerpt,
                                                  maxLines: 2,
                                                  overflow:
                                                      TextOverflow.ellipsis,
                                                  style: const TextStyle(
                                                    fontSize: 12,
                                                    color: Colors.grey,
                                                  ),
                                                ),
                                              ],
                                            ],
                                          ),
                                        ),
                                        const Icon(
                                          Icons.chevron_left,
                                          color: blue,
                                        ),
                                      ],
                                    ),
                                  ),
                                ),
                              );
                            },
                            childCount: posts.length,
                          ),
                        ),
                      ),
                  ],
                ),
              );
            }
          }

          class CategoriesPage extends StatefulWidget {
            const CategoriesPage({super.key});

            @override
            State<CategoriesPage> createState() => _CategoriesPageState();
          }

          class _CategoriesPageState extends State<CategoriesPage> {
            List<dynamic> categories = [];
            bool loading = true;

            @override
            void initState() {
              super.initState();
              loadCategories();
            }

            Future<void> loadCategories() async {
              try {
                final response = await http.get(
                  Uri.parse(
                    '$siteUrl/wp-json/wp/v2/categories?per_page=100&hide_empty=false',
                  ),
                );

                if (response.statusCode == 200) {
                  setState(() {
                    categories = jsonDecode(response.body);
                    loading = false;
                  });
                } else {
                  setState(() => loading = false);
                }
              } catch (_) {
                setState(() => loading = false);
              }
            }

            List<dynamic> childrenOf(int parent) {
              return categories
                  .where((category) => category['parent'] == parent)
                  .toList();
            }

            @override
            Widget build(BuildContext context) {
              final mainCategories = childrenOf(0);

              return Scaffold(
                appBar: AppBar(
                  title: const Text('دسته‌بندی‌ها'),
                ),
                body: loading
                    ? const Center(child: CircularProgressIndicator())
                    : RefreshIndicator(
                        onRefresh: loadCategories,
                        child: ListView(
                          padding: const EdgeInsets.all(16),
                          children: [
                            const Text(
                              'موضوعات تخصصی',
                              style: TextStyle(
                                fontSize: 21,
                                fontWeight: FontWeight.bold,
                                color: navy,
                              ),
                            ),
                            const SizedBox(height: 16),
                            ...mainCategories.map(
                              (category) => _CategoryCard(
                                category: category,
                                children: childrenOf(category['id']),
                              ),
                            ),
                          ],
                        ),
                      ),
              );
            }
          }

          class _CategoryCard extends StatelessWidget {
            final dynamic category;
            final List<dynamic> children;

            const _CategoryCard({
              required this.category,
              required this.children,
            });

            @override
            Widget build(BuildContext context) {
              final name = category['name'] ?? '';
              final link = category['link'] ?? siteUrl;

              return Card(
                margin: const EdgeInsets.only(bottom: 12),
                elevation: 1,
                shape: RoundedRectangleBorder(
                  borderRadius: BorderRadius.circular(18),
                ),
                child: ListTile(
                  contentPadding: const EdgeInsets.symmetric(
                    horizontal: 18,
                    vertical: 8,
                  ),
                  leading: Container(
                    width: 48,
                    height: 48,
                    decoration: BoxDecoration(
                      color: navy.withValues(alpha: 0.1),
                      borderRadius: BorderRadius.circular(14),
                    ),
                    child: const Icon(
                      Icons.folder_outlined,
                      color: navy,
                    ),
                  ),
                  title: Text(
                    name,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  subtitle: children.isNotEmpty
                      ? Text('${children.length} زیرگروه')
                      : null,
                  trailing: const Icon(Icons.chevron_left),
                  onTap: () {
                    if (children.isNotEmpty) {
                      Navigator.push(
                        context,
                        MaterialPageRoute(
                          builder: (_) => SubCategoriesPage(
                            title: name,
                            categories: children,
                          ),
                        ),
                      );
                    } else {
                      Navigator.push(
                        context,
                        MaterialPageRoute(
                          builder: (_) => WebPage(
                            url: link,
                            title: name,
                          ),
                        ),
                      );
                    }
                  },
                ),
              );
            }
          }

          class SubCategoriesPage extends StatelessWidget {
            final String title;
            final List<dynamic> categories;

            const SubCategoriesPage({
              super.key,
              required this.title,
              required this.categories,
            });

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(title)),
                body: ListView.builder(
                  padding: const EdgeInsets.all(16),
                  itemCount: categories.length,
                  itemBuilder: (context, index) {
                    final category = categories[index];

                    return Card(
                      margin: const EdgeInsets.only(bottom: 10),
                      shape: RoundedRectangleBorder(
                        borderRadius: BorderRadius.circular(16),
                      ),
                      child: ListTile(
                        leading: const Icon(
                          Icons.arrow_back_ios_new,
                          size: 18,
                          color: blue,
                        ),
                        title: Text(
                          category['name'] ?? '',
                          style: const TextStyle(
                            fontWeight: FontWeight.w600,
                          ),
                        ),
                        trailing: const Icon(Icons.chevron_left),
                        onTap: () {
                          Navigator.push(
                            context,
                            MaterialPageRoute(
                              builder: (_) => WebPage(
                                url: category['link'] ?? siteUrl,
                                title: category['name'] ?? '',
                              ),
                            ),
                          );
                        },
                      ),
                    );
                  },
                ),
              );
            }
          }

          class StorePage extends StatelessWidget {
            const StorePage({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('فروشگاه'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(18),
                  children: [
                    Container(
                      padding: const EdgeInsets.all(22),
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(
                          colors: [navy, blue],
                        ),
                        borderRadius: BorderRadius.circular(24),
                      ),
                      child: const Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Icon(
                            Icons.shopping_bag,
                            color: gold,
                            size: 38,
                          ),
                          SizedBox(height: 14),
                          Text(
                            'محصولات تخصصی ورزشی',
                            style: TextStyle(
                              color: Colors.white,
                              fontSize: 21,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          SizedBox(height: 8),
                          Text(
                            'طرح درس، فایل‌های ورزشی و پاورپوینت‌های تخصصی',
                            style: TextStyle(
                              color: Colors.white70,
                              fontSize: 13,
                            ),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 18),
                    _StoreItem(
                      icon: Icons.menu_book,
                      title: 'طرح درس ورزشی',
                      url: '$siteUrl/product-category/طرح-درس-ورزشی/',
                    ),
                    _StoreItem(
                      icon: Icons.picture_as_pdf,
                      title: 'پی دی اف ورزشی',
                      url: '$siteUrl/product-category/پی-دی-اف-ورزشی/',
                    ),
                    _StoreItem(
                      icon: Icons.slideshow,
                      title: 'پاورپوینت ورزشی',
                      url: '$siteUrl/product-category/پاورپوینت-ورزشی/',
                    ),
                    _StoreItem(
                      icon: Icons.folder_copy_outlined,
                      title: 'فایل‌های رایگان',
                      url: '$siteUrl/product-category/فایل-های-رایگان/',
                    ),
                    _StoreItem(
                      icon: Icons.storefront,
                      title: 'مشاهده همه محصولات',
                      url: '$siteUrl/shop/',
                    ),
                  ],
                ),
              );
            }
          }

          class _StoreItem extends StatelessWidget {
            final IconData icon;
            final String title;
            final String url;

            const _StoreItem({
              required this.icon,
              required this.title,
              required this.url,
            });

            @override
            Widget build(BuildContext context) {
              return Card(
                margin: const EdgeInsets.only(bottom: 10),
                shape: RoundedRectangleBorder(
                  borderRadius: BorderRadius.circular(17),
                ),
                child: ListTile(
                  contentPadding: const EdgeInsets.symmetric(
                    horizontal: 18,
                    vertical: 5,
                  ),
                  leading: Container(
                    padding: const EdgeInsets.all(11),
                    decoration: BoxDecoration(
                      color: gold.withValues(alpha: 0.18),
                      borderRadius: BorderRadius.circular(13),
                    ),
                    child: Icon(icon, color: navy),
                  ),
                  title: Text(
                    title,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  trailing: const Icon(Icons.chevron_left),
                  onTap: () {
                    Navigator.push(
                      context,
                      MaterialPageRoute(
                        builder: (_) => WebPage(
                          url: url,
                          title: title,
                        ),
                      ),
                    );
                  },
                ),
              );
            }
          }

          class TelegramPage extends StatelessWidget {
            const TelegramPage({super.key});

            @override
            Widget build(BuildContext context) {
              return const WebPage(
                url: telegramUrl,
                title: 'کانال تلگرام',
              );
            }
          }

          class MorePage extends StatelessWidget {
            const MorePage({super.key});

            Future<void> open(String url) async {
              final uri = Uri.parse(url);
              await launchUrl(
                uri,
                mode: LaunchMode.externalApplication,
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('بیشتر'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(18),
                  children: [
                    Container(
                      padding: const EdgeInsets.all(22),
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(
                          colors: [navy, blue],
                        ),
                        borderRadius: BorderRadius.circular(24),
                      ),
                      child: const Column(
                        children: [
                          Icon(
                            Icons.sports,
                            color: gold,
                            size: 48,
                          ),
                          SizedBox(height: 12),
                          Text(
                            'تربیت بدنی و علوم ورزشی',
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              color: Colors.white,
                              fontSize: 21,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          SizedBox(height: 8),
                          Text(
                            'مرجع تخصصی تربیت بدنی و علوم ورزشی',
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              color: Colors.white70,
                            ),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 18),
                    _MoreItem(
                      icon: Icons.language,
                      title: 'وب‌سایت',
                      onTap: () => open(siteUrl),
                    ),
                    _MoreItem(
                      icon: Icons.telegram,
                      title: 'کانال تلگرام',
                      onTap: () => open('https://t.me/itarbiatbadani'),
                    ),
                    _MoreItem(
                      icon: Icons.camera_alt_outlined,
                      title: 'اینستاگرام',
                      onTap: () => open(instagramUrl),
                    ),
                    _MoreItem(
                      icon: Icons.support_agent,
                      title: 'ارتباط و خرید',
                      onTap: () => open('https://t.me/ivarzeshiadmin'),
                    ),
                  ],
                ),
              );
            }
          }

          class _MoreItem extends StatelessWidget {
            final IconData icon;
            final String title;
            final VoidCallback onTap;

            const _MoreItem({
              required this.icon,
              required this.title,
              required this.onTap,
            });

            @override
            Widget build(BuildContext context) {
              return Card(
                margin: const EdgeInsets.only(bottom: 10),
                shape: RoundedRectangleBorder(
                  borderRadius: BorderRadius.circular(17),
                ),
                child: ListTile(
                  contentPadding: const EdgeInsets.symmetric(
                    horizontal: 18,
                    vertical: 6,
                  ),
                  leading: Icon(
                    icon,
                    color: navy,
                    size: 27,
                  ),
                  title: Text(
                    title,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  trailing: const Icon(Icons.chevron_left),
                  onTap: onTap,
                ),
              );
            }
          }

          class SearchPage extends StatefulWidget {
            const SearchPage({super.key});

            @override
            State<SearchPage> createState() => _SearchPageState();
          }

          class _SearchPageState extends State<SearchPage> {
            final TextEditingController controller =
                TextEditingController();

            List<dynamic> results = [];
            bool loading = false;

            Future<void> search() async {
              final query = controller.text.trim();

              if (query.isEmpty) return;

              setState(() => loading = true);

              try {
                final response = await http.get(
                  Uri.parse(
                    '$siteUrl/wp-json/wp/v2/search?search=${Uri.encodeQueryComponent(query)}&per_page=20',
                  ),
                );

                if (response.statusCode == 200) {
                  setState(() {
                    results = jsonDecode(response.body);
                    loading = false;
                  });
                } else {
                  setState(() => loading = false);
                }
              } catch (_) {
                setState(() => loading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('جست‌وجو'),
                ),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(16),
                      child: TextField(
                        controller: controller,
                        textInputAction: TextInputAction.search,
                        onSubmitted: (_) => search(),
                        decoration: InputDecoration(
                          hintText: 'موضوع مورد نظر را جست‌وجو کنید...',
                          prefixIcon: const Icon(Icons.search),
                          suffixIcon: IconButton(
                            icon: const Icon(Icons.arrow_forward),
                            onPressed: search,
                          ),
                          filled: true,
                          fillColor: Colors.white,
                          border: OutlineInputBorder(
                            borderRadius: BorderRadius.circular(17),
                            borderSide: BorderSide.none,
                          ),
                        ),
                      ),
                    ),
                    if (loading)
                      const Padding(
                        padding: EdgeInsets.all(20),
                        child: CircularProgressIndicator(),
                      ),
                    Expanded(
                      child: ListView.builder(
                        padding: const EdgeInsets.symmetric(horizontal: 16),
                        itemCount: results.length,
                        itemBuilder: (context, index) {
                          final item = results[index];

                          return Card(
                            margin: const EdgeInsets.only(bottom: 10),
                            shape: RoundedRectangleBorder(
                              borderRadius: BorderRadius.circular(16),
                            ),
                            child: ListTile(
                              title: Text(
                                item['title'] ?? '',
                                style: const TextStyle(
                                  fontWeight: FontWeight.bold,
                                ),
                              ),
                              trailing:
                                  const Icon(Icons.chevron_left),
                              onTap: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => WebPage(
                                      url: item['url'] ?? siteUrl,
                                      title: item['title'] ?? '',
                                    ),
                                  ),
                                );
                              },
                            ),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class WebPage extends StatefulWidget {
            final String url;
            final String title;

            const WebPage({
              super.key,
              required this.url,
              required this.title,
            });

            @override
            State<WebPage> createState() => _WebPageState();
          }

          class _WebPageState extends State<WebPage> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(Colors.white)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onNavigationRequest: (request) {
                      final url = request.url;

                      if (url.startsWith(siteUrl) ||
                          url.startsWith('https://t.me')) {
                        return NavigationDecision.navigate;
                      }

                      launchUrl(
                        Uri.parse(url),
                        mode: LaunchMode.externalApplication,
                      );

                      return NavigationDecision.prevent;
                    },
                  ),
                )
                ..loadRequest(Uri.parse(widget.url));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(
                    widget.title,
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                  ),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.refresh),
                      onPressed: () => controller.reload(),
                    ),
                  ],
                ),
                body: WebViewWidget(
                  controller: controller,
                ),
              );
            }
          }
          EOF

      - name: Remove default tests
        run: rm -rf app/test

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-release.apk release/itarbiatbadani.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-modern-apk
          path: release/itarbiatbadani.apk
