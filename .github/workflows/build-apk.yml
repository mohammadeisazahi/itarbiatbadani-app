          class _CategoryTile
              extends StatelessWidget {

            final CategoryItem category;

            final Map<int,
                    List<CategoryItem>>
                children;


            const _CategoryTile({
              required this.category,
              required this.children,
            });


            @override
            Widget build(
              BuildContext context,
            ) {

              final subCategories =
                  children[category.id] ??
                      [];


              if (subCategories.isEmpty) {

                return Card(

                  elevation: 0,

                  margin:
                      const EdgeInsets.only(
                    bottom: 10,
                  ),

                  child:
                      ListTile(

                    leading:
                        CircleAvatar(

                      backgroundColor:
                          primaryColor.withValues(
                        alpha: .1,
                      ),

                      child:
                          Icon(
                        categoryIcon(
                          category.name,
                        ),
                        color:
                            primaryColor,
                      ),
                    ),

                    title:
                        Text(
                      category.name,
                      style:
                          const TextStyle(
                        fontWeight:
                            FontWeight.bold,
                      ),
                    ),

                    subtitle:
                        Text(
                      '${category.count} مطلب',
                    ),

                    trailing:
                        const Icon(
                      Icons.chevron_left,
                    ),

                    onTap: () {

                      Navigator.push(
                        context,
                        MaterialPageRoute(
                          builder: (_) =>
                              CategoryPostsPage(
                            category:
                                category,
                          ),
                        ),
                      );
                    },
                  ),
                );
              }


              return Card(

                elevation: 0,

                margin:
                    const EdgeInsets.only(
                  bottom: 10,
                ),

                clipBehavior:
                    Clip.antiAlias,

                child:
                    ExpansionTile(

                  leading:
                      CircleAvatar(

                    backgroundColor:
                        primaryColor.withValues(
                      alpha: .1,
                    ),

                    child:
                        Icon(
                      categoryIcon(
                        category.name,
                      ),
                      color:
                          primaryColor,
                    ),
                  ),

                  title:
                      Text(
                    category.name,
                    style:
                        const TextStyle(
                      fontWeight:
                          FontWeight.bold,
                    ),
                  ),

                  subtitle:
                      Text(
                    '${category.count} مطلب',
                  ),


                  children: [

                    ListTile(

                      title:
                          const Text(
                        'مشاهده مطالب این دسته',
                      ),

                      leading:
                          const Icon(
                        Icons.article_outlined,
                        color:
                            secondaryColor,
                      ),

                      onTap: () {

                        Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (_) =>
                                CategoryPostsPage(
                              category:
                                  category,
                            ),
                          ),
                        );
                      },
                    ),


                    ...subCategories.map(
                      (child) {

                        return ListTile(

                          contentPadding:
                              const EdgeInsets.symmetric(
                            horizontal: 28,
                          ),

                          leading:
                              Icon(
                            categoryIcon(
                              child.name,
                            ),
                            color:
                                secondaryColor,
                          ),

                          title:
                              Text(
                            child.name,
                          ),

                          subtitle:
                              Text(
                            '${child.count} مطلب',
                          ),

                          trailing:
                              const Icon(
                            Icons.chevron_left,
                          ),

                          onTap: () {

                            Navigator.push(
                              context,
                              MaterialPageRoute(
                                builder: (_) =>
                                    CategoryPostsPage(
                                  category:
                                      child,
                                ),
                              ),
                            );
                          },
                        );
                      },
                    ),
                  ],
                ),
              );
            }
          }


