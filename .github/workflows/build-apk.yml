      - name: Android Internet Permission
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission
              )

          p.write_text(text)
          PY

      - name: Set App Name
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          text = text.replace(
              'android:label="itarbiatbadani_app"',
              'android:label="تربیت بدنی و علوم ورزشی"'
          )

          p.write_text(text)
          PY

      - name: Get Packages
        working-directory: app
        run: flutter pub get

      - name: Generate App Icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-professional-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
