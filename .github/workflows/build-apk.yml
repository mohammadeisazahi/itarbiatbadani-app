/**
 * تربیت بدنی و علوم ورزشی
 * WooCommerce Customer Registration
 *
 * فیلدها:
 * نام
 * نام خانوادگی
 * ایمیل
 * شماره تماس
 * رمز عبور
 */

/* -----------------------------------------
 * اضافه کردن نام و نام خانوادگی
 * ----------------------------------------- */

add_action(
    'woocommerce_register_form_start',
    'itarbiat_register_name_fields'
);

function itarbiat_register_name_fields() {
    ?>

    <p class="form-row form-row-first">
        <label for="reg_first_name">
            نام <span class="required">*</span>
        </label>

        <input
            type="text"
            class="input-text"
            name="first_name"
            id="reg_first_name"
            autocomplete="given-name"
            value="<?php
                if ( ! empty( $_POST['first_name'] ) ) {
                    echo esc_attr(
                        wp_unslash(
                            $_POST['first_name']
                        )
                    );
                }
            ?>"
            required
        />
    </p>

    <p class="form-row form-row-last">
        <label for="reg_last_name">
            نام خانوادگی <span class="required">*</span>
        </label>

        <input
            type="text"
            class="input-text"
            name="last_name"
            id="reg_last_name"
            autocomplete="family-name"
            value="<?php
                if ( ! empty( $_POST['last_name'] ) ) {
                    echo esc_attr(
                        wp_unslash(
                            $_POST['last_name']
                        )
                    );
                }
            ?>"
            required
        />
    </p>

    <div class="clear"></div>

    <?php
}


/* -----------------------------------------
 * اضافه کردن شماره تماس
 * ----------------------------------------- */

add_action(
    'woocommerce_register_form',
    'itarbiat_register_phone_field'
);

function itarbiat_register_phone_field() {
    ?>

    <p class="form-row form-row-wide">
        <label for="reg_billing_phone">
            شماره تماس <span class="required">*</span>
        </label>

        <input
            type="tel"
            class="input-text"
            name="billing_phone"
            id="reg_billing_phone"
            autocomplete="tel"
            value="<?php
                if ( ! empty( $_POST['billing_phone'] ) ) {
                    echo esc_attr(
                        wp_unslash(
                            $_POST['billing_phone']
                        )
                    );
                }
            ?>"
            required
        />
    </p>

    <?php
}


/* -----------------------------------------
 * اعتبارسنجی
 * ----------------------------------------- */

add_filter(
    'woocommerce_registration_errors',
    'itarbiat_validate_registration_fields',
    10,
    3
);

function itarbiat_validate_registration_fields(
    $errors,
    $username,
    $email
) {

    if (
        empty(
            $_POST['first_name']
        )
    ) {
        $errors->add(
            'first_name_error',
            'لطفاً نام خود را وارد کنید.'
        );
    }

    if (
        empty(
            $_POST['last_name']
        )
    ) {
        $errors->add(
            'last_name_error',
            'لطفاً نام خانوادگی خود را وارد کنید.'
        );
    }

    if (
        empty(
            $_POST['billing_phone']
        )
    ) {
        $errors->add(
            'phone_error',
            'لطفاً شماره تماس خود را وارد کنید.'
        );
    }

    return $errors;
}


/* -----------------------------------------
 * ذخیره اطلاعات کاربر
 * ----------------------------------------- */

add_action(
    'woocommerce_created_customer',
    'itarbiat_save_registration_fields'
);

function itarbiat_save_registration_fields(
    $customer_id
) {

    if (
        isset(
            $_POST['first_name']
        )
    ) {
        update_user_meta(
            $customer_id,
            'first_name',
            sanitize_text_field(
                wp_unslash(
                    $_POST['first_name']
                )
            )
        );
    }

    if (
        isset(
            $_POST['last_name']
        )
    ) {
        update_user_meta(
            $customer_id,
            'last_name',
            sanitize_text_field(
                wp_unslash(
                    $_POST['last_name']
                )
            )
        );
    }

    if (
        isset(
            $_POST['billing_phone']
        )
    ) {
        update_user_meta(
            $customer_id,
            'billing_phone',
            sanitize_text_field(
                wp_unslash(
                    $_POST['billing_phone']
                )
            )
        );
    }
}


/* -----------------------------------------
 * جلوگیری از خرید به عنوان مهمان
 * ----------------------------------------- */

add_filter(
    'woocommerce_checkout_registration_required',
    '__return_true'
);


/* -----------------------------------------
 * اگر کاربر وارد نشده باشد و بخواهد
 * مستقیم به پرداخت برود، به حساب کاربری برود
 * ----------------------------------------- */

add_action(
    'template_redirect',
    'itarbiat_require_login_before_checkout'
);

function itarbiat_require_login_before_checkout() {

    if (
        is_checkout()
        &&
        ! is_user_logged_in()
        &&
        ! is_wc_endpoint_url(
            'order-received'
        )
    ) {

        wp_safe_redirect(
            wc_get_page_permalink(
                'myaccount'
            )
        );

        exit;
    }
}
