```yaml
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --project-name itarbiatbadani_app app

      - name: Add WebView
        working-directory: app
        run: |
          flutter pub add webview_flutter

      - name: Configure Android Internet Permission
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission
              )

          p.write_text(text)
          PY

      - name: Create Main App
        working-directory: app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'تربیت بدنی و علوم ورزشی',
                theme: ThemeData(
                  useMaterial3: true,
                ),
                home: const WebsitePage(),
              );
            }
          }

          class WebsitePage extends StatefulWidget {
            const WebsitePage({super.key});

            @override
            State<WebsitePage> createState() => _WebsitePageState();
          }

          class _WebsitePageState extends State<WebsitePage> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (url) {},
                    onPageFinished: (url) {},
                  ),
                )
                ..loadRequest(
                  Uri.parse('https://itarbiatbadani.ir'),
                );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: WebViewWidget(
                    controller: controller,
                  ),
                ),
              );
            }
          }
          EOF

      - name: Set App Name
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          text = text.replace(
              'android:label="itarbiatbadani_app"',
              'android:label="تربیت بدنی و علوم ورزشی"'
          )

          text = text.replace(
              'android:label="${applicationName}"',
              'android:label="تربیت بدنی و علوم ورزشی"'
          )

          p.write_text(text)
          PY

      - name: Get Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
```
