/* ---------------- POST CARD ---------------- */

class PostCard extends StatelessWidget {
  final dynamic post;

  const PostCard({
    super.key,
    required this.post,
  });

  @override
  Widget build(BuildContext context) {
    final p = post as Map<String, dynamic>;

    final title = cleanHtml(
      p['title']?['rendered'] ?? '',
    );

    final excerpt = cleanHtml(
      p['excerpt']?['rendered'] ?? '',
    );

    final image = postImage(p);

    final link = p['link'] ?? siteUrl;

    return Material(
      color: Colors.white,
      borderRadius: BorderRadius.circular(20),
      child: InkWell(
        borderRadius: BorderRadius.circular(20),
        onTap: () => openExternal(link),
        child: Container(
          padding: const EdgeInsets.all(10),
          decoration: BoxDecoration(
            borderRadius: BorderRadius.circular(20),
            border: Border.all(
              color: const Color(0xFFE5EBEF),
            ),
          ),
          child: Row(
            children: [
              ClipRRect(
                borderRadius: BorderRadius.circular(14),
                child: image != null
                    ? Image.network(
                        image,
                        width: 105,
                        height: 92,
                        fit: BoxFit.cover,
                        errorBuilder:
                            (_, __, ___) =>
                                imagePlaceholder(),
                      )
                    : imagePlaceholder(),
              ),
              const SizedBox(width: 13),
              Expanded(
                child: Column(
                  crossAxisAlignment:
                      CrossAxisAlignment.start,
                  children: [
                    Text(
                      title,
                      maxLines: 2,
                      overflow: TextOverflow.ellipsis,
                      style: const TextStyle(
                        fontSize: 15,
                        height: 1.45,
                        fontWeight: FontWeight.w900,
                        color: dark,
                      ),
                    ),
                    if (excerpt.isNotEmpty) ...[
                      const SizedBox(height: 7),
                      Text(
                        excerpt,
                        maxLines: 2,
                        overflow: TextOverflow.ellipsis,
                        style: const TextStyle(
                          fontSize: 11.5,
                          height: 1.5,
                          color: muted,
                        ),
                      ),
                    ],
                    const SizedBox(height: 8),
                    const Row(
                      children: [
                        Text(
                          'مطالعه مطلب',
                          style: TextStyle(
                            color: navy,
                            fontSize: 11,
                            fontWeight: FontWeight.w800,
                          ),
                        ),
                        SizedBox(width: 4),
                        Icon(
                          Icons.arrow_back_rounded,
                          color: navy,
                          size: 15,
                        ),
                      ],
                    ),
                  ],
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }

  Widget imagePlaceholder() {
    return Container(
      width: 105,
      height: 92,
      color: navy.withValues(alpha: .07),
      child: const Icon(
        Icons.article_outlined,
        color: navy,
        size: 30,
      ),
    );
  }
}

/* ---------------- CATEGORIES ---------------- */

class CategoriesPage extends StatefulWidget {
  const CategoriesPage({super.key});

  @override
  State<CategoriesPage> createState() =>
      _CategoriesPageState();
}

class _CategoriesPageState
    extends State<CategoriesPage> {
  late Future<List<dynamic>> future;

  @override
  void initState() {
    super.initState();
    future = Api.categories();
  }

  @override
  Widget build(BuildContext context) {
    return SafeArea(
      child: Column(
        children: [
          const ModernHeader(
            title: 'مطالب',
            subtitle: 'دسته‌بندی واقعی مطالب سایت',
          ),
          Expanded(
            child: FutureBuilder<List<dynamic>>(
              future: future,
              builder: (context, snapshot) {
                if (snapshot.connectionState ==
                    ConnectionState.waiting) {
                  return const Center(
                    child: CircularProgressIndicator(),
                  );
                }

                if (snapshot.hasError) {
                  return ErrorBox(
                    message:
                        'دسته‌بندی‌ها دریافت نشدند.',
                    onRetry: () {
                      setState(() {
                        future = Api.categories();
                      });
                    },
                  );
                }

                final all = snapshot.data ?? [];

                final roots = all
                    .where(
                      (category) =>
                          category['parent'] == 0,
                    )
                    .toList();

                return RefreshIndicator(
                  onRefresh: () async {
                    setState(() {
                      future = Api.categories();
                    });
                    await future;
                  },
                  child: GridView.builder(
                    physics:
                        const AlwaysScrollableScrollPhysics(),
                    padding: const EdgeInsets.fromLTRB(
                      20,
                      10,
                      20,
                      30,
                    ),
                    gridDelegate:
                        const SliverGridDelegateWithFixedCrossAxisCount(
                      crossAxisCount: 2,
                      crossAxisSpacing: 12,
                      mainAxisSpacing: 12,
                      childAspectRatio: 1.12,
                    ),
                    itemCount: roots.length,
                    itemBuilder: (_, index) {
                      final category =
                          roots[index]
                              as Map<String, dynamic>;

                      return CategoryCard(
                        category: category,
                        index: index,
                        onTap: () {
                          Navigator.push(
                            context,
                            MaterialPageRoute(
                              builder: (_) =>
                                  SubcategoriesPage(
                                category: category,
                                allCategories: all,
                              ),
                            ),
                          );
                        },
                      );
                    },
                  ),
                );
              },
            ),
          ),
        ],
      ),
    );
  }
}

