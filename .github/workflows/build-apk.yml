name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          rm -rf app
          flutter create --project-name itarbiatbadani_app app

      - name: Add packages
        working-directory: app
        run: |
          flutter pub add http
          flutter pub add webview_flutter
          flutter pub add url_launcher
          flutter pub add flutter_launcher_icons

      - name: Configure launcher icon
        working-directory: app
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/logo.png"
            adaptive_icon_background: "#0A3D62"
            adaptive_icon_foreground: "assets/logo.png"
          EOF

      - name: Prepare logo
        working-directory: app
        run: |
          mkdir -p assets
          curl -L \
            "https://itarbiatbadani.ir/wp-content/uploads/2025/07/1000073463.png" \
            -o assets/logo.png

      - name: Write main.dart
        working-directory: app
        run: |
          cat > lib/main.dart <<'DART'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:url_launcher/url_launcher.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          const String siteUrl = 'https://itarbiatbadani.ir';
          const String telegramUrl = 'https://t.me/itarbiatbadani';

          const Color navy = Color(0xFF0A3D62);
          const Color blue = Color(0xFF3C6382);
          const Color gold = Color(0xFFFBC531);
          const Color background = Color(0xFFF5F7FA);

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const SportsApp());
          }

          class SportsApp extends StatelessWidget {
            const SportsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'تربیت بدنی و علوم ورزشی',
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: background,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: navy,
                    primary: navy,
                  ),
                  fontFamily: 'sans',
                ),
                home: const MainNavigation(),
              );
            }
          }

          class MainNavigation extends StatefulWidget {
            const MainNavigation({super.key});

            @override
            State<MainNavigation> createState() => _MainNavigationState();
          }

          class _MainNavigationState extends State<MainNavigation> {
            int index = 0;

            final pages = const [
              HomePage(),
              CategoriesPage(),
              StorePage(),
              TelegramPage(),
              MorePage(),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: IndexedStack(
                  index: index,
                  children: pages,
                ),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: index,
                  backgroundColor: Colors.white,
                  indicatorColor: gold.withValues(alpha: .25),
                  onDestinationSelected: (value) {
                    setState(() => index = value);
                  },
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.home_outlined),
                      selectedIcon: Icon(Icons.home),
                      label: 'خانه',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.grid_view_outlined),
                      selectedIcon: Icon(Icons.grid_view),
                      label: 'دسته‌بندی',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.shopping_bag_outlined),
                      selectedIcon: Icon(Icons.shopping_bag),
                      label: 'فروشگاه',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.send_outlined),
                      selectedIcon: Icon(Icons.send),
                      label: 'تلگرام',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.more_horiz),
                      selectedIcon: Icon(Icons.more_horiz),
                      label: 'بیشتر',
                    ),
                  ],
                ),
              );
            }
          }

          class AppHeader extends StatelessWidget {
            final String title;
            final String? subtitle;

            const AppHeader({
              super.key,
              required this.title,
              this.subtitle,
            });

            @override
            Widget build(BuildContext context) {
              return Container(
                width: double.infinity,
                padding: const EdgeInsets.fromLTRB(20, 55, 20, 25),
                decoration: const BoxDecoration(
                  gradient: LinearGradient(
                    colors: [navy, blue],
                    begin: Alignment.topRight,
                    end: Alignment.bottomLeft,
                  ),
                  borderRadius: BorderRadius.only(
                    bottomLeft: Radius.circular(28),
                    bottomRight: Radius.circular(28),
                  ),
                ),
                child: Row(
                  children: [
                    Container(
                      width: 58,
                      height: 58,
                      padding: const EdgeInsets.all(7),
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(17),
                      ),
                      child: Image.network(
                        'https://itarbiatbadani.ir/wp-content/uploads/2025/07/1000073463.png',
                        fit: BoxFit.contain,
                        errorBuilder: (_, __, ___) =>
                            const Icon(Icons.sports, color: navy, size: 34),
                      ),
                    ),
                    const SizedBox(width: 14),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            title,
                            style: const TextStyle(
                              color: Colors.white,
                              fontSize: 20,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          if (subtitle != null) ...[
                            const SizedBox(height: 5),
                            Text(
                              subtitle!,
                              style: const TextStyle(
                                color: Colors.white70,
                                fontSize: 12,
                              ),
                            ),
                          ],
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class HomePage extends StatelessWidget {
            const HomePage({super.key});

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                top: false,
                child: SingleChildScrollView(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const AppHeader(
                        title: 'تربیت بدنی و علوم ورزشی',
                        subtitle: 'مرجع تخصصی تربیت بدنی و علوم ورزشی',
                      ),

                      Padding(
                        padding: const EdgeInsets.all(18),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text(
                              'دسترسی سریع',
                              style: TextStyle(
                                fontSize: 20,
                                fontWeight: FontWeight.bold,
                                color: navy,
                              ),
                            ),
                            const SizedBox(height: 14),

                            Row(
                              children: [
                                Expanded(
                                  child: QuickCard(
                                    icon: Icons.menu_book_rounded,
                                    title: 'مطالب آموزشی',
                                    onTap: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) =>
                                              const CategoriesPage(),
                                        ),
                                      );
                                    },
                                  ),
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: QuickCard(
                                    icon: Icons.shopping_bag_rounded,
                                    title: 'فروشگاه',
                                    onTap: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) =>
                                              const StorePage(),
                                        ),
                                      );
                                    },
                                  ),
                                ),
                              ],
                            ),

                            const SizedBox(height: 12),

                            Row(
                              children: [
                                Expanded(
                                  child: QuickCard(
                                    icon: Icons.send_rounded,
                                    title: 'کانال تلگرام',
                                    onTap: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) =>
                                              const TelegramPage(),
                                        ),
                                      );
                                    },
                                  ),
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: QuickCard(
                                    icon: Icons.language_rounded,
                                    title: 'وب‌سایت',
                                    onTap: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) => WebPage(
                                            url: siteUrl,
                                            title: 'وب‌سایت',
                                          ),
                                        ),
                                      );
                                    },
                                  ),
                                ),
                              ],
                            ),

                            const SizedBox(height: 28),

                            Container(
                              width: double.infinity,
                              padding: const EdgeInsets.all(20),
                              decoration: BoxDecoration(
                                gradient: const LinearGradient(
                                  colors: [navy, blue],
                                  begin: Alignment.topRight,
                                  end: Alignment.bottomLeft,
                                ),
                                borderRadius: BorderRadius.circular(24),
                              ),
                              child: const Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Icon(
                                    Icons.auto_awesome,
                                    color: gold,
                                    size: 30,
                                  ),
                                  SizedBox(height: 12),
                                  Text(
                                    'همه مطالب تخصصی ورزش در یک اپلیکیشن',
                                    style: TextStyle(
                                      color: Colors.white,
                                      fontSize: 20,
                                      fontWeight: FontWeight.bold,
                                    ),
                                  ),
                                  SizedBox(height: 8),
                                  Text(
                                    'مقالات، منابع، طرح درس، فایل‌های ورزشی و آخرین مطالب کانال',
                                    style: TextStyle(
                                      color: Colors.white70,
                                      fontSize: 13,
                                      height: 1.7,
                                    ),
                                  ),
                                ],
                              ),
                            ),

                            const SizedBox(height: 28),

                            const Text(
                              'آخرین مطالب سایت',
                              style: TextStyle(
                                fontSize: 20,
                                fontWeight: FontWeight.bold,
                                color: navy,
                              ),
                            ),

                            const SizedBox(height: 12),

                            ArticleCard(
                              title: 'جدیدترین مطالب تربیت بدنی و علوم ورزشی',
                              onTap: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => WebPage(
                                      url: siteUrl,
                                      title: 'مطالب سایت',
                                    ),
                                  ),
                                );
                              },
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class QuickCard extends StatelessWidget {
            final IconData icon;
            final String title;
            final VoidCallback onTap;

            const QuickCard({
              super.key,
              required this.icon,
              required this.title,
              required this.onTap,
            });

            @override
            Widget build(BuildContext context) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(20),
                child: Container(
                  padding: const EdgeInsets.symmetric(
                    horizontal: 15,
                    vertical: 20,
                  ),
                  decoration: BoxDecoration(
                    color: Colors.white,
                    borderRadius: BorderRadius.circular(20),
                    boxShadow: [
                      BoxShadow(
                        color: Colors.black.withValues(alpha: .06),
                        blurRadius: 15,
                        offset: const Offset(0, 6),
                      ),
                    ],
                  ),
                  child: Column(
                    children: [
                      Container(
                        width: 52,
                        height: 52,
                        decoration: BoxDecoration(
                          color: navy.withValues(alpha: .09),
                          shape: BoxShape.circle,
                        ),
                        child: Icon(
                          icon,
                          color: navy,
                          size: 27,
                        ),
                      ),
                      const SizedBox(height: 10),
                      Text(
                        title,
                        textAlign: TextAlign.center,
                        style: const TextStyle(
                          fontWeight: FontWeight.bold,
                          fontSize: 13,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class ArticleCard extends StatelessWidget {
            final String title;
            final VoidCallback onTap;

            const ArticleCard({
              super.key,
              required this.title,
              required this.onTap,
            });

            @override
            Widget build(BuildContext context) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(18),
                child: Container(
                  padding: const EdgeInsets.all(17),
                  decoration: BoxDecoration(
                    color: Colors.white,
                    borderRadius: BorderRadius.circular(18),
                    boxShadow: [
                      BoxShadow(
                        color: Colors.black.withValues(alpha: .05),
                        blurRadius: 12,
                        offset: const Offset(0, 5),
                      ),
                    ],
                  ),
                  child: Row(
                    children: [
                      Container(
                        width: 50,
                        height: 50,
                        decoration: BoxDecoration(
                          color: gold.withValues(alpha: .18),
                          borderRadius: BorderRadius.circular(15),
                        ),
                        child: const Icon(
                          Icons.article_outlined,
                          color: navy,
                        ),
                      ),
                      const SizedBox(width: 14),
                      Expanded(
                        child: Text(
                          title,
                          style: const TextStyle(
                            fontWeight: FontWeight.bold,
                            fontSize: 14,
                          ),
                        ),
                      ),
                      const Icon(
                        Icons.arrow_back_ios_new,
                        size: 16,
                        color: blue,
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class Category {
            final int id;
            final String name;
            final int parent;
            final String link;

            Category({
              required this.id,
              required this.name,
              required this.parent,
              required this.link,
            });

            factory Category.fromJson(Map<String, dynamic> json) {
              return Category(
                id: json['id'] ?? 0,
                name: json['name'] ?? '',
                parent: json['parent'] ?? 0,
                link: json['link'] ?? siteUrl,
              );
            }
          }

          Future<List<Category>> getCategories() async {
            final response = await http.get(
              Uri.parse(
                '$siteUrl/wp-json/wp/v2/categories?per_page=100&hide_empty=true',
              ),
            );

            if (response.statusCode != 200) {
              throw Exception('خطا در دریافت دسته‌بندی‌ها');
            }

            final data = jsonDecode(response.body) as List;

            return data
                .map((item) => Category.fromJson(item))
                .toList();
          }

          class CategoriesPage extends StatelessWidget {
            const CategoriesPage({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  top: false,
                  child: Column(
                    children: [
                      const AppHeader(
                        title: 'دسته‌بندی مطالب',
                        subtitle: 'دسترسی سریع به مطالب تخصصی',
                      ),
                      Expanded(
                        child: FutureBuilder<List<Category>>(
                          future: getCategories(),
                          builder: (context, snapshot) {
                            if (snapshot.connectionState ==
                                ConnectionState.waiting) {
                              return const Center(
                                child: CircularProgressIndicator(),
                              );
                            }

                            if (snapshot.hasError) {
                              return Center(
                                child: Padding(
                                  padding: const EdgeInsets.all(25),
                                  child: Column(
                                    mainAxisAlignment: MainAxisAlignment.center,
                                    children: [
                                      const Icon(
                                        Icons.cloud_off,
                                        size: 55,
                                        color: blue,
                                      ),
                                      const SizedBox(height: 15),
                                      const Text(
                                        'دریافت دسته‌بندی‌ها انجام نشد.',
                                        textAlign: TextAlign.center,
                                      ),
                                      const SizedBox(height: 15),
                                      ElevatedButton(
                                        onPressed: () {
                                          Navigator.pushReplacement(
                                            context,
                                            MaterialPageRoute(
                                              builder: (_) =>
                                                  const CategoriesPage(),
                                            ),
                                          );
                                        },
                                        child: const Text('تلاش دوباره'),
                                      ),
                                    ],
                                  ),
                                ),
                              );
                            }

                            final categories = snapshot.data ?? [];

                            final mainCategories = categories
                                .where(
                                  (category) =>
                                      category.parent == 0 &&
                                      category.name != 'محصولات' &&
                                      category.name != 'فایل های رایگان',
                                )
                                .toList();

                            return ListView.builder(
                              padding: const EdgeInsets.all(18),
                              itemCount: mainCategories.length,
                              itemBuilder: (context, index) {
                                final category = mainCategories[index];

                                return CategoryCard(
                                  category: category,
                                  onTap: () {
                                    Navigator.push(
                                      context,
                                      MaterialPageRoute(
                                        builder: (_) => SubCategoriesPage(
                                          category: category,
                                          allCategories: categories,
                                        ),
                                      ),
                                    );
                                  },
                                );
                              },
                            );
                          },
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class CategoryCard extends StatelessWidget {
            final Category category;
            final VoidCallback onTap;

            const CategoryCard({
              super.key,
              required this.category,
              required this.onTap,
            });

            @override
            Widget build(BuildContext context) {
              return Container(
                margin: const EdgeInsets.only(bottom: 13),
                child: Material(
                  color: Colors.white,
                  borderRadius: BorderRadius.circular(20),
                  child: InkWell(
                    onTap: onTap,
                    borderRadius: BorderRadius.circular(20),
                    child: Padding(
                      padding: const EdgeInsets.all(17),
                      child: Row(
                        children: [
                          Container(
                            width: 55,
                            height: 55,
                            decoration: BoxDecoration(
                              gradient: const LinearGradient(
                                colors: [navy, blue],
                              ),
                              borderRadius: BorderRadius.circular(17),
                            ),
                            child: const Icon(
                              Icons.folder_rounded,
                              color: Colors.white,
                              size: 28,
                            ),
                          ),
                          const SizedBox(width: 15),
                          Expanded(
                            child: Text(
                              category.name,
                              style: const TextStyle(
                                fontSize: 16,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                          ),
                          const Icon(
                            Icons.arrow_back_ios_new,
                            size: 17,
                            color: blue,
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class SubCategoriesPage extends StatelessWidget {
            final Category category;
            final List<Category> allCategories;

            const SubCategoriesPage({
              super.key,
              required this.category,
              required this.allCategories,
            });

            @override
            Widget build(BuildContext context) {
              final children = allCategories
                  .where((item) => item.parent == category.id)
                  .toList();

              if (children.isEmpty) {
                return WebPage(
                  url: category.link,
                  title: category.name,
                );
              }

              return Scaffold(
                body: SafeArea(
                  top: false,
                  child: Column(
                    children: [
                      AppHeader(
                        title: category.name,
                        subtitle: 'زیرمجموعه‌ها',
                      ),
                      Expanded(
                        child: ListView.builder(
                          padding: const EdgeInsets.all(18),
                          itemCount: children.length,
                          itemBuilder: (context, index) {
                            final child = children[index];

                            return CategoryCard(
                              category: child,
                              onTap: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => SubCategoriesPage(
                                      category: child,
                                      allCategories: allCategories,
                                    ),
                                  ),
                                );
                              },
                            );
                          },
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class StorePage extends StatelessWidget {
            const StorePage({super.key});

            final List<Map<String, String>> storeCategories = const [
              {
                'name': 'طرح درس ورزشی',
                'slug': 'tarh-dars-varzeshi',
              },
              {
                'name': 'پی دی اف ورزشی',
                'slug': 'pdf-varzeshi',
              },
              {
                'name': 'پاورپوینت ورزشی',
                'slug': 'powerpoint-varzeshi',
              },
              {
                'name': 'فایل های رایگان',
                'slug': 'free-files',
              },
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  top: false,
                  child: Column(
                    children: [
                      const AppHeader(
                        title: 'فروشگاه',
                        subtitle: 'فایل‌ها و محصولات ورزشی',
                      ),
                      Expanded(
                        child: ListView(
                          padding: const EdgeInsets.all(18),
                          children: [
                            const Text(
                              'دسته‌بندی محصولات',
                              style: TextStyle(
                                fontSize: 20,
                                fontWeight: FontWeight.bold,
                                color: navy,
                              ),
                            ),
                            const SizedBox(height: 15),

                            ...storeCategories.map(
                              (item) => StoreCard(
                                title: item['name']!,
                                onTap: () {
                                  Navigator.push(
                                    context,
                                    MaterialPageRoute(
                                      builder: (_) => WebPage(
                                        url:
                                            '$siteUrl/product-category/${item['slug']}/',
                                        title: item['name']!,
                                      ),
                                    ),
                                  );
                                },
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class StoreCard extends StatelessWidget {
            final String title;
            final VoidCallback onTap;

            const StoreCard({
              super.key,
              required this.title,
              required this.onTap,
            });

            @override
            Widget build(BuildContext context) {
              return Container(
                margin: const EdgeInsets.only(bottom: 14),
                child: Material(
                  color: Colors.white,
                  borderRadius: BorderRadius.circular(22),
                  child: InkWell(
                    onTap: onTap,
                    borderRadius: BorderRadius.circular(22),
                    child: Padding(
                      padding: const EdgeInsets.all(18),
                      child: Row(
                        children: [
                          Container(
                            width: 58,
                            height: 58,
                            decoration: BoxDecoration(
                              gradient: const LinearGradient(
                                colors: [navy, blue],
                              ),
                              borderRadius: BorderRadius.circular(18),
                            ),
                            child: const Icon(
                              Icons.shopping_bag,
                              color: Colors.white,
                              size: 28,
                            ),
                          ),
                          const SizedBox(width: 15),
                          Expanded(
                            child: Text(
                              title,
                              style: const TextStyle(
                                fontSize: 16,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                          ),
                          const Icon(
                            Icons.arrow_back_ios_new,
                            size: 17,
                            color: gold,
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class TelegramPage extends StatelessWidget {
            const TelegramPage({super.key});

            @override
            Widget build(BuildContext context) {
              return WebPage(
                url: 'https://t.me/s/itarbiatbadani',
                title: 'کانال تلگرام',
              );
            }
          }

          class MorePage extends StatelessWidget {
            const MorePage({super.key});

            Future<void> open(String url) async {
              final uri = Uri.parse(url);
              await launchUrl(
                uri,
                mode: LaunchMode.externalApplication,
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  top: false,
                  child: Column(
                    children: [
                      const AppHeader(
                        title: 'بیشتر',
                        subtitle: 'ارتباط با تربیت بدنی و علوم ورزشی',
                      ),
                      Expanded(
                        child: ListView(
                          padding: const EdgeInsets.all(18),
                          children: [
                            MoreItem(
                              icon: Icons.language,
                              title: 'وب‌سایت',
                              subtitle: 'itarbiatbadani.ir',
                              onTap: () => open(siteUrl),
                            ),
                            MoreItem(
                              icon: Icons.send,
