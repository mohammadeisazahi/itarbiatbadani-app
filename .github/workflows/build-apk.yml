/* -------------------------------------------------------------------------- */
/*                              CATEGORIES PAGE                               */
/* -------------------------------------------------------------------------- */

class CategoriesPage extends StatelessWidget {
  const CategoriesPage({super.key});

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text(
          'دسته‌بندی‌ها',
          style: TextStyle(
            fontWeight: FontWeight.bold,
          ),
        ),
      ),
      body: FutureBuilder<List<CategoryModel>>(
        future: WordPressApi.categories(),
        builder: (
          context,
          snapshot,
        ) {
          if (snapshot.connectionState ==
              ConnectionState.waiting) {
            return const Center(
              child: CircularProgressIndicator(),
            );
          }

          if (snapshot.hasError) {
            return ErrorBox(
              message:
                  'دریافت دسته‌بندی‌ها با مشکل مواجه شد.',
              onRetry: () {
                Navigator.pushReplacement(
                  context,
                  MaterialPageRoute(
                    builder: (_) => const CategoriesPage(),
                  ),
                );
              },
            );
          }

          final categories = snapshot.data ?? [];

          if (categories.isEmpty) {
            return const EmptyBox(
              message: 'دسته‌بندی‌ای پیدا نشد.',
            );
          }

          final parents = categories
              .where((category) => category.parent == 0)
              .toList();

          final children = categories
              .where((category) => category.parent != 0)
              .toList();

          return RefreshIndicator(
            onRefresh: () async {
              Navigator.pushReplacement(
                context,
                MaterialPageRoute(
                  builder: (_) => const CategoriesPage(),
                ),
              );
            },
            child: ListView(
              padding: const EdgeInsets.all(16),
              children: [
                const Text(
                  'دسته‌بندی‌های مطالب سایت',
                  style: TextStyle(
                    fontSize: 18,
                    fontWeight: FontWeight.bold,
                  ),
                ),
                const SizedBox(height: 8),
                const Text(
                  'دسته‌بندی‌ها مستقیماً از سایت دریافت می‌شوند.',
                  style: TextStyle(
                    color: Colors.grey,
                    fontSize: 12,
                  ),
                ),
                const SizedBox(height: 18),
                ...parents.map(
                  (parent) {
                    final subCategories = children
                        .where(
                          (child) =>
                              child.parent == parent.id,
                        )
                        .toList();

                    return _CategoryTile(
                      category: parent,
                      children: subCategories,
