name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize Bubblewrap
        run: |
          mkdir -p twa
          cd twa
          yes | bubblewrap init --manifest https://mohammadeisazahi.github.io/itarbiatbadani_app/manifest.json

      - name: Build APK
        run: |
          cd twa
          yes | bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: itarbiatbadani-apk
          path: twa/*.apk
          if-no-files-found: error
